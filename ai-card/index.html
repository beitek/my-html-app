<script>
/* ================================================================
   进度持久化(v3) - 加入 achievements 字段
================================================================ */
const STORAGE_KEY = 'ai-cards-progress-v3';
const LEGACY_KEYS = ['ai-cards-progress-v2', 'ai-cards-progress-v1'];

const Progress = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (Array.isArray(d.done)) return {
          done: d.done, log: d.log || {}, daily: d.daily || [],
          achievements: d.achievements || [], updatedAt: d.updatedAt || null
        };
      }
      for (const key of LEGACY_KEYS) {
        const legacy = localStorage.getItem(key);
        if (legacy) {
          const d = JSON.parse(legacy);
          if (Array.isArray(d.done)) return {
            done: d.done, log: d.log || {}, daily: d.daily || [],
            achievements: [], updatedAt: d.updatedAt || null
          };
        }
      }
    } catch (e) { console.warn('读取失败', e); }
    return { done: [], log: {}, daily: [], achievements: [], updatedAt: null };
  },
  save(s) {
    try {
      const data = {
        version: 3,
        done: Array.from(s.done), log: s.log,
        daily: Array.from(s.daily), achievements: Array.from(s.achievements),
        updatedAt: new Date().toISOString(),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return data.updatedAt;
    } catch (e) { return null; }
  },
  reset() { try { localStorage.removeItem(STORAGE_KEY); LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {} }
};

const DIMENSIONS = {
  all:           { name: '全部', color: '#1e293b' },
  critical:      { name: '批判性思考', color: '#8b5cf6', emoji: '🔍' },
  creativity:    { name: '创造力',     color: '#f59e0b', emoji: '✨' },
  communication: { name: '表达力',     color: '#10b981', emoji: '💬' },
  collaboration: { name: '协作力',     color: '#0ea5e9', emoji: '🤝' },
};

/* ================================================================
   200 张卡片 - steps 已细化为可直接执行的脚本
================================================================ */
const CARDS = [
  /* ========== 批判性思考 50 张 ========== */
  { id:'001', dim:'critical', emoji:'🕵️', title:'AI 找茬王', tagline:'让 AI 故意犯错,孩子来当侦探。', difficulty:1, time:'15 分钟', goal:'培养孩子对 AI 输出的"质疑本能"——最底层也最重要的 AI 素养。', setup:'任何一个 AI 对话工具。',
    steps:[
      '和孩子坐下来,让他选一个他最熟悉、最有把握的主题——比如他最爱的一本书、一个游戏、一个球星。越熟越好,底气越足。',
      '打开 AI,输入 prompt:<code>请写一段 150 字介绍 XX,其中故意加入 3 处明显错误(事实错误、张冠李戴、编造细节都行),不要告诉我错在哪。</code>',
      '把 AI 写的文字读给孩子(不要给他看屏幕,纯靠听,更像"侦探听案情"),让他逐句圈出他怀疑的地方,说出理由。',
      '对完答案后,让孩子给自己打分:猜对几个?有没有"冤枉好人"的?最有成就感的发现是哪一个?',
    ],
    tip:'一定要从孩子最懂的领域开始——他越熟悉,越容易建立"我可以挑战 AI"的自信。第一次就让他赢一把。', ext:'升级版:不告诉他错误数量,让他自己判断有几处。更难:让 AI 在 100% 正确和 50% 正确之间随机,孩子都不知道。' },

  { id:'002', dim:'critical', emoji:'🥊', title:'两个 AI 打一架', tagline:'同一个问题,问两个 AI,看谁说得有道理。', difficulty:2, time:'20 分钟', goal:'让孩子意识到:AI 不是真理,只是一种"看法"。',setup:'同时打开两个不同的 AI(比如 ChatGPT + 文心一言,或两家不同的)。',
    steps:[
      '让孩子提一个没有标准答案的问题,比如"小学生该不该有手机""古代人更快乐还是现代人更快乐"。',
      '在两个 AI 里问完全一样的问题,把两份答案并排贴到同一个文档里,方便对照。',
      '让孩子用荧光笔(或两种颜色字体)标出:绿色 = 两边说法一致的点,红色 = 只有一方提到的点,黄色 = 两边相互矛盾的点。',
      '看完标注讨论:两边共识多还是分歧多?哪一方你觉得更有道理?你自己最终的看法是什么?',
    ],
    tip:'重点不是"谁对",而是让孩子亲眼看到"AI 之间会有分歧",AI 的"神性"就破掉了。以后他看到任何一个 AI 答案都会多想一秒。',
    ext:'终极玩法:把 A 的答案喂给 B,问"你同意吗?",再把 B 的反馈喂给 A。看两个 AI 能不能"吵起来"。' },

  { id:'003', dim:'critical', emoji:'❓', title:'追问三连击', tagline:'用三句话,把 AI 逼到墙角。', difficulty:1, time:'10 分钟', goal:'训练"不轻易满足于第一个答案"的本能。', setup:'任意 AI。',
    steps:[
      '让孩子提出一个他好奇的问题,AI 会给一个标准答案——让他先别接受。',
      '追问第一句:<code>你确定吗?有没有可能不是这样?</code>——看 AI 会不会立刻动摇或补充。',
      '追问第二句:<code>为什么会是这样?底层原理是什么?</code>——逼它从"结论"退到"理由"。',
      '追问第三句:<code>有没有反例?或者持不同意见的人会怎么说?</code>——逼它展示视野边界。最后让孩子比较第一版答案和追问后的答案差多少。',
    ],
    tip:'很多孩子不追问,不是不想,是没人教过"可以追问"。这三句话就是启动器——把它们抄在便利贴上,贴在电脑旁边。',
    ext:'把这三句话做成一个孩子专用书签,每次用 AI 都放在手边。一个月后他会自然而然地追问。' },

  { id:'004', dim:'critical', emoji:'⚔️', title:'反方辩手', tagline:'让 AI 站到你的对立面,攻击你的观点。', difficulty:3, time:'25 分钟', goal:'训练"反面思考"——你越能想到别人的反驳,你的观点就越扎实。', setup:'孩子先有一个坚信的观点。',
    steps:[
      '让孩子在纸上写下一个他强烈认同的观点(比如"作业没用"),下面写 3 个他的理由。不准让 AI 看到理由。',
      '对 AI 说:<code>请你扮演完全不同意这个观点的辩手,用最有力的方式逐条反驳。不用讨好我,越狠越好。</code>',
      '孩子认真读反驳全文,规矩是:不许立刻反驳、不许翻白眼、不许说"这不对"。只许标记:哪条反驳击中了我?哪条我能立刻回应?',
      '最后和孩子一起改写原观点——加条件、加例外、加限定。比如"作业没用"可能变成"重复抄写类作业没用,但主动整理的作业有用"。',
    ],
    tip:'关键是"认真对待反方",而不是急着辩赢。能修改自己观点的孩子更强——这是真正的成熟。',
    ext:'反过来玩:AI 先给观点,孩子当反方。进阶:孩子给两种对立观点,让两个 AI 分别扮演双方辩论 3 回合。' },

  { id:'005', dim:'critical', emoji:'📜', title:'名言真伪鉴定师', tagline:'AI 给名言,孩子查真假。', difficulty:1, time:'10 分钟', goal:'破除"白纸黑字就是真的"的惯性。', setup:'AI + 搜索引擎(百度/必应都行)。',
    steps:[
      '选一个历史或现代名人(爱因斯坦、鲁迅、乔布斯),让 AI:<code>请给我 5 句 XX 说过的名言,越出名越好。</code>',
      '让孩子凭直觉先给每句名言打分:很像他说的(✓)、感觉不太像(?)、绝对不是他说的(✗)。',
      '拿出搜索引擎,逐句搜"这句话+真的是他说的吗"或英文原文。记录:AI 的 5 句里,有几句是真的、几句是假的、几句无法确认。',
      '最后追问 AI:<code>刚才的 5 句里哪几句其实不是他说的?你是怎么编出来的?</code>让它自己坦白。',
    ],
    tip:'名人名言是 AI 编造的重灾区——爱因斯坦、鲁迅尤其严重。做一次孩子就记住了:"听到名言先查真伪"。',
    ext:'积累 20 句 AI 编的假名言做成一张海报贴起来——家庭"AI 造假名言集"。' },

  { id:'006', dim:'critical', emoji:'⏳', title:'时间线侦探', tagline:'让 AI 讲一段历史,找出错误。', difficulty:2, time:'20 分钟', goal:'练"时间/因果"的敏感度——历史事件是 AI 经常张冠李戴的地方。', setup:'任意 AI + 一本孩子学过的历史课本做参照。',
    steps:[
      '和孩子一起选一个他课本里学过的历史事件(鸦片战争、大航海、明朝灭亡等)。',
      '让 AI:<code>请详细讲述 XX 事件的完整经过,包括时间、地点、关键人物、转折点,约 300 字。</code>',
      '孩子对照课本,用红笔在 AI 版本上圈错:年份错没错?人物对不对?因果顺序有没有颠倒?至少找出 2 处不一致。',
      '把问题返回给 AI:<code>我对照课本发现你说的 XX 和 YY 不对,请核实并承认错误。</code>看 AI 是认错还是嘴硬。',
    ],
    tip:'AI 会把年份、人物、因果关系轻易弄错——明朝的事挂到清朝,把甲将军的战功算给乙将军,都很常见。和课本一比就露馅。',
    ext:'让 AI 写两个不同时代人物的"见面对话"(比如李白 vs 苏东坡),找穿越漏洞——这类错误更多更搞笑。' },

  { id:'007', dim:'critical', emoji:'📊', title:'数据迷宫', tagline:'AI 给一个数字,你问它:哪来的?', difficulty:2, time:'15 分钟', goal:'训练"数字从不天然可信"的意识。', setup:'任意 AI。',
    steps:[
      '让孩子想一个需要用数字回答的问题,比如"中国现在有多少小学生""地球上还有多少只野生大熊猫"。',
      '问完 AI 后,立刻追问:<code>这个数字是哪一年的数据?来源是什么机构?你有多大把握它是准确的?</code>',
      '继续追问:<code>如果口径不同(比如是否包括国际学校/是否包括圈养),数字会变多少?</code>逼它说出不确定性。',
      '最后去搜索引擎找最新官方数据(国家统计局、世界银行等)对比,看 AI 的数字偏差多大、偏差在哪个方向。',
    ],
    tip:'很多时候 AI 会"装得很确定"地报一个数,逼它交代来源,它才会说"我的知识截止到某年,可能不是最新"。这一步必须每次都做。',
    ext:'做一个"AI 假精确数字"记录本,一周内凡是 AI 报的数字都做一次校验,统计它的准确率。' },

  { id:'008', dim:'critical', emoji:'🔮', title:'预测对照表', tagline:'让 AI 做预测,将来翻出来对。', difficulty:1, time:'10 分钟建立 + 长期', goal:'直观看到 AI 在"未来"上有多保守/乐观/盲。', setup:'一本笔记本或共享文档。',
    steps:[
      '和孩子一起选 3 件有时间节点的事:下周足球赛结果、下次考试成绩预测、明天天气,让 AI 都给出具体预测(分数、比分、温度)。',
      '在笔记本最显眼的一页记下:预测日期、问题、AI 的原话、预测结果的判断日期。',
      '到了判断日期,全家一起翻出来对:对了还是错了?偏差多少?孩子预判是什么、爸妈预判是什么?',
      '每月做一次小结:AI 在哪类预测上更准(有规律的事件)?在哪类上更不准(涉及人的主观判断)?总结规律。',
    ],
    tip:'预测对错不重要,"回来看看"这个动作才重要——它塑造孩子的复盘习惯,让他体会"事实永远高于预测"。',
    ext:'建立家庭"AI 预测记录本",连续记一年,年底做一次大复盘。这是最好的科学精神启蒙。' },

  { id:'009', dim:'critical', emoji:'🌀', title:'反常识清单', tagline:'让 AI 列 10 条"直觉错"的事。', difficulty:2, time:'15 分钟', goal:'挑战孩子的既有认知——批判性思考的前提是承认自己可能错。', setup:'任意 AI。',
    steps:[
      'Prompt:<code>请列出 10 条大部分人凭直觉以为对、但其实是错的常识,每条给一句话结论加一句话原因。</code>',
      '孩子逐条先盖住答案,自己表态:"我本来以为是 ___,我信 AI 的说法吗?"用 ✓?✗ 标三种反应。',
      '从他标 ✗(完全不信)和 ?(半信半疑)的条目里选 3 条,去搜索引擎/百科核实,看 AI 说的对不对。',
      '最后分类汇总:哪几条是真反常识、哪几条是 AI 说得对但表述夸张、哪几条 AI 自己就错了。',
    ],
    tip:'反常识不等于对,还需要再查一层——这正是要让孩子学的。"反常识"三个字自带迷惑性,越反常识的说法越要多问一句"真的?"。',
    ext:'把验证过的真·反常识做成"冷知识"卡片,每周一张贴在餐桌旁,全家一起学。' },

  { id:'010', dim:'critical', emoji:'🔍', title:'盲区扫描', tagline:'AI 说了什么?更重要的是它没说什么。', difficulty:3, time:'20 分钟', goal:'看见"沉默的信息"——AI 的答案背后还有多少它没提的。', setup:'任意 AI。',
    steps:[
      '选一个开放议题(如"手机对孩子的影响""大城市和小城市哪个好"),让 AI 给完整回答。',
      '让孩子读完后,自己想 3 分钟:刚才的回答有没有什么角度被忽略了?比如提到了哪类人群,忽略了哪类?提到了什么时期,忽略了什么时期?',
      '把孩子想到的遗漏角度写下来,然后问 AI:<code>你刚才的回答里遗漏了哪些重要视角?比如 XX 人群的情况、YY 的长期影响。请补全。</code>',
      '对比两次回答,算一下:补全版比原版多出百分之多少内容?这些"被遗漏的"是否比"被说出的"还重要?',
    ],
    tip:'AI 常常只给最主流的答案——这是训练数据偏差。问"你漏了什么"往往能挖出 30% 以上的新内容,而且是更边缘更有趣的。',
    ext:'把遗漏的角度汇总做成"AI 盲区地图",按话题分类,以后再问 AI 类似问题就能提前提示它别漏掉。' },

  { id:'011', dim:'critical', emoji:'🎭', title:'立场标注', tagline:'把 AI 的每句话按立场分色。', difficulty:3, time:'25 分钟', goal:'看见隐藏在"客观"里的立场。', setup:'AI 输出 + 打印稿 + 三色荧光笔。',
    steps:[
      '让 AI 写一篇 300 字关于争议话题的"客观中立"分析,比如"新能源车 vs 传统汽车"。',
      '把文章打印出来(或清晰显示在平板上),给孩子三种颜色的笔:红色 = 支持某一方的表述,蓝色 = 支持对立方的,黄色 = 真·中立。',
      '逐句给每一句话涂上一种颜色——要求每句必须有颜色,不许跳过。涂完数一下三种颜色的比例。',
      '让孩子回答:这篇"中立"文章其实偏向哪一方?哪些词或修辞手法暴露了倾向?(比如"虽然...但是..."的转折往往指向后者。)',
    ],
    tip:'AI 写"客观"文章其实不客观,它受训练数据影响有隐藏倾向。三色法能把这种倾向可视化——是媒介素养的绝佳入门。',
    ext:'同话题换个 prompt(比如让 AI 扮演某方支持者),再做一次三色标注,看立场色块比例怎么变化。' },

  { id:'012', dim:'critical', emoji:'🪩', title:'幻觉实验室', tagline:'故意让 AI 胡说,研究它怎么胡说。', difficulty:2, time:'15 分钟', goal:'亲眼看见"幻觉"长什么样——才不会被骗。', setup:'任意 AI。',
    steps:[
      '和孩子一起编一个听上去很真实但不存在的书名,比如《明朝的最后一个铁匠》,作者也编一个。',
      '问 AI:<code>能介绍一下《XX》这本书吗?主要内容是什么?作者是谁?</code>观察 AI 是说"没听说过"还是硬编内容。',
      '如果 AI 硬编,继续追问细节:主角是谁?出版社?出版年份?获得过什么奖?看它编到什么程度。',
      '把编造内容和孩子一起整理出来,分析:AI 在哪一步开始编的?编的内容有什么共同特征?(往往是"看起来合理、细节充分、情感丰沛")。',
    ],
    tip:'让孩子记住这种"编得像真的"的质感——朗朗上口、细节丰富、语气笃定。下次他看到类似风格就会警觉了。',
    ext:'编一个不存在的历史人物,让 AI 写完整履历;或编一个假公式,让 AI 解释"原理"。这些都是最好的疫苗。' },

  { id:'013', dim:'critical', emoji:'🎚️', title:'证据等级表', tagline:'把信息按"可信度"排队。', difficulty:3, time:'25 分钟', goal:'建立"不是所有信息都一样可信"的基本直觉。', setup:'纸笔 + AI。',
    steps:[
      'Prompt:<code>请给我 8 条关于"XX 对健康的影响"的说法,来源各异——比如学术论文、新闻、自媒体、朋友圈、广告等,标明每条的来源类型。</code>',

      '最后一起总结出"可信度的判断因素":来源机构、作者资质、是否有数据、是否有对照组、是否可复现等。做成一张家庭评估清单。',
    ],
    tip:'证据分级是记者、科学家、法官的底层能力。越早接触越好——以后刷到任何说法都会自动过一遍这个清单。',
    ext:'一起看一天的新闻,每条标记可信度等级(A/B/C/D),一周后统计自己平均每天接触到的是什么水平的信息。' },

  { id:'014', dim:'critical', emoji:'🎣', title:'诱导陷阱', tagline:'用带立场的问题引诱 AI,观察它上钩。', difficulty:3, time:'20 分钟', goal:'看见"问题本身"如何塑造答案。', setup:'任意 AI。',
    steps:[
      '选一个中性话题(比如"电子游戏"),准备三种问法:<code>电子游戏有哪些影响?</code> / <code>电子游戏有哪些危害?</code> / <code>电子游戏有哪些好处?</code>',
      '分别问 AI 三次(开新对话,避免互相影响),把三份答案并排记录。',
      '让孩子数一数:每个版本正面内容多少字?负面内容多少字?AI 的立场有没有被问法"带跑"?',
      '最后反思:如果有人只看过其中一版,他的认知会被塑造成什么样?这和新闻标题的"标题党"是不是一回事?',
    ],
    tip:'这张卡也在训练孩子的"反向识别":当别人向你提问时,先识别提问者的倾向——这是成年人也常栽跟头的事。',
    ext:'看一天的新闻标题,判断每个记者用了哪种问法(中性/引导/攻击),一周后做一张"常见诱导句式"清单。' },

  { id:'015', dim:'critical', emoji:'🔁', title:'五层为什么', tagline:'不停问"为什么",直到问不动。', difficulty:2, time:'15 分钟', goal:'训练穿透力——第一层答案往往只是表象。', setup:'任意 AI。',
    steps:[
      '从一个简单现象出发,比如"为什么要刷牙""为什么天空是蓝的""为什么人要上学"。',
      'AI 答完后,抓住它答案中的某个关键词,继续问<code>那为什么 XX?</code>——重点是追问它的"理由"而非"结论"。',
      '连追 5 层。每一层都把回答简洁记下来。过程中如果 AI 说"这是自然规律",不要放过它,追问"为什么会有这条规律"。',
      '对比第 1 层和第 5 层的回答差距——往往第 5 层已经深入到物理、生物、哲学层面,这就是"穿透力"的魔力。',
    ],
    tip:'丰田工程师用"五个为什么"找根本原因,叫 5 Whys 法。小孩天然会问"为什么",千万别打断他——AI 是最有耐心的陪问者。',
    ext:'把第 5 层的回答当作新主题,再问 5 层——有时能直接打到宇宙起源或哲学本源,全家开小型哲学讨论会。' },

  { id:'016', dim:'critical', emoji:'🃏', title:'真假混合题', tagline:'一篇文章一半真一半假,你找得出来吗。', difficulty:2, time:'20 分钟', goal:'培养"全程警觉"——不能松一秒。', setup:'任意 AI。',
    steps:[
      'Prompt:<code>请写一篇 300 字关于 XX 的科普文章,其中约一半内容是真实的,一半是你编造但听起来很合理的。不要告诉我哪些是编的。</code>',
      '孩子拿到后准备两种颜色笔——"信"用绿色,"疑"用红色,必须每一句都涂色,不许跳过、不许给"说不清"。',
      '涂完后问 AI:<code>请公布哪些句子是编造的。</code>对照答案,算自己的识别准确率(绿涂在真句、红涂在假句 = 对)。',
      '重点反思"误判"的部分:为什么真的被标假?为什么假的被信以为真?AI 的"可信"和"不可信"有什么语言特征?',
    ],
    tip:'这比"找错"更难,因为孩子没有"数量预期"可以偷懒——必须逐句警觉。做过 3 次的孩子阅读警觉性会显著提升。',
    ext:'升级难度:让 AI 故意把真假句子以最难辨别的方式穿插(真话配模糊修饰、假话配精确数字),再做识别。' },

  { id:'017', dim:'critical', emoji:'🗞️', title:'多方对照', tagline:'同一事件,问 AI 三种不同口径。', difficulty:2, time:'20 分钟', goal:'看见"同一件事,不同人讲,能差多远"。', setup:'任意 AI。',
    steps:[
      '选一个有多方视角的事件,比如"某次城市改造""某场历史战争""家里一次争执"。',
      '分三轮提问:<code>请以 XX 立场讲述这个事件</code>——比如政府/反对者/受影响普通人、胜方/败方/第三方观察者。',
      '把三个版本并排,孩子标出:三方都承认的"事实"、三方都不同的"解读"、只有某方提到的"遗漏"。',
      '讨论:哪一个版本最接近"真相"?还是任何单一版本都不是真相?真相是三者的交集还是超集?',

    tip:'这是真正的媒介素养启蒙。永远不要只听一方——记者、史学家、法官都这么干。让孩子从小就这么干。',
    ext:'找一件家里真实发生过的小事(吵架、误会),用同样方法让每个家庭成员讲一遍,惊人相似的视角差。' },

  { id:'018', dim:'critical', emoji:'🧩', title:'逻辑漏洞猎手', tagline:'AI 的论证链,哪里断了?', difficulty:3, time:'25 分钟', goal:'练"逻辑细读"的能力——大人都不一定会。', setup:'AI 生成的论证文 + 打印稿 + 笔。',
    steps:[
      '让 AI 写一段 200 字论证文:<code>请论证"小学生应该/不应该使用手机",要求有明确结论和至少 3 个论据。</code>',
      '把文章每一句编号(1,2,3...),打印出来让孩子逐句读。重点看"所以""因此""因为""显然"这些连接词。',
      '在每个连接词处画一个大问号,问:这一句真的从上一句能推出来吗?有没有跳过中间步骤?有没有隐藏假设?',
      '找出最薄弱的一跳,让 AI:<code>在第 X 句到第 Y 句之间,你跳过了什么?请补上缺失的推理步骤。</code>',
    ],
    tip:'AI 写作的漏洞往往就藏在"因此""所以"这些连接词里——它在修辞上假装推理了,但其实没推。这是 AI 说服力的软肋。',
    ext:'用这个方法看自己写过的一篇作文,逐句编号找漏洞。孩子会惊讶地发现自己也在"假装推理"。' },

  { id:'019', dim:'critical', emoji:'🎰', title:'数字魔术拆解', tagline:'AI 给一个吓人数字,你问口径。', difficulty:2, time:'15 分钟', goal:'识破"统计障眼法"。', setup:'任意 AI。',
    steps:[
      '让 AI 给一个"吓人的数据":<code>请告诉我一个关于 XX 的惊人统计数字,要让人看了震惊的那种。</code>',

      '改一个关键口径,重算一次——比如把"每年全世界"改成"每天每个人"或"一生中总量",看数字会变"惊人"还是"稀松平常"。',
      '最后让孩子用两种口径,把同一个数字写成"标题党式"和"平常式"两种新闻标题,感受数据的"魔术"。',
    ],
    tip:'看新闻时最该学的一招——"分子分母都要追问"。一个数字,切换口径可能从"惊人"变"无聊",反之亦然。',
    ext:'一周内收集 5 条新闻里的"惊人数字",一家人一起解构它们的口径,做成"数据魔术档案"。' },

  { id:'020', dim:'critical', emoji:'📖', title:'AI 弱点图鉴', tagline:'给 AI 建一本"错题集"。', difficulty:2, time:'一周', goal:'把分散的 AI 错误,攒成可识别的模式。', setup:'一个专门笔记本或文档。',
    steps:[
      '从今天开始,每次孩子发现 AI 出错,立刻记一条:错在哪、什么类型(事实错/逻辑错/幻觉/偏见)、他是怎么发现的。',
      '每天睡前花 3 分钟翻一下本子,给当天的错误做简单分类——数学题错、历史事实错、编造来源等等。',
      '一周后全家汇总:哪一类错误出现最多?AI 在哪些领域最容易出错?哪些错误孩子一眼能看穿、哪些差点被骗?',
      '把规律整理成一张"AI 避坑清单"——比如"凡 AI 报的具体数字都要核一次""凡历史细节都要对课本",贴在电脑边。',
    ],
    tip:'这个本子最好贴在孩子每天用 AI 的桌上。积累一个月后,他对 AI 的警觉会变成本能——这是长期最贵的能力。',
    ext:'把清单分享给同龄朋友共享,搞一个"小伙伴 AI 弱点众包";一年后对比一下自己学校和朋友的清单有什么不同。' },

  { id:'021', dim:'critical', emoji:'🎲', title:'条件变量', tagline:'改一个条件,看 AI 答案变多少。', difficulty:2, time:'15 分钟', goal:'理解"答案依赖前提"——这是科学思维的根。', setup:'任意 AI。',
    steps:[
      '让 AI 回答一个带多个条件的问题,比如"一个 12 岁孩子每天学习几小时合适"——明确年龄、身体状况、学校强度三个条件。',
      '只改年龄(8 岁、12 岁、16 岁),其余不变,连问三次。记录三个答案的差异。',
      '再只改学校强度(普通/国际/奥数集训),其余不变,再问三次。对比结果。',
      '总结:哪个条件对答案影响最大?如果孩子不说清楚条件直接问,AI 会默认哪种前提?(往往是"中位数孩子"。)',
    ],
    tip:'这一张也是理解 AI prompt 的入门——改变输入就改变输出。孩子以后写 prompt 会自然地先说清条件。',
    ext:'做三组变量对照实验,观察规律,画一张"条件-答案"关系图。这是科学思维的雏形。' },

  { id:'022', dim:'critical', emoji:'🎯', title:'反直觉验证', tagline:'AI 说一个结论,孩子先猜再看。', difficulty:1, time:'10 分钟', goal:'让孩子意识到自己的直觉和真相的差距。', setup:'任意 AI。',
    steps:[
      'Prompt:<code>请告诉我一个科学/生活上的反直觉结论,先只给结论,不给理由,也不做解释。</code>',
      '孩子听到结论后,必须先表态:我觉得对 / 我觉得错 / 我觉得是玩笑。再说说自己凭什么这么觉得。',
      '然后让 AI 给出完整理由和证据。孩子对比:我的直觉中了吗?AI 的理由说服我了吗?哪里颠覆了我?',
      '连续做 5 个,统计"直觉准确率"——大部分孩子是 40%-60%,也就是和瞎猜差不多,这会让他自嘲也会让他谦卑。',
    ],
    tip:'不管答案对错,只要孩子"先停一下想一想",这张卡就成功了——这是反冲动思考的种子。',
    ext:'连做 10 个,做成"我的直觉 vs 事实"对照表,标记自己在什么领域直觉靠谱、什么领域靠不住。' },

  { id:'023', dim:'critical', emoji:'🔗', title:'来源追溯', tagline:'AI 每说一个事实,就问"哪来的"。', difficulty:2, time:'15 分钟', goal:'把"引用"意识植入日常。', setup:'任意 AI。',
    steps:[
      '问一个知识性问题,比如"世界上最大的河流是哪条?"——故意选有争议或标准不一的问题。',
      '对答案中每个事实陈述追问:<code>这一点的来源是什么?有哪些论文、机构、书可以佐证?</code>',
      '让 AI 列出具体可查证的来源(期刊名+年份/机构+报告名+页码)。',
      '随机抽一条真的去搜索验证——这条来源存不存在?说的和 AI 引用的一致吗?很多时候会发现 AI 编造了"看起来真"的来源。',
    ],
    tip:'有些 AI 会编造出处——这就是又一次质疑训练的机会。学术圈的人叫这种假引用"幻觉引用",危害特别大。',
    ext:'做完后总结:AI 哪些领域的出处最可靠?(一般是教科书级的大话题);哪些最喜欢编?(一般是具体论文、具体数据)' },

  { id:'024', dim:'critical', emoji:'🌫️', title:'模糊问题测试', tagline:'故意问得模糊,看 AI 怎么处理。', difficulty:2, time:'15 分钟', goal:'看 AI 如何"自填空白"——这是它最危险的行为。', setup:'任意 AI。',
    steps:[
      '故意问一个缺关键信息的问题,比如"他下一步该怎么办?""这道题怎么做?"——不说"他是谁""哪道题"。',
      '观察 AI 的反应:是反问你补充信息,还是自作主张脑补场景直接答?(大部分 AI 会后者。)',
      '读 AI 的回答,找出它"脑补"出的前提——它替你假设了什么场景、什么身份、什么目标?这些假设你同意吗?',
      '重新提问,这次把所有条件说清楚,对比两次答案。体会"模糊-脑补"和"明确-精准"的差距有多大。',
    ],
    tip:'好的 AI 会先反问补充信息。会一上来就"脑补"的 AI,要警惕——它说得再精彩也建立在你没同意的假设之上。',
    ext:'收集 5 个 AI"脑补"的经典案例,做成"AI 自以为懂你"的搞笑集锦,全家一起看。' },

  { id:'025', dim:'critical', emoji:'🔔', title:'绝对化警报', tagline:'找出 AI 话里的"所有/从不/必然"。', difficulty:1, time:'10 分钟', goal:'对过度泛化保持敏感。', setup:'AI 文稿 + 荧光笔。',
    steps:[
      '让 AI 写一篇观点文:<code>请写 200 字,表达"读书很重要"这个观点,要有说服力。</code>',
      '打印出来,孩子用荧光笔圈出所有绝对化词语——"所有""从不""一定""必然""唯一""绝对""任何""永远"。',
      '对每个圈出的词,让孩子举一个反例:真的"所有"吗?真的"从不"吗?反例可以很小,只要存在就动摇。',

  { id:'026', dim:'critical', emoji:'🎯', title:'相关≠因果', tagline:'AI 说 A 和 B 有关,问它"谁引起谁"。', difficulty:3, time:'20 分钟', goal:'区分相关和因果——成人都容易搞错。', setup:'任意 AI。',
    steps:[
      'Prompt:<code>请给我一个"A 和 B 相关"的真实研究例子,比如两件看起来相关的事。</code>(比如冰淇淋销量和溺水人数相关)',
      '问孩子三种可能:是 A 引起 B?还是 B 引起 A?还是有第三个因素 C 同时影响了 A 和 B?',
      '让他给每种可能估一个概率,然后问 AI:<code>这个相关的真正原因机制是什么?</code>让 AI 解释第三变量。',
      '练习:从今天起遇到"XX 和 XX 相关"的说法,先别信因果,先想有没有第三变量。',
    ],
    tip:'冰淇淋销量和溺水人数相关,但原因是夏天——这是统计学里最经典的第三变量案例。孩子一辈子都用得上。',
    ext:'看一周内新闻,找出至少 3 条"把相关说成因果"的误导报道——你会震惊多普遍。' },

  { id:'027', dim:'critical', emoji:'🧪', title:'样本陷阱', tagline:'AI 说"调查表明",你问"谁被调查了"。', difficulty:3, time:'20 分钟', goal:'理解"样本决定结论"——这是统计常识。', setup:'任意 AI。',
    steps:[
      '让 AI 给一个"调查结论":<code>请给我一条"某某调查显示 XX%的人 YY"的真实研究。</code>',

      '让孩子想:如果只在某个特定圈子里调查(只在大学、只在养老院、只在朋友圈),结论会变多少?',
      '用孩子的生活场景玩一次:让他设计一个"有偏调查"来证明某个荒唐结论(比如"大家都爱吃奥利奥,因为我问的全是奥利奥吃货群")。',

    tip:'大人不懂这个,就会被 10 万+ 的"调查显示"骗一辈子。这张卡是最好的防骗疫苗。',

  { id:'028', dim:'critical', emoji:'🤐', title:'逼 AI 认怂', tagline:'问一个 AI 真不知道的事。', difficulty:1, time:'10 分钟', goal:'让孩子亲眼看到"AI 能说不知道",更信任它的"知道"。', setup:'任意 AI。',
    steps:[
      '问 AI 一个它不可能知道的事:"我奶奶昨天早餐吃了什么""我家楼下小卖部今天营业吗""我明天穿什么颜色衣服"。',

    ],
    tip:'一个肯说"不知道"的 AI,比样样都答的 AI 更可信。教孩子偏爱前者——这和选朋友、选老师的标准是一样的。',

  { id:'029', dim:'critical', emoji:'🏗️', title:'拆前提', tagline:'AI 给结论前,先挑它的前提。', difficulty:3, time:'20 分钟', goal:'看见每个论点背后的"假设地基"。', setup:'AI 论证文。',

      '用纸笔画一张"假设地基图"——结论在上、理由在中、隐藏假设在下。',
      '质疑其中一条地基:<code>如果这个假设其实不成立(比如我是个夜猫型的人),你的结论还对吗?</code>看 AI 怎么应对。',
    ],
    tip:'90% 的争议,都不是结论错,是前提不一样——夫妻吵架、国家矛盾、学术争论都适用这条。',
    ext:'用这方法看一段广告文案或成功学书籍的核心论证,你会发现地基经常漏洞百出。' },

  { id:'030', dim:'critical', emoji:'🌡️', title:'极端值测试', tagline:'把 AI 的规则推到最极端,看它崩不崩。', difficulty:2, time:'15 分钟', goal:'理解"规则都有适用范围"。', setup:'任意 AI。',
    steps:[
      '让 AI 给一条生活/健康规则:<code>请给我一条被广泛认同的养生/生活建议。</code>(例如"每天喝八杯水""多吃水果")',
      '向极端推:如果按这规则到极致会怎么样?"每天喝 20 杯水呢?""每天只吃水果呢?"让 AI 回答后果。',

    ],
    tip:'极端值是检验规则最快的方法。科学家、工程师常用这招——边界条件往往暴露规则的真实本质。',
    ext:'对"勤劳""节俭""善良"这类道德规则做同样极端测试,你会发现所有美德推到极致都有反效果。' },

  { id:'031', dim:'critical', emoji:'🎭', title:'立场切换', tagline:'让 AI 先挺后反同一件事。', difficulty:2, time:'15 分钟', goal:'看见立场是表演的,观点是有选择的。', setup:'任意 AI。',

    ],
    tip:'AI 能轻易切换立场,说明"有说服力"不等于"有道理"。律师、辩论选手都能做到两面说得通——这是话术不是真理。',
    ext:'让孩子自己模仿 AI,同一件事写一正一反 100 字。这是辩论、写作文、说服力训练的绝招。' },

  { id:'032', dim:'critical', emoji:'📰', title:'核真小分队', tagline:'带着孩子用 AI 查一条新闻。', difficulty:2, time:'20 分钟', goal:'建立"转发前先查"的习惯。', setup:'一条家长群里流传的新闻/消息。',
    steps:[

      '让 AI 列出疑点和核实方法,然后孩子自己用搜索引擎查"原始来源"——看能不能找到官方、权威媒体的最初报道。',
      '给这条新闻打分:完全真实 / 部分真实 / 夸大其词 / 彻底虚假。如果是后三种,把判断发回家长群!',

    tip:'很多家长转发谣言,是因为从来没人教过他们怎么查。这张卡给全家人——孩子做一次,全家受益。',

  { id:'033', dim:'critical', emoji:'🎓', title:'专家 vs 群众', tagline:'AI 引用时,问它"谁说的"。', difficulty:2, time:'15 分钟', goal:'区分权威观点和大众观点。', setup:'任意 AI。',

      '讨论:哪些事应该听专家的(专业判断、风险决策),哪些事其实没有专家意见(个人偏好、小事选择)。',
    ],
    tip:'这张卡也在训练:不要把"网上都这么说"当证据。"从众"是一种懒,专业判断往往需要一点孤独勇气。',
    ext:'找一个当下热点话题,看专家和大众意见差得多远——有时差得吓人,会让孩子开始尊重专业。' },

  { id:'034', dim:'critical', emoji:'👁️', title:'反向论据', tagline:'让 AI 专门找反对你的证据。', difficulty:3, time:'20 分钟', goal:'对抗"确认偏误"——人总是容易只看支持自己的信息。', setup:'孩子有一个小决定要做。',
    steps:[
      '让孩子写下最近的一个小决定和 3 个理由,比如"我想报乒乓球不报绘画班"+理由。',
      '对 AI 说:<code>请扮演一个最挑剔但善意的朋友,只说这个决定可能的问题和风险。不要鼓励我,只讲我可能没想到的坏处。</code>',
      '孩子读完必须忍住反驳,规矩是:逐条圈出"有道理""可能有道理""瞎说"三档。至少要诚实承认有 1 条说中了。',
      '基于这些反向论据,孩子重新评估原决定——完全推翻?局部修改?还是坚持原方案但做补救(比如加个尝试期)?',
    ],
    tip:'能主动找反对证据的人,决策质量高一个数量级。这也是巴菲特、达尔文等伟大决策者的共同习惯。',
    ext:'大人的决策也做同款——买房、换工作、选学校都可以。这一家人的决策质量会集体提升。' },

  { id:'035', dim:'critical', emoji:'⏰', title:'时效性测试', tagline:'问 AI 最近的事,看它怎么处理。', difficulty:1, time:'10 分钟', goal:'理解 AI 的知识有"截止日期"。', setup:'任意 AI。',
    steps:[
      '问 AI 一个本月/本周才发生的事情,比如最新的国际事件、新出的电影、刚结束的比赛。',
      '观察 AI 的反应:是承认"我的知识截止到 X 年 X 月",还是硬着头皮答(往往会答成过时或虚构信息)?',
      '如果它硬答,把真实信息和 AI 答案对比,标出:哪里是过时事实、哪里是编造、哪里还算对。',
      '最后直接问 AI:<code>你的知识截止到哪一天?之后的事你怎么办?</code>让它明确交代自己的"时间边界"。',
    ],
    tip:'永远先查 AI 的知识截止时间,再决定能不能信。尤其是新闻、股票、科技进展这些快变领域。',
    ext:'列一张"AI 最容易过时"的知识领域清单(新闻、股价、新技术、娱乐圈),以后问这些话题要多一层警觉。' },

  { id:'036', dim:'critical', emoji:'🗺️', title:'文化盲点', tagline:'问一个很本地的问题,看 AI 翻车。', difficulty:1, time:'10 分钟', goal:'看见 AI 的"普适性幻觉"——它不是万能的。', setup:'任意 AI。',
    steps:[
      '问一个只有本地人才懂的问题:家乡某道特产的正宗做法、某句方言的意思、某个本地小节日的由来。',
      '观察 AI 答得对不对——大概率要么答错、要么答"大概"、要么张冠李戴到别的地方。',
      '作为本地小专家,孩子亲自纠正 AI,告诉它"正确答案是 XX"——让他体会"我比 AI 懂"的自豪感。',
      '讨论:AI 的知识是从哪来的(互联网主流内容)?为什么它对主流事情强、对本地事情弱?这反映了互联网的什么偏差?',
    ],
    tip:'AI 对"主流"信息好,对"本地"往往糟。这是让孩子自豪本地文化的好机会——也是重要的文化平等意识启蒙。',
    ext:'系统地问一组本地问题(方言、特产、习俗、街道),做一张"AI 对我家乡的了解地图"。' },

  { id:'037', dim:'critical', emoji:'🔤', title:'术语拆解', tagline:'AI 用了个大词,你问它"人话说"。', difficulty:1, time:'10 分钟', goal:'不被大词吓住——看穿本质。', setup:'任意 AI。',
    steps:[
      '让 AI 写一段带专业术语的介绍,比如"什么是区块链""什么是心理学的认知失调"。',
      '找出答案里孩子看不懂的 3 个大词,一个一个问 AI:<code>请用小学生也能懂的话重新解释这个词,不许再用专业词汇。</code>',
      '再升级一层:<code>请用一个生活中的比喻来解释,让 5 岁小朋友也能听懂。</code>',
      '最后让孩子自己用更小学生的话把这些大词重述一遍——能说出来,才是真懂。',
    ],
    tip:'能被翻译成大白话的词才是真概念。翻不出来的,可能只是在唬人——这招对识别"伪专家"也特别好用。',
    ext:'读一段新闻、论文摘要或学术书,做同样的"大词翻译"练习,一本书读下来简单一半。' },

  { id:'038', dim:'critical', emoji:'💠', title:'同词不同义', tagline:'同一个词,AI 和你说的是一个意思吗?', difficulty:3, time:'20 分钟', goal:'理解"讨论的前提是对齐词义"。', setup:'任意 AI。',
    steps:[
      '选一个日常含糊的词:"成功""好人""努力""快乐""自由"。',
      '家里每人(包括孩子、爸妈)先各自在纸上偷偷写下自己的定义,不许讨论。',
      '让 AI 也给一个定义。把四个版本摆在一起对照——会发现家庭成员之间、AI 之间,定义竟然差得很远。',
      '讨论:如果不先对齐定义就直接讨论这个词,会不会吵起来?以后讨论重要事,是不是该先问一句"你说的 XX 是什么意思"?',
    ],
    tip:'很多争吵是因为词没对齐——吵到最后发现,两个人说的根本不是一件事。孩子越早懂这个越好。',
    ext:'家庭每周一次"定义讨论会",轮流提一个词;你会发现全家人的价值观突然被看见了。' },

  { id:'039', dim:'critical', emoji:'📐', title:'推理阶梯', tagline:'把 AI 的论证拆成每一级台阶。', difficulty:3, time:'25 分钟', goal:'训练显式化思维——把隐藏逻辑搬到桌面上。', setup:'AI 论证段 + 纸笔。',
    steps:[
      '让 AI 回答一个"为什么"类问题,要求给出完整推理,比如"为什么人会长大后变世故"。',
      '把回答拆成 N 个小步骤,每步写在纸上单独一行,形成"思维阶梯"。',
      '逐级检查:第 1 步成立吗?凭什么?第 2 步能从第 1 步推出来吗?找出最薄弱那一级——往往是某步"想当然"跳过去了。',
      '让 AI 重新补全那一级:<code>第 X 级到第 X+1 级之间,你的推理跳了一步,请详细补全中间的逻辑链条。</code>',
    ],
    tip:'"显式化"是哲学家的看家本事——把"我觉得 XX"变成"因为 A,所以 B,所以 C"。小学生完全学得会。',
    ext:'把自己写的一篇作文或一次争辩,用这个方法拆成阶梯,你会惊讶自己平时是怎么"跳步"的。' },

  { id:'040', dim:'critical', emoji:'🪞', title:'AI 自省', tagline:'让 AI 评价 AI 刚才的答案。', difficulty:2, time:'15 分钟', goal:'利用 AI 反打 AI——最有效的审查机制。', setup:'任意 AI。',
    steps:[
      '让 AI 回答一个有一定深度的问题,保存好答案。',
      '重新开一个对话或在同一个对话里说:<code>以下是一段 AI 回答:[粘贴],请严格评估:哪些地方不准确?哪些地方逻辑弱?哪些地方有偏见?请列出 3 条。</code>',
      '让 AI 按自己指出的问题给原答案评分(1-10),并列出至少 3 处可改进。',
      '基于它自己的批评,让它重写一版更好的答案。对比原版和重写版,看改进了多少。',
    ],
    tip:'这招叫"AI 自省"或"Self-Critique"——在专业 AI 研究里是提升输出质量的标准技巧。常常比直接问好 3 倍。',
    ext:'用两个不同 AI 互评(A 的答案给 B 评,B 的答案给 A 评),结果往往比自评更刀刀见血。' },

  { id:'041', dim:'critical', emoji:'🎠', title:'一致性考验', tagline:'同一问题换 5 种问法,AI 答案一致吗?', difficulty:2, time:'20 分钟', goal:'看见 AI 的不稳定性——别把它当圣经。', setup:'任意 AI。',
    steps:[
      '设计 5 种不同的问法问同一件事,比如"是否该让孩子早用手机":直白问、装外行问、装专家问、反向问、极端场景问。',
      '每种问法记录 AI 的答案,并排比较。标出:哪些结论跨所有问法都一致?哪些随问法变化?',
      '找最矛盾的两版,把它们并排发给 AI 本身:<code>你在 A 问题里说 X,在 B 问题里说 Y,这不矛盾吗?请解释。</code>',
      '总结:AI 的哪些说法是"真知识"(跨问法稳定),哪些是"随机生成"(跟着问法走)?',
    ],
    tip:'不一致不代表 AI 差,而是提醒你:别信任何一次结果。重要的事要多问几遍,找"稳定答案"。',
    ext:'对重要决策性问题养成"至少 3 种问法"的习惯——这是专业使用 AI 的人都会做的。' },

  { id:'042', dim:'critical', emoji:'🦓', title:'异常值发现', tagline:'AI 给规律,孩子找例外。', difficulty:2, time:'15 分钟', goal:'用例外去检验规律——科学精神的种子。', setup:'任意 AI。',
    steps:[
      '让 AI 总结一条生物/自然规律:<code>请给一条关于动物/植物的普遍规律,用一句话概括。</code>(比如"鸟都会飞""哺乳动物都有毛")',
      '孩子脑洞找反例:真的吗?企鹅会飞吗?鸵鸟呢?海豚有毛吗?',
      '把反例发给 AI:<code>你说"鸟都会飞",但企鹅呢?请修正规律。</code>看 AI 怎么加限定词。',
      '最后得到一条更精确的规律——比原规律长,但真正成立。体会"精确往往牺牲简洁"这个真理。',
    ],
    tip:'能找到"不会飞的鸟"的孩子,以后不容易被简单答案糊弄——这是科学家的基本素养。',
    ext:'做一本"异常值图鉴"——每种规律配几个例外,积累多了孩子对世界的理解会变得特别立体。' },

  { id:'043', dim:'critical', emoji:'🧱', title:'基础假设', tagline:'AI 建议前,它假设了什么?', difficulty:3, time:'20 分钟', goal:'发现建议背后的隐藏价值观。', setup:'任意 AI。',
    steps:[
      '让 AI 给一条学习建议:<code>请告诉我一个 12 岁孩子应该怎么学数学。</code>',
      '孩子问:这个建议假设我是什么样的人?(基础不错?有时间?有家长陪?)这些假设我都符合吗?',
      '换一种人设再问:<code>如果这个孩子基础差、没人辅导、时间有限,还应该怎么学?</code>看建议怎么变。',
      '对比两种建议——你会发现 AI 的"通用建议"其实只对"默认的中产孩子"有效,换个人设答案完全不同。',
    ],
    tip:'建议不是客观的,它总是对"某种人"说的——看不见这一点,就会盲目照搬别人的成功经验。',
    ext:'看鸡汤文、成功学书、教育指南做同样拆解,你会发现"人生建议"全是基于特定人设的。' },

  { id:'044', dim:'critical', emoji:'📏', title:'概率量化', tagline:'AI 说"可能",你让它给具体数字。', difficulty:2, time:'15 分钟', goal:'让模糊变清晰——知道什么时候该较真。', setup:'任意 AI。',
    steps:[
      '让 AI 做一次带"可能""也许""大概""很有可能"的判断:<code>根据现在的信息,XX 这件事会不会发生?</code>',
      '追问:<code>"可能"具体指多少百分比?20%?50%?80%?请给一个数字区间。</code>',
      '再追问:<code>你这个百分比是根据什么给的?有哪些证据支持这个概率?</code>',
      '让孩子评估这个百分比是否合理——如果 AI 说"70%",真有那么高的把握吗?可以自己给一个更保守的概率。',
    ],
    tip:'很多争论是因为"可能"两字各自理解不同——A 理解为 30%,B 理解为 70%。量化是沟通精度的关键。',
    ext:'自己每周说"可能"时,也练习后面加一个百分比,你会发现自己平时说"可能"有多随意。' },

  { id:'045', dim:'critical', emoji:'🧵', title:'简化陷阱', tagline:'AI 把复杂事说简单,你找被省的。', difficulty:3, time:'20 分钟', goal:'知道"简洁"有代价——省的是什么。', setup:'任意 AI。',
    steps:[
      '让 AI 一句话解释一件复杂事,比如"为什么人会长高"。记录这一句话。',
      '再让它用 500 字详细解释同一事。',
      '孩子对比,标出:一句话里被省略了多少?哪些被省的东西其实很重要?省略的是"细节"还是"关键"?',
      '讨论:什么场合该用"一句话版"(吸引注意、快速入门)?什么场合"一句话版"会误导人(做决策、深入学习)?',
    ],
    tip:'懂得"简化的代价"是成熟判断力的开始——一句话标语很好,但不能拿它当世界。',
    ext:'看广告标语、政治口号、一句话格言,想一想:它为了"上口"省略了什么?' },

  { id:'046', dim:'critical', emoji:'⚖️', title:'两难裁判', tagline:'AI 处理伦理题,你给它打分。', difficulty:3, time:'25 分钟', goal:'观察 AI 的道德判断,反思自己的。', setup:'任意 AI。',
    steps:[
      '给 AI 一个经典两难题的简化版——比如"电车难题":一个人被撞是没救的,但转向会撞到另一边一个人,你该转向吗?',
      '让 AI 给出它的判断 + 3 条理由。',
      '孩子先不表态,逐条评价 AI 的理由:说服我吗?哪条最强?哪条最弱?',
      '再让 AI 换立场(支持相反决定)重写一次,孩子比较两版——有没有什么"根本性"的答案,还是都取决于价值观?',
    ],
    tip:'不要替孩子定标准答案。这张卡是让他感受"难"本身——道德困境不是有标准答案,是要做选择。',
    ext:'把现实生活中的小两难(是否告发同学作弊、是否对家人说善意谎言)也这么讨论,收获远超说教。' },

  { id:'047', dim:'critical', emoji:'🎞️', title:'反事实历史', tagline:'如果当年没发生那件事会怎样?', difficulty:2, time:'20 分钟', goal:'训练因果想象力——理解"现在"不是必然。', setup:'任意 AI。',
    steps:[
      '选一件影响深远的历史事件:工业革命、某场战争、互联网发明、某个大发现。',
      '问 AI:<code>如果这件事没发生,世界会怎样?请从 3 个维度(科技、社会、日常生活)各举一个可能的不同。</code>',
      '孩子评价 AI 的想象是否合理——哪些推演像"多米诺骨牌"环环相扣?哪些是 AI 瞎编?',
      '自己写一个"反事实世界的一天"——早晨醒来,没有这件事的世界里,你的生活会多一点什么、少一点什么?',
    ],
    tip:'这张卡最好玩,也是历史感教育——让孩子明白"今天的世界"是一长串偶然,没有必然。',
    ext:'问:如果你没出生,家里的生活会怎样?——这是最温柔的存在主义启蒙。' },

  { id:'048', dim:'critical', emoji:'🧿', title:'伪科学扫描', tagline:'给 AI 一段伪科学,让它挑破绽。', difficulty:3, time:'20 分钟', goal:'识别伪科学的典型话术——一辈子受用。', setup:'AI + 一段养生文/成功学/星座运势。',
    steps:[
      '找一段典型伪科学文字——养生帖、星座运势、神奇产品广告都行。',
      '发给 AI:<code>请挑出这段文字里所有没有科学证据的说法,并指出它用了哪些伪科学话术(比如"量子""能量""纯天然")。</code>',
      '孩子对照 AI 的分析,把伪科学话术一条条标出来——你会发现它们都有固定套路。',
      '一起总结"伪科学十大话术"清单:用"高深词""古老传承""无副作用""有效案例""权威背书"等。做成家庭防骗守则。',
    ],
    tip:'孩子长大后,这招是防骗第一线。养生产品、成功学、星座、伪投资,全都用这套路。',
    ext:'每月用这招检测一篇朋友圈转发,一年后家里的"防骗家族"称号就稳了。' },

  { id:'049', dim:'critical', emoji:'📝', title:'错题诊所', tagline:'错题+AI=最好的复盘。', difficulty:2, time:'20 分钟', goal:'从错误里榨出最多信息。', setup:'孩子的错题本。',
    steps:[
      '从本周错题里选一道最典型的——不要选最难的,要选"自己以为对了但错了的"那种。',
      '给 AI:<code>这是我做错的题:[题+我的答案+正确答案],请分析我错的根本原因是什么?是概念不清、审题出错、还是方法错?</code>',
      '让 AI 出 3 道同类型题,孩子独立完成,再对答案。',
      '最后写一句"错因小结"贴在错题本上——不是抄标答,而是用自己的话概括"我为什么会错""下次怎么避免"。',
    ],
    tip:'错题不怕多,怕没复盘。AI 让复盘变便宜——以前一道错题要找老师,现在家里就能做。',
    ext:'建立"错题-AI 批注"档案,月末归类错题类型,你会发现自己的盲区其实就那么几种。' },

  { id:'050', dim:'critical', emoji:'🌡️', title:'争议温度计', tagline:'测 AI 对敏感话题的倾向。', difficulty:3, time:'20 分钟', goal:'意识到 AI 也有"社会立场"。', setup:'两个不同公司的 AI。',
    steps:[
      '选一个公开有争议的社会话题(某项政策、某种生活方式、某种教育理念)。',
      '让两个不同 AI 给"中立"回答。把两个回答并排贴在一起。',
      '让孩子用三色笔标立场:红色 = 支持甲方、蓝色 = 支持乙方、黄色 = 真中立。数每个 AI 的色块比例。',
      '讨论:哪家 AI 哪方色块多?为什么同一话题不同 AI 立场不同?这反映了训练数据来自哪些人群?',
    ],
    tip:'不同 AI 有不同的"政治正确"——它们的训练数据不同,背景公司不同。认清这一点很重要,别把任何一家当"客观"。',
    ext:'记录不同 AI 在同一问题上的倾向差异,做成"AI 立场地图",发给朋友一起讨论。' },

  /* ========== 创造力 50 张 ========== */
  { id:'051', dim:'creativity', emoji:'💡', title:'第 11 个点子', tagline:'AI 给 10 个答案,我们想第 11 个。', difficulty:1, time:'15 分钟', goal:'打破"AI 给的就是全部"的思维。', setup:'一张纸一支笔。',
    steps:[
      '一起选一个开放问题,比如"怎么让爷爷更开心""周末我们做什么特别的事"。',
      '让 AI:<code>请给 10 个不同方向的方案,每个用一句话概括。</code>读完合上屏幕。',
      '全家脑暴第 11 个——规矩是:不能和前 10 个重复,必须是"AI 没想到但又成立"的。',
      '投票:第 11 个 vs AI 的 Top 3,哪个更妙?记录每次"人类赢了"的时刻——孩子会越来越敢想。',

    tip:'第 11 个往往比前 10 个更好——因为前 10 个是"平均解",第 11 个是你们家独有的、带个人色彩的解。',
    ext:'做成每周一次的家庭仪式,叫"第 11 个点子会"。一年后你会攒下一本只属于你家的创意本。' },

  { id:'052', dim:'creativity', emoji:'🦖', title:'奇怪生物制造机', tagline:'一起设计世界上不存在的生物。', difficulty:2, time:'30 分钟', goal:'练"跨界组合"的创造力。', setup:'带绘图的 AI(如 DALL-E 或国产的画图 AI)。',
    steps:[
      '孩子随机说 3 个不相干的词,比如"橡皮擦""闪电""棉花糖"。',
      '一起口述这种生物的设定:身体哪部分像什么、住在哪、吃什么、弱点是什么、超能力是什么。',
      '让绘图 AI 生成一张图:<code>请画一个生物,身体像XX,头像YY,生活在ZZ环境,风格是XX。</code>',
      '孩子看到图后一定会说"头不对""尾巴我想要另一样"——让 AI 改,迭代 3 次,直到孩子满意。',
    ],
    tip:'不要嫌孩子的想法幼稚——"幼稚"往往就是创造力。每一次"再改改"都是在练"把想法具体化"的能力。',
    ext:'给这个生物起名字、编一段它的族史、做一张"生物图鉴卡"。积累 10 张做成一本《孩子的异兽志》。' },

  { id:'053', dim:'creativity', emoji:'📖', title:'故事接龙', tagline:'一人一句,和 AI 轮流编故事。', difficulty:1, time:'20 分钟', goal:'练"接住设定,再推进"的能力。', setup:'任意 AI。',
    steps:[
      '规定顺序:孩子 → AI → 爸爸/妈妈 → 孩子 → 循环。每次只能写一句话(15 字左右)。',
      '孩子开第一句,定下"人物+场景+冲突"——比如"小老鼠吉吉在图书馆里发现了一扇会说话的门"。',
      '轮到 AI 时,发给它:<code>我们在玩故事接龙,这是上一句:[贴过去]。请接下一句,只一句,不要展开。</code>',
      '轮 10 句后读完整故事,一起投票最妙一句是谁写的,最莫名其妙的是谁写的。',
    ],
    tip:'孩子一开始不会接可以让 AI 示范两轮。关键是"开心"而不是"写得好"——先建立游戏感。',
    ext:'让 AI 把最后故事画成 4 格漫画;或做成"家庭故事接龙卡",每周玩一次,累积成集。' },

  { id:'054', dim:'creativity', emoji:'🌌', title:'如果……就……', tagline:'把日常放进一个奇怪的世界。', difficulty:2, time:'20 分钟', goal:'练"改变假设"的思维。', setup:'一本笔记本。',
    steps:[
      '一起想一个"如果"设定,越反常识越好——"如果重力是现在的 1/6""如果每个人都能看到别人的想法""如果时间每天倒着走 2 小时"。',
      '再定一件最普通的日常小事——刷牙、上学、吃饭、洗澡。',
      '孩子先想 5 条变化,然后让 AI:<code>在 XX 设定下,做 YY 这件小事会变成什么样?请给 5 条具体变化。</code>',
      '对比孩子和 AI 的 5 条,投票最妙的 3 条,合并成一个"设定世界的早晨"小故事。',
    ],
    tip:'设定越"不合理"越好。想象力是反常识喂大的——现实太合理,会压抑想象。',
    ext:'把最妙的设定画成一幅场景画;或者做成"如果世界"系列,每周一个新设定。' },

  { id:'055', dim:'creativity', emoji:'🎨', title:'情绪配色', tagline:'把一种情绪变成一张画。', difficulty:1, time:'15 分钟', goal:'把抽象感受具体化。', setup:'带绘图的 AI。',
    steps:[

      '把描述整合成一个 prompt 发给绘图 AI:<code>请画一幅抽象画表达 XX 情绪,主色是 XX,形状是 XX,质地是 XX。</code>',

    ext:'做一本"我的情绪画册",一种情绪一页,年底翻开会是一本特别的自传。' },

  { id:'056', dim:'creativity', emoji:'🎲', title:'三词一故事', tagline:'三个随机词,必须组进一个故事。', difficulty:1, time:'15 分钟', goal:'约束反而激发创意——经典创意训练。', setup:'任意 AI。',
    steps:[
      '让 AI:<code>请随机给我 3 个毫不相干的名词,越怪越好。</code>(比如"雨伞、恐龙、蛋黄酱")',

    tip:'"约束是创造力之母",这句话小孩也懂——没有限制才是最难写的。三词法是专业编剧也用的训练。',
    ext:'每晚睡前 3 词游戏,累积一年就是一本《我和 AI 的 365 个故事》。' },

  { id:'057', dim:'creativity', emoji:'🥄', title:'物品新用途', tagline:'一支筷子的 10 种奇葩用法。', difficulty:1, time:'15 分钟', goal:'练"功能解耦"——所有发明都从这开始。', setup:'任意 AI + 家里随手一个小物件。',
    steps:[
      '随手选一个日用品——筷子、发卡、旧袜子、空瓶盖。',
      '孩子先想 5 种常规外的用法(不是吃饭的用筷子)——刮痧?搭建积木?插花?',

    ext:'挑一种最有潜力的用法做个原型,开始孩子的第一项"发明"。' },

  { id:'058', dim:'creativity', emoji:'🏷️', title:'命名工厂', tagline:'给一样新东西起 20 个名字。', difficulty:1, time:'10 分钟', goal:'语言灵活性训练。', setup:'任意 AI。',
    steps:[

  { id:'059', dim:'creativity', emoji:'📺', title:'夸张广告', tagline:'给普通东西写个夸张广告。', difficulty:1, time:'15 分钟', goal:'练"放大细节"的想象。', setup:'任意 AI。',

      '全家大声朗读两个版本,看谁能读出"电视购物大叔"的味道——录一段音保存,十年后再听一定会笑。',

  { id:'060', dim:'creativity', emoji:'👃', title:'五感转译', tagline:'不用眼睛,怎么描述一朵花?', difficulty:2, time:'20 分钟', goal:'跨感官表达——感知力飞升。', setup:'任意 AI。',

  { id:'061', dim:'creativity', emoji:'🏛️', title:'未来博物馆', tagline:'100 年后哪些东西会进博物馆?', difficulty:2, time:'20 分钟', goal:'练"从当下看长远"的眼光。', setup:'任意 AI。',

  { id:'062', dim:'creativity', emoji:'👿', title:'反派传记', tagline:'给童话反派写小传。', difficulty:2, time:'20 分钟', goal:'练"换位想象"——好故事都有立体反派。', setup:'任意 AI。',

  { id:'064', dim:'creativity', emoji:'💭', title:'梦境改编', tagline:'把昨晚的梦变成一个故事。', difficulty:1, time:'15 分钟', goal:'捕捉"原始素材"——创作者的基本功。', setup:'任意 AI。',

  { id:'065', dim:'creativity', emoji:'🦸', title:'家庭超能力', tagline:'家里每人一个超能力。', difficulty:1, time:'15 分钟', goal:'个性观察——从外人视角看家人。', setup:'任意 AI。',

  { id:'066', dim:'creativity', emoji:'🏰', title:'世界设定师', tagline:'花一小时造一个小世界。', difficulty:3, time:'60 分钟', goal:'系统性创造——比单点子难,也更扎实。', setup:'任意 AI + 一本笔记本。',

  { id:'067', dim:'creativity', emoji:'🎤', title:'产品发布会', tagline:'孩子发布一个虚构产品。', difficulty:3, time:'30 分钟', goal:'让想象变成"可以被别人理解"的东西。', setup:'AI + 手机录像。',

function countDone(state, dim) {
  return Array.from(state.done).filter(id => {
    const c = CARDS.find(x => x.id === id);
    return c && c.dim === dim;
  }).length;
}

function countDifficulty3(state) {
  return Array.from(state.done).filter(id => {
    const c = CARDS.find(x => x.id === id);
    return c && c.difficulty === 3;
  }).length;
}

function maxDayCount(state) {
  const byDay = {};
  Object.entries(state.log).forEach(([id, iso]) => {
    const day = iso.slice(0, 10);
    byDay[day] = (byDay[day] || 0) + 1;
  });
  return Math.max(0, ...Object.values(byDay));
}

function computeAchievements(s) {
  const unlocked = new Set();
  const ctx = { ...s, streak: computeStreak(s), maxDayCount: maxDayCount(s) };
  ACHIEVEMENTS.forEach(a => { if (a.check(ctx)) unlocked.add(a.id); });
  return unlocked;
}

/* ================ 状态 ================ */
const _saved = Progress.load();
const state = {
  filter: 'all',
  search: '',
  done: new Set(_saved.done),
  log: _saved.log || {},
  daily: new Set(_saved.daily || []),
  achievements: new Set(_saved.achievements || []),
  updatedAt: _saved.updatedAt,
  openId: null,
  todayCardId: null,
};

function persist() {
  state.updatedAt = Progress.save({
    done: state.done, log: state.log,
    daily: state.daily, achievements: state.achievements,
  });
}

/* ================ 工具 ================ */
function ymd(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function computeStreak(s = state) {
  if (s.daily.size === 0) return 0;
  const today = ymd(), yesterday = ymd(new Date(Date.now() - 86400000));
  let cursor;
  if (s.daily.has(today)) cursor = new Date();
  else if (s.daily.has(yesterday)) cursor = new Date(Date.now() - 86400000);
  else return 0;
  let count = 0;
  while (s.daily.has(ymd(cursor))) { count++; cursor = new Date(cursor.getTime() - 86400000); }
  return count;
}

function getTodayCard() {
  if (state.todayCardId) {
    const c = CARDS.find(x => x.id === state.todayCardId);
    if (c) return c;
  }
  const today = ymd();
  const seed = [...today].reduce((s, c) => s + c.charCodeAt(0), 0);
  const pool = CARDS.filter(c => !state.done.has(c.id));
  const source = pool.length > 0 ? pool : CARDS;
  const idx = seed % source.length;
  state.todayCardId = source[idx].id;
  return source[idx];
}

function matchesSearch(card, q) {
  if (!q) return true;
  const text = (card.title + card.tagline + card.goal + card.tip + card.ext + card.steps.join('')).toLowerCase();
  return text.includes(q.toLowerCase());
}

function formatLastTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = Date.now() - d.getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins} 分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} 小时前`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days} 天前`;
  return d.toLocaleDateString('zh-CN');
}

/* ================ 导入导出 ================ */
function exportProgress() {
  const data = {
    version: 3, done: Array.from(state.done), log: state.log,
    daily: Array.from(state.daily), achievements: Array.from(state.achievements),
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ai-cards-progress-${ymd()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 进度已导出');
}

function importProgress(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.done)) throw new Error('格式不对');
      const merge = confirm('导入进度:\n• 确定 = 合并\n• 取消 = 替换');
      if (merge) {
        data.done.forEach(id => state.done.add(id));
        Object.assign(state.log, data.log || {});
        (data.daily || []).forEach(d => state.daily.add(d));
        (data.achievements || []).forEach(a => state.achievements.add(a));
      } else {
        state.done = new Set(data.done); state.log = data.log || {};
        state.daily = new Set(data.daily || []);
        state.achievements = new Set(data.achievements || []);
      }
      persist(); renderMain();
      showToast('✓ 进度已导入');
    } catch (err) { showToast('✗ 导入失败:' + err.message); }
  };
  reader.readAsText(file);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function showAchievementUnlock(ach) {
  const el = document.createElement('div');
  el.className = 'ach-unlock';
  el.innerHTML = `
    <div class="big-emoji">${ach.emoji}</div>
    <div>
      <div class="label">🎉 成就解锁</div>
      <div class="title">${ach.title}</div>
      <div class="desc">${ach.desc}</div>
    </div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3000);
}

function checkNewAchievements() {
  const current = computeAchievements(state);
  const newly = [];
  current.forEach(id => { if (!state.achievements.has(id)) newly.push(id); });
  if (newly.length > 0) {
    newly.forEach((id, i) => {
      state.achievements.add(id);
      const ach = ACHIEVEMENTS.find(a => a.id === id);
      if (ach) setTimeout(() => showAchievementUnlock(ach), i * 1500);
    });
  }
}

/* ================ 渲染 ================ */
const app = document.getElementById('app');

function dotsHTML(level) {
  return `<span class="dots">${[1,2,3].map(i => `<span class="dot ${i <= level ? 'on' : ''}"></span>`).join('')}</span>`;
}

function cardHTML(c) {
  const dim = DIMENSIONS[c.dim];
  const done = state.done.has(c.id);
  return `
    <div class="card dim-${c.dim} ${done ? 'done' : ''}" data-id="${c.id}">
      <div class="quick-mark" data-mark="${c.id}" title="${done ? '取消标记' : '标记完成'}">${done ? '✓' : ''}</div>
      <div class="card-top">
        <span class="card-no">NO.${c.id}</span>
        <div class="card-dim-tag">${dim.emoji} ${dim.name}</div>
        <div class="card-emoji">${c.emoji}</div>
        <div class="card-title">${c.title}</div>
      </div>
      <div class="card-body">
        <div class="card-tagline">${c.tagline}</div>
        <div class="card-meta">
          <span class="item">难度 ${dotsHTML(c.difficulty)}</span>
          <span class="item">⏱ ${c.time}</span>
        </div>
      </div>
    </div>`;
}

function radarSVG() {
  const cx = 130, cy = 130, maxR = 95;
  const dims = ['critical','creativity','communication','collaboration'];
  const colors = { critical:'#8b5cf6', creativity:'#f59e0b', communication:'#10b981', collaboration:'#0ea5e9' };
  const labels = { critical:'批判', creativity:'创造', communication:'表达', collaboration:'协作' };
  // 4 个方向:上、右、下、左
  const angles = [-Math.PI/2, 0, Math.PI/2, Math.PI];
  const values = dims.map(d => countDone(state, d) / 50); // 0-1

  // 背景网格
  let grid = '';
  [0.25, 0.5, 0.75, 1].forEach(r => {
    const pts = angles.map(a => {
      const x = cx + Math.cos(a) * maxR * r;
      const y = cy + Math.sin(a) * maxR * r;
      return `${x},${y}`;
    }).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;
  });

  // 轴线
  let axes = '';
  angles.forEach(a => {
    const x = cx + Math.cos(a) * maxR;
    const y = cy + Math.sin(a) * maxR;
    axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
  });

  // 数据多边形
  const dataPts = angles.map((a, i) => {
    const r = Math.max(values[i], 0.02) * maxR; // 最小可见
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    return `${x},${y}`;
  }).join(' ');
  const dataPoly = `<polygon points="${dataPts}" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6" stroke-width="2"/>`;

  // 数据点
  let dots = '';
  angles.forEach((a, i) => {
    const r = Math.max(values[i], 0.02) * maxR;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    dots += `<circle cx="${x}" cy="${y}" r="4" fill="${colors[dims[i]]}" stroke="#fff" stroke-width="2"/>`;
  });

  // 标签
  let labelsHtml = '';
  angles.forEach((a, i) => {
    const x = cx + Math.cos(a) * (maxR + 22);
    const y = cy + Math.sin(a) * (maxR + 22);
    const percent = Math.round(values[i] * 100);
    labelsHtml += `
      <text x="${x}" y="${y-4}" text-anchor="middle" font-size="12" font-weight="700" fill="${colors[dims[i]]}">${labels[dims[i]]}</text>
      <text x="${x}" y="${y+10}" text-anchor="middle" font-size="10" fill="#94a3b8">${percent}%</text>
    `;
  });

  return `<svg class="radar-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
    ${grid}${axes}${dataPoly}${dots}${labelsHtml}
  </svg>`;
}

function renderAchievements() {
  const unlocked = state.achievements;
  return ACHIEVEMENTS.map(a => {
    const isUnlocked = unlocked.has(a.id);
    return `
      <div class="ach-item ${isUnlocked ? 'unlocked' : 'locked'}">
        <div class="ach-emoji">${a.emoji}</div>
        <div class="ach-name">${a.title}</div>
        <div class="ach-tooltip">${a.desc}</div>
      </div>`;
  }).join('');
}

function renderMain() {
  checkNewAchievements();

  let filtered = state.filter === 'all' ? CARDS.slice() : CARDS.filter(c => c.dim === state.filter);
  if (state.search) filtered = filtered.filter(c => matchesSearch(c, state.search));

  const chips = Object.entries(DIMENSIONS).map(([key, d]) => {
    const count = key === 'all' ? CARDS.length : CARDS.filter(c => c.dim === key).length;
    const doneCount = key === 'all' ? state.done.size : countDone(state, key);
    const prefix = key === 'all' ? '' : d.emoji + ' ';
    return `<button class="chip ${state.filter === key ? 'active' : ''}" data-filter="${key}">
      ${prefix}${d.name} <span class="count">${doneCount}/${count}</span>
    </button>`;
  }).join('');

  const cardsHTML_ = filtered.length > 0
    ? filtered.map(cardHTML).join('')
    : `<div class="empty" style="grid-column:1/-1"><div class="empty-emoji">🔍</div><div>没找到匹配的卡片</div></div>`;

  const streak = computeStreak();
  const today = getTodayCard();
  const todayDim = DIMENSIONS[today.dim];
  const percent = Math.round((state.done.size / CARDS.length) * 100);
  const lastTimeStr = state.updatedAt ? ` · ${formatLastTime(state.updatedAt)}` : '';
  const achUnlocked = state.achievements.size;

  app.innerHTML = `
    <div class="hero">
      <div class="badge">✨ 陪儿子学 AI · 200 张共学卡</div>
      <h1>AI 共学卡片</h1>
      <p class="sub">200 张可以今晚就和孩子一起玩的小活动。<br>每张都对应一块 AI 时代的认知肌肉。</p>
    </div>

    <div class="dashboard">
      <div class="dash-card dash-today" id="todayBox">
        <div class="label">🌟 今日一卡</div>
        <div class="today-card" data-today="${today.id}">
          <div class="today-emoji">${today.emoji}</div>
          <div>
            <div class="today-title">${today.title}</div>
            <div class="today-tag">${todayDim.emoji} ${todayDim.name} · 难度 ${dotsHTML(today.difficulty)} · ${today.time}</div>
          </div>
        </div>
      </div>
      <div class="dash-card dash-streak">
        <div class="fire">${streak > 0 ? '🔥' : '⭕'}</div>
        <div class="num">${streak}</div>
        <div class="lbl">连续学习天数</div>
      </div>
      <div class="dash-card dash-progress">
        <div class="num">${state.done.size}<span style="font-size:18px;color:#94a3b8">/${CARDS.length}</span></div>
        <div class="lbl">${percent}% 已完成${lastTimeStr}</div>
        <div class="bar"><div class="fill" style="width:${percent}%"></div></div>
      </div>
    </div>

    <div class="insights">
      <div class="insights-card">
        <div class="insights-title"><span>🎯 四维发展雷达</span><span style="color:#8b5cf6">${state.done.size}/200</span></div>
        <div class="radar-wrap">${radarSVG()}</div>
        <div class="radar-legend">
          <span class="item" data-dim="critical"><span class="sw" style="background:#8b5cf6"></span>批判性思考</span>
          <span class="item" data-dim="creativity"><span class="sw" style="background:#f59e0b"></span>创造力</span>
          <span class="item" data-dim="communication"><span class="sw" style="background:#10b981"></span>表达力</span>
          <span class="item" data-dim="collaboration"><span class="sw" style="background:#0ea5e9"></span>协作力</span>
        </div>
      </div>
      <div class="insights-card">
        <div class="insights-title"><span>🏆 成就墙</span><span class="ach-summary">${achUnlocked}/${ACHIEVEMENTS.length} 已解锁</span></div>
        <div class="ach-grid">${renderAchievements()}</div>
      </div>
    </div>

    <div class="controls">
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索卡片标题、目标、内容……" value="${state.search.replace(/"/g,'&quot;')}">
      </div>
      <div class="filters">${chips}</div>
      <div class="actions">
        <button class="btn-draw" id="drawBtn">🎲 随机抽一张</button>
        <button class="btn-mini" id="exportBtn">⬇ 导出</button>
        <button class="btn-mini" id="importBtn">⬆ 导入</button>
        <button class="btn-mini" id="resetBtn">↺ 清空</button>
      </div>
      <div class="result-count">显示 ${filtered.length} 张 / 共 ${CARDS.length} 张</div>
    </div>

    <div class="grid">${cardsHTML_}</div>

    <div class="foot">
      ❤️ 一个爸爸的 AI 共学笔记<br>
      共 200 张 · 进度自动保存在本机 · 支持导出导入
    </div>
  `;

  document.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => { state.filter = btn.getAttribute('data-filter'); renderMain(); };
  });
  document.querySelectorAll('.radar-legend .item').forEach(el => {
    el.onclick = () => { state.filter = el.getAttribute('data-dim'); renderMain(); window.scrollTo({top: document.querySelector('.controls').offsetTop - 20, behavior: 'smooth'}); };
  });
  document.querySelectorAll('.card').forEach(card => {
    card.onclick = (e) => { if (e.target.closest('.quick-mark')) return; openModal(card.getAttribute('data-id')); };
  });
  document.querySelectorAll('.quick-mark').forEach(mk => {
    mk.onclick = (e) => { e.stopPropagation(); toggleDone(mk.getAttribute('data-mark')); };
  });
  document.getElementById('todayBox').onclick = () => openModal(today.id);
  document.getElementById('drawBtn').onclick = drawRandom;
  document.getElementById('exportBtn').onclick = exportProgress;
  document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('resetBtn').onclick = () => {
    if (state.done.size === 0 && state.daily.size === 0 && state.achievements.size === 0) return;
    if (confirm('确定清空所有进度?(建议先导出备份)')) {
      state.done.clear(); state.daily.clear(); state.log = {}; state.achievements.clear();
      state.todayCardId = null; Progress.reset(); state.updatedAt = null;
      renderMain();
    }
  };

  const searchInput = document.getElementById('searchInput');
  searchInput.oninput = (e) => {
    state.search = e.target.value;
    const filtered2 = (state.filter === 'all' ? CARDS.slice() : CARDS.filter(c => c.dim === state.filter))
      .filter(c => matchesSearch(c, state.search));
    const grid = document.querySelector('.grid');
    if (grid) {
      grid.innerHTML = filtered2.length > 0
        ? filtered2.map(cardHTML).join('')
        : `<div class="empty" style="grid-column:1/-1"><div class="empty-emoji">🔍</div><div>没找到匹配的卡片</div></div>`;
      document.querySelectorAll('.card').forEach(card => {
        card.onclick = (e) => { if (e.target.closest('.quick-mark')) return; openModal(card.getAttribute('data-id')); };
      });
      document.querySelectorAll('.quick-mark').forEach(mk => {
        mk.onclick = (e) => { e.stopPropagation(); toggleDone(mk.getAttribute('data-mark')); };
      });
    }
    const countEl = document.querySelector('.result-count');
    if (countEl) countEl.textContent = `显示 ${filtered2.length} 张 / 共 ${CARDS.length} 张`;
  };
}

function toggleDone(id) {
  if (state.done.has(id)) {
    state.done.delete(id); delete state.log[id];
  } else {
    state.done.add(id);
    state.log[id] = new Date().toISOString();
    state.daily.add(ymd());
  }
  persist();
  renderMain();
}

function drawRandom() {
  const pool = CARDS.filter(c => !state.done.has(c.id));
  const source = pool.length > 0 ? pool : CARDS;
  const pick = source[Math.floor(Math.random() * source.length)];
  openModal(pick.id);
}

function openModal(id) {
  const c = CARDS.find(x => x.id === id);
  if (!c) return;
  state.openId = id;
  const dim = DIMENSIONS[c.dim];
  const done = state.done.has(id);

  const html = `
    <div class="overlay" id="overlay">
      <div class="modal dim-${c.dim}" id="modal">
        <button class="close-btn" id="closeBtn">×</button>
        <div class="card-top modal-top">
          <span class="card-no">NO.${c.id}</span>
          <div class="card-dim-tag">${dim.emoji} ${dim.name}</div>
          <div class="card-emoji">${c.emoji}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-tagline-big">${c.tagline}</div>
          <div class="card-meta">
            <span class="item">难度 ${dotsHTML(c.difficulty)}</span>
            <span class="item">⏱ ${c.time}</span>
          </div>
        </div>
        <div class="modal-body">
          <div class="section"><div class="section-title">🎯 这张卡片在练什么</div><div class="section-content">${c.goal}</div></div>
          <div class="section"><div class="section-title">🛠 你需要准备</div><div class="section-content">${c.setup}</div></div>
          <div class="section"><div class="section-title">📋 具体怎么玩</div><ol class="steps">${c.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>
          <div class="section"><div class="section-title">💡 一句小提示</div><div class="tip-box"><span class="emoji">💡</span><div>${c.tip}</div></div></div>
          <div class="section"><div class="section-title">🚀 玩通了可以再升级</div><div class="extension-box"><span class="emoji">🚀</span><div>${c.ext}</div></div></div>
          <div class="modal-actions">
            ${done ? `<button class="btn-undo" id="undoBtn">↺ 取消完成</button>` : `<button class="btn-done" id="doneBtn">✓ 我们玩过啦</button>`}
          </div>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.body.style.overflow = 'hidden';

  const overlay = document.getElementById('overlay');
  document.getElementById('closeBtn').onclick = closeModal;
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
  const doneBtn = document.getElementById('doneBtn');
  if (doneBtn) doneBtn.onclick = () => { toggleDone(id); closeModal(); };
  const undoBtn = document.getElementById('undoBtn');
  if (undoBtn) undoBtn.onclick = () => { toggleDone(id); closeModal(); };
  document.addEventListener('keydown', escListener);
}

function escListener(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() {
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.remove();
  document.body.style.overflow = '';
  state.openId = null;
  document.removeEventListener('keydown', escListener);
}

document.getElementById('fileInput').onchange = (e) => {
  if (e.target.files[0]) importProgress(e.target.files[0]);
  e.target.value = '';
};

renderMain();
</script>
