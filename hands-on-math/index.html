  bug:"认为a一定是某个固定神秘数;把a+b当成必不等于a的新东西;不会代入求值;以为3a是3和a放一起而非3个a。",
  diag:"表达式2n+1,请用火柴棒讲一个故事:n是什么,2n+1又是什么?",
  probe:"为什么不能把每种搭法都列出来,非要写成 2n+1?字母帮我们表达了什么是一个个数字做不到的?",
  pr:{b:"用n表示n支笔每支3元一共多少钱。",v:"找出方块摆放序列的规律并用字母表达。",r:"给表达式5n-2编一个真实情境。",c:"用字母证明任意两个奇数之和一定是偶数(2m+1与2k+1)。"},
  mas:"能把生活规律写成含字母表达式,能正确代入求值,完成反向翻译。" },
{ id:"B2", t:"整式与合并同类项", band:"B", up:["B1","A3"], keys:["同类","系数","字母不变","同名"],
  meta:"同名才能合并——A3分数加减同一条根在代数里的再现。3a+2a=5a像3个苹果加2个苹果;但3a+2b不能合并,a和b是两种不同的东西。",
  exp:"用铅笔(a)和橡皮(b):桌上3支笔2块橡皮,又来2支笔4块橡皮,数出5支笔6块橡皮,即5a+6b。笔归笔、橡皮归橡皮。",
  img:"同类项用同色卡片归类的分拣图;代数瓷砖:长条代表x、小方块代表1,只有同形状能叠着数。",
  sym:"同类项=字母部分完全相同的项。合并=只把系数相加,字母部分不变:3a+2a=(3+2)a=5a。字母不变,因为东西没变,只是数量在加。",
  bug:"3a+2b=5ab或=5;合并时把指数也加(a+a=a²);分不清2a与a²(一个是2个a相加,一个是a乘a)。",
  diag:"为什么3a+2b不能再合并成一项?请用两种不同的实物说明。",
  probe:"这和你学过的'1/2+1/3要先通分'是同一个道理吗?'同名才能合并'这句话,在分数和字母里分别长什么样?",
  pr:{b:"合并4x+3x、7y-2y。",v:"化简3a+2b+5a-b。",r:"给5x+3y配一个买两种文具的故事。",c:"解释2a+a²为什么不能合并(代数瓷砖:长条和正方形大小不同)。"},
  mas:"能正确判断同类项、解释字母为何不变,能区分2a与a²,反向过关。" },
{ id:"B3", t:"乘法公式", band:"B", up:["B1","A10"], keys:["面积","四块","2ab","正方形"],
  meta:"乘法公式是长方形面积的不同算法殊途同归。(a+b)²就是边长a+b的大正方形面积——既可整块算,也可切成四小块分别算,两种算法必然相等。",
  exp:"剪一个边长a+b的大正方形,横竖各切一刀得四块:a×a、两块a×b、b×b。四块面积加起来正好等于大正方形,亲手验证(a+b)²=a²+2ab+b²。",
  img:"完全平方面积分割图:大正方形分成a²、ab、ab、b²;平方差(a+b)(a-b)用剪下一角再拼的面积重组图。",
  sym:"(a+b)²=a²+2ab+b²;(a-b)²=a²-2ab+b²;(a+b)(a-b)=a²-b²。每个公式都让孩子指出对应面积图哪一块。",
  bug:"(a+b)²=a²+b²(漏掉中间2ab,初中头号错误);纯背诵记错符号;不知公式从哪来,变形时无法灵活运用。",
  diag:"(a+b)²=a²+2ab+b²里,中间那个2ab在面积图上是哪两块?为什么是2个?",
  probe:"很多人写成 (a+b)²=a²+b²。如果把它看成一个大正方形的面积,他们到底'漏切'了哪两块?为什么偏偏是两块、不是一块?",
  pr:{b:"用面积图展开(x+3)²。",v:"用面积图理解(a-b)²中减号的来历。",r:"看到x²+6x+9,把它还原成哪个正方形的面积。",c:"用面积重组图证明(a+b)(a-b)=a²-b²。"},
  mas:"能用面积图推导并解释三个公式(尤其讲清2ab的来历),能正向展开也能反向识别,反向过关。" },
{ id:"B4", t:"因式分解", band:"B", up:["B3","A6"], keys:["逆","长方形","拼","还原"],
  meta:"因式分解=把一堆面积重新拼回一个长方形,是B3的逆向。展开是把长方形切开求和,分解就是已知各块面积反推这是哪个长方形——A6拼长方形在代数里的升级。",
  exp:"给瓷砖:1块x²、5块x(长条)、6块1(小方块),严丝合缝拼成长方形。拼出后量两条边:x+2和x+3,于是x²+5x+6=(x+2)(x+3)。",
  img:"代数瓷砖拼成长方形的实拼图;乘法竖式/十字相乘的格子图。",
  sym:"提公因式 ab+ac=a(b+c);公式法 a²-b²=(a+b)(a-b);十字相乘 x²+5x+6=(x+2)(x+3)。它是乘法的还原。",
  bug:"分解后不会用乘法回验;十字相乘纯凑数字、毫无图像;看不出x²-9是平方差;分不清展开和分解是反方向。",
  diag:"x²+5x+6=(x+2)(x+3),请用瓷砖或面积图说明:左边和右边为什么是同一块长方形?",
  probe:"展开和分解,哪个像'把长方形切开',哪个像'把碎块拼回长方形'?为什么说分解比展开难——拼图和拆图,哪个更费脑?",
  pr:{b:"提公因式3x+6、x²+x。",v:"用面积图分解x²+7x+12。",r:"给(x+1)(x+4)先展开再说明分解就是逆回去。",c:"分解x²-16并用平方差面积图解释。"},
  mas:"能用拼长方形/面积图解释一种以上分解、能用展开回验、能说明分解与展开互逆,反向过关。" },
{ id:"B5", t:"一元一次方程", band:"B", up:["B1"], keys:["天平","平衡","两边","移项"],
  meta:"方程是一架天平,等号是支点。两边一样重才平衡。解方程=保持平衡地两边同时增减,直到把未知数单独称出来。",
  exp:"左盘放1个未知重盒子加3个1克砝码,右盘放8克,天平平衡。两边同时拿掉3克,左边剩盒子、右边剩5克——盒子重5克。身体记住两边同做同一件事平衡不变。",
  img:"天平逐步配平的连环图,每步左右同时去掉相同量;数轴/长条平移图。",
  sym:"x+3=8 → x+3-3=8-3 → x=5。等式性质=两边同加/减/乘/除(非零)等式不变。移项变号被还原为真身:两边同时减去那一项。",
  bug:"移项变号只会口诀、解释不了为什么变号;只在一边动手;乘除时忘了两边都要做;把解方程和化简表达式混淆。",
  diag:"解2x+1=7时我们移项,这一步在天平上到底做了什么?为什么+1过去会变成-1?",
  probe:"'移项变号'是老师教的口诀。如果不准你用这四个字,只准说天平,你会怎么向同学解释那个'+1变-1'?",
  pr:{b:"用天平图解x+4=9、3x=12。",v:"解2x+1=7并逐步画天平。",r:"给x=5编一个天平/称重情境。",c:"解3x+2=x+10(两边都有未知数,天平两侧同时取走x)。"},
  mas:"能用天平解释每一步(尤其移项变号),能解两边含未知数的方程,反向过关。" },
{ id:"B6", t:"二元一次方程组", band:"B", up:["B5"], keys:["交点","消元","两个条件","直线"],
  meta:"方程组是两个条件同时成立的交汇点。一个二元方程画出一条线(无数种可能),两个方程画出两条线,它们的交点就是同时满足两个条件的唯一答案。",
  exp:"买文具:笔和本一共5件…让孩子先猜配数,逐渐发现满足第一条的组合有很多,但同时满足第二条的只有一组。或在方格纸上让两条件各画一条线看在哪相遇。",
  img:"两条直线在坐标系中相交于一点的图;天平+替换的示意图。",
  sym:"代入法=用一个条件把一个字母换掉;加减消元=两架平衡的天平叠加/相消,消去一个未知数。交点(3,2)=唯一同时满足两条件的解。",
  bug:"消元只是机械套路、不知在干什么;不理解为什么要消元;不知道解就是两条线的交点;算出一个值后忘了求另一个。",
  diag:"方程组{x+y=5, x-y=1}的解是x=3,y=2。请编一个购物或年龄故事,让这两个方程都说得通。",
  probe:"只满足第一个方程的(x,y)有无数个,为什么再加一个方程,答案就被'锁死'成唯一一组?'交点'这个词帮你看到了什么?",
  pr:{b:"用代入法解简单方程组。",v:"用加减消元解同一题并比较。",r:"给两类物品的购物情境列出方程组。",c:"在坐标纸上画两条直线,用交点验证代数解。"},
  mas:"能用一种方法求解并说明消元在做什么、能列方程组解决实际问题、理解解即交点,反向过关。" },
{ id:"B7", t:"不等式", band:"B", up:["B5","A8"], keys:["负数","变号","天平","数轴"],
  meta:"不等式是没有配平的天平——一边确实比另一边重。解法和方程几乎一样,但有一条特殊规则:两边同乘/同除一个负数,天平会翻个面,不等号要反向。",
  exp:"倾斜天平左边比右边重(>),两边同加同减倾斜方向不变。但乘负数用数轴:3<5两边同乘-1,-3却跑到-5右边,变成-3>-5——方向真的反了。",
  img:"倾斜天平图;数轴上乘-1时所有点关于0翻转的镜像图;解集用射线+空心/实心圆点表示。",
  sym:"不等式性质同方程,唯一例外:乘/除负数,不等号方向改变。解集写法x>2,并在数轴上画对应射线。",
  bug:"乘除负数忘记变号(头号错误);把解集x>2当成一个数x=2;数轴上空心实心点混用;不理解为什么唯独负数要变号。",
  diag:"解-2x<6时,最后一步要把不等号反向。请用数轴说明:为什么乘负数方向会反?",
  probe:"3<5 大家都同意。两边同乘 -1 之后,-3 和 -5 谁大?为什么乘正数不翻、偏偏乘负数要翻?这和A8的'方向'有关系吗?",
  pr:{b:"解x+3>5并在数轴上表示解集。",v:"解2x-1≤7。",r:"给至少/不超过的生活情境列出不等式(每张票30元,200元最多买几张)。",c:"解-3x+2>8,逐步解释变号那一步。"},
  mas:"能解不等式并正确处理负数变号(且能解释原因)、能用数轴表示解集、能列实际不等式,反向过关。" },
{ id:"B8", t:"一元二次方程", band:"B", up:["B3","B5"], keys:["配方","正方形","补","判别式"],
  meta:"解二次方程的核心动作叫配方——把一个缺角的图形补成一个完整的正方形,这样就能开方求边长。它把B3完全平方面积图反过来用。",
  exp:"瓷砖摆x²+6x:1个x²大正方形加6个x长条。把6个长条平分两组各3个贴在大正方形两邻边,右下角缺3×3=9。补上9,就拼成完整的(x+3)²——这就是配方。",
  img:"瓷砖从L形缺角到补全为正方形的拼接连环图;抛物线与x轴交点的图(交点即方程的根)。",
  sym:"配方:x²+6x = x²+6x+9-9 = (x+3)²-9。求根公式 x=(-b±√(b²-4ac))/2a 是对一般式配方后的通用结论;判别式b²-4ac决定能否开方、有几个根。",
  bug:"求根公式死记、符号错乱;不知配方补的是哪一块、为什么补这个数;判别式只会比0大小却不懂含义;漏掉负根。",
  diag:"配方时x²+6x为什么要加9?这个9在瓷砖图里是哪一块?加了9之后为什么又要减9?",
  probe:"'配方'这个词,'配'的是什么、'方'又是什么?如果不补那个角,正方形拼不完整,你还能开方求边长吗?",
  pr:{b:"用因式分解解x²-5x+6=0(先拼成长方形)。",v:"用瓷砖给x²+4x配方。",r:"给根x=2和x=3反推方程。",c:"对一般式ax²+bx+c=0配方,亲手推出求根公式。"},
  mas:"能用瓷砖/面积图解释配方(讲清加几、为何减回)、能用至少一种方法求解、理解判别式含义、不漏负根,反向过关。" },
{ id:"B9", t:"分式与分式方程", band:"B", up:["A3","A5","B5"], keys:["分数","通分","分母不为0","验根"],
  meta:"分式就是字母版的分数——分数的全部道理原样搬过来,只是分子分母里住进了字母。新增唯一警惕:分母不能为0。",
  exp:"先算1/2+1/3(通分到6),再换成1/x+1/y:道理一模一样,公分母xy。用工程问题接地:一人x天做完,一天做1/x;两人合作一天做1/x+1/y。",
  img:"把A3折纸/长条通分图直接套用,只是格数标成字母;工作量长条图(每天完成的一小段)。",
  sym:"分式运算=分数运算的字母版;分式方程=含未知数在分母的方程,两边同乘公分母化为整式方程。强调验根:必须排除使分母为0的增根。",
  bug:"通分时分子忘了同步变;约分时乱划,把加号两边的项当因式约掉;解完不验根、保留增根;忘记分母不为0的前提。",
  diag:"解分式方程时为什么必须验根?请举一个会产生增根的例子,并说明那个根为什么必须舍去。",
  probe:"普通方程不用验根,分式方程为什么非验不可?那个被舍去的'增根',它到底犯了什么'规'?(提示:分母)",
  pr:{b:"化简2/x+3/x、约分x²/x。",v:"通分1/x+1/(x+1)。",r:"给1/x+1/y编一个工程合作的故事。",c:"解一道会产生增根的分式方程,并解释为何舍去。"},
  mas:"能把分数运算法则迁移到分式、能解分式方程并正确验根、能说明分母不为0的理由,反向过关。" },
{ id:"C1", t:"平面直角坐标系", band:"C", up:["A8"], keys:["门牌","两个数","横","纵","顺序"],
  meta:"坐标系是平面上的门牌号系统。一个数定位数轴上一点;要定位平面上一点,需要两个数——横着走多远、竖着走多远。(3,2)就是平面上的确切地址。",
  exp:"地面画十字交叉两条数轴,孩子站原点:向右走3步再向上走2步,这就是(3,2)。另一孩子走到(2,3),位置完全不同:顺序很重要,横在前竖在后。",
  img:"标好x轴、y轴和原点的方格平面;一个点+两条虚线指示两个坐标;四个象限的方位图。",
  sym:"有序数对(x,y):x横坐标(右正)、y纵坐标(上正);原点(0,0);四象限符号规律。(3,2)与(2,3)是两个不同的点。",
  bug:"把横纵坐标写反;(3,2)与(2,3)不分;不理解负坐标;把找点和读点当成两件无关的事。",
  diag:"点(-2,3)在平面的哪个位置?请用从原点出发怎么走来描述,并说出它在第几象限。",
  probe:"数轴上一个数就能定位一点,平面上为什么非要两个数不可?为什么(3,2)和(2,3)是两个不同的地方、不能调换?",
  pr:{b:"描出(1,2)、(3,0)、(0,4)。",v:"描出(-2,1)、(2,-3)并说象限。",r:"给一个已描好的点,反读出它的坐标。",c:"描出(1,1),(2,2),(3,3),观察它们排成一条什么线。"},
  mas:"能准确描点与读点(含负坐标)、能说明(x,y)顺序的意义、能判断象限,反向过关。" },
{ id:"C2", t:"变量与函数", band:"C", up:["B1","C1"], keys:["机器","输入","输出","对应"],
  meta:"函数是一台机器:投进一个数(输入x),按固定规则吐出一个数(输出y)。关键:同一个输入永远只吐出同一个输出。y是x的函数=y完全由x决定。",
  exp:"做纸盒函数机,写规则乘2加1:投进3递出7、投进5递出11。再玩反例:同一输入有时吐7有时吐8,这台机器就坏了——它不是函数。",
  img:"输入-机器-输出的箭头流程图;输入输出对照表;把每对(x,y)描到坐标系(过渡到图像)。",
  sym:"自变量x、因变量y;函数关系y=2x+1或f(x)=2x+1;f(3)=7读作输入3输出7。图像上每个点(x,y)就是机器的一次输入-输出记录。",
  bug:"把函数只当静态公式、不理解变化/对应;不会从表或图读出对应关系;搞不清谁是自变量;不理解一个输入只能一个输出。",
  diag:"有台函数机,输入1出4、输入2出7、输入3出10。请猜出它的规则,并预测输入5会出什么。",
  probe:"如果一台机器,投进同一个3,这次吐7、下次吐8,它还能叫'函数'吗?为什么'同一输入只能一个输出'这条规矩这么要紧?",
  pr:{b:"给规则加3,填出输入1、2、5的输出表。",v:"给输入输出表,反推规则。",r:"给规则y=3x编一个真实情境(每米布3元)。",c:"判断身高与年龄、人与其生日哪些是函数关系。"},
  mas:"能在表、规则、图三者间转换、能说明自变量与因变量、理解单值对应,反向过关。" },
{ id:"C3", t:"一次函数", band:"C", up:["C2","B5"], keys:["匀速","直线","斜率","截距"],
  meta:"一次函数描述匀速、均匀的变化——每多走一步涨幅都一样,图像是一条笔直的斜线。两个关键量:斜率k(走一步涨多少)和截距b(出发时站在哪)。",
  exp:"储蓄罐先有5元(b=5),每天存2元(k=2):第0天5、第1天7、第2天9…描到坐标纸上排成一条直线。换每天存3元的,直线更陡——斜率就是陡度。",
  img:"储蓄点连成的直线;走1格升k格的台阶图显示斜率;直线与y轴交点即截距b。",
  sym:"y=kx+b。k=斜率=变化速度=x每增1则y增多少;b=纵截距=x=0时初始值;k>0上升、k<0下降。正比例y=kx是b=0的特例。",
  bug:"死记y=kx+b却不知k,b各代表什么;看图说不出斜率正负;不理解斜率就是变化快慢;把正比例与一次函数对立而非特例关系。",
  diag:"图上一条直线从(0,3)出发,每向右1格就向上2格。请写出函数式,并讲一个储蓄或行程的故事。",
  probe:"在你的储蓄故事里,k 和 b 分别是哪个真实的量?如果有两个人,一个起始钱多、一个每天存得多,他们的直线会长得怎样不同?",
  pr:{b:"给y=2x+1列表描点画直线。",v:"比较y=2x与y=2x+3(平移),以及y=2x与y=3x(陡度)。",r:"给一条直线图,读出k和b写出函数式。",c:"把出租车起步价8元、每公里2元写成函数并画图,预测5公里费用。"},
  mas:"能说明k,b的现实含义、能在式与图之间互译、理解正比例是特例,反向过关。" },
{ id:"C4", t:"反比例函数", band:"C", up:["C2","B9"], keys:["乘积","守恒","双曲线","此消彼长"],
  meta:"反比例描述总量固定时的此消彼长:乘积不变,一个变大另一个就变小。图像是一条永远靠近坐标轴却碰不到的双曲线。例:面积固定的长方形,长越大宽越小。",
  exp:"给12个方块摆长方形,面积固定12:1×12、2×6、3×4…把长和宽成对描到坐标纸,点连成向两端弯曲的曲线。或速度×时间=路程(定值)。",
  img:"面积固定的长方形长宽变化序列;长宽数对描出的双曲线;曲线无限逼近x轴、y轴(渐近线)的图。",
  sym:"y=k/x(或xy=k,k≠0)。k=那个不变的乘积(总量);x不能为0;k>0时图像在一、三象限。对比:一次函数加得均匀,反比例乘积守恒。",
  bug:"把反比例与一次函数混淆;不理解为什么曲线碰不到坐标轴;说不出k的现实含义;忽略x≠0。",
  diag:"y=12/x中,12代表什么固定不变的量?请用长方形面积或路程一定编一个故事。",
  probe:"一次函数是'一个涨、另一个也匀速涨',反比例却是'一个涨、另一个反而降'。为什么会反过来?那个'始终不变的乘积'在你的故事里是什么?",
  pr:{b:"给y=6/x列表(x=1,2,3,6)描点。",v:"比较y=6/x与y=12/x两条曲线。",r:"给一组此消彼长的数据,判断是否反比例并写式。",c:"解释曲线为何永远不与坐标轴相交(x与y都不能为0)。"},
  mas:"能说明k是守恒总量、能区分正比例与反比例、理解渐近行为与x≠0,反向过关。" },
{ id:"C5", t:"二次函数与抛物线", band:"C", up:["C2","B3","B8"], keys:["抛物线","对称","顶点","根"],
  meta:"二次函数描述加速/减速的变化,图像是一条左右对称、有最高或最低点的抛物线——抛球轨迹、喷泉水线就是它。它把B3完全平方、B8配方全画了出来。",
  exp:"抛球观察先上升到顶再下落的弧线。做表:y=x²,x=-2,-1,0,1,2对应y=4,1,0,1,4,描点连线——在0两侧完全对称,最低点在原点。",
  img:"球/喷泉弧线简图;y=x²的对称描点图;标出顶点、对称轴、与x轴的交点。",
  sym:"y=ax²+bx+c。a决定开口方向与胖瘦;顶点=最值点=配方后y=a(x-h)²+k中的(h,k);对称轴x=h。与x轴交点的横坐标=方程的根,判别式定交点个数。",
  bug:"不知道抛物线对称、找不到顶点;不理解a的正负与开口;看不出图像与x轴交点就是方程的根;配方学过却不知与图像顶点是同一回事。",
  diag:"球抛出后高度y=-x²+4x,何时到达最高点?最高多少?请说明怎么从图(或配方)看出,并讲清这个最高点对应抛物线的什么。",
  probe:"你在B8学的'配方'和这里的'找顶点',是两件事还是一件事?抛物线碰到x轴的地方,和那个二次方程的'根',为什么是同一批数?",
  pr:{b:"给y=x²列表描点画对称曲线。",v:"比较y=x²、y=2x²、y=-x²的开口。",r:"给抛物线顶点(2,-1)且开口向上,写出可能的函数式。",c:"用配方求y=x²-4x+3的顶点,并求与x轴交点,验证就是x²-4x+3=0的根。"},
  mas:"能说明a与开口、能用配方找顶点、能把图像与x轴交点和方程的根联系起来,反向过关。" },
{ id:"C6", t:"函数图像的平移与变换", band:"C", up:["C3","C5"], keys:["平移","左加右减","形状不变","顶点式"],
  meta:"改变函数式里某个部分,图像会整体搬家或变形,但基本形状不变。这条规则贯通所有函数。",
  exp:"用画好y=x²的透明纸压在坐标格上:整体向上滑3格就是y=x²+3、向右滑2格就是y=(x-2)²。亲手平移让加减导致挪动成为肌肉记忆。",
  img:"同一条曲线上下左右平移的叠影图;箭头标注移动方向;上加下减、左加右减的方位提示图。",
  sym:"f(x)+k上移k、f(x)-k下移;f(x+h)左移h、f(x-h)右移(左加右减与直觉相反,需重点接地)。配方y=a(x-h)²+k正是把标准抛物线搬到(h,k)。",
  bug:"左加右减记反(最高频错误);把平移和形状改变混淆;只会背规则、不能在图上预测移动方向;不理解顶点式就是平移结果。",
  diag:"y=(x-3)²+2是把y=x²怎样搬动得到的?为什么括号里是-3却要向右移?请用透明纸或描点验证。",
  probe:"括号里明明是'减3',图却往'右'移——这看起来很反直觉。你能找到一个具体的点(比如顶点),亲自验证它确实往右跑了吗?",
  pr:{b:"说出y=x²+4相对y=x²的移动。",v:"画出y=(x+1)²并与y=x²对比。",r:"给把y=x²右移2上移1,写出函数式。",c:"用平移解释y=2(x-1)²-3的图像和顶点,并验证与配方一致。"},
  mas:"能正确判断各方向平移(尤其讲清左加右减)、能由式画图也能由图写式、能把顶点式理解为平移,反向过关。" },
{ id:"C7", t:"用函数看方程", band:"C", up:["C3","B6","B8"], keys:["交点","横坐标","穿过","判别式"],
  meta:"把方程画出来:方程的解=两条曲线的交点的横坐标。解f(x)=g(x)就是问两条曲线在哪里相遇;解f(x)=0就是问这条曲线在哪里穿过x轴。",
  exp:"回到方程组购物问题:两条件各画一条直线,交点就是同时满足两条件的解。再看x²-4=0:画y=x²-4,看它在x=2和x=-2穿过x轴,正是两个根。",
  img:"两条直线相交于一点的图;抛物线与x轴两个交点的图;移动其中一条线观察交点变化。",
  sym:"f(x)=g(x)的解↔两图像交点横坐标;f(x)=0的解↔图像与x轴交点;判别式的正零负对应抛物线与x轴两、一、零个交点。",
  bug:"不能把解方程和找交点联系起来;算出代数解却不会在图上验证;不理解无实根对应图像不碰x轴;混淆交点的横坐标与纵坐标。",
  diag:"方程x²-x-2=0的解,在y=x²-x-2的图上对应什么?如果一个二次方程无实根,它的抛物线图会是什么样?",
  probe:"'解方程'听起来是算数字,'找交点'听起来是看图,它们怎么会是同一件事?一个方程'无实根',在图上意味着抛物线发生了什么?",
  pr:{b:"画y=x²-1,从图读出x²-1=0的根。",v:"用两条直线交点解{y=x+1, y=-x+5}。",r:"给抛物线与x轴只有一个交点,反推判别式的情况。",c:"画图说明x²+1=0为何无实根(抛物线整体在x轴上方)。"},
  mas:"能把方程/方程组的解解释为交点、能图象法验证代数解、能用判别式与交点个数互相印证,反向过关。" },
{ id:"C8", t:"用函数看不等式", band:"C", up:["C7","B7"], keys:["上面","区间","高低","x轴"],
  meta:"不等式也能看图:f(x)>g(x)就是问哪一段x曲线f跑在曲线g的上面。比大小变成了比高低,解集变成图上的一段区间。",
  exp:"用画好的两条线y=x+1与y=-x+5,在某点相交。手指沿x轴扫过去:交点左边哪条线更高?右边呢?哪条更高=哪个函数值更大。",
  img:"两条曲线与交点,把f在上方的那段x区间在x轴上高亮;抛物线在x轴上方/下方的区段对应f(x)>0/f(x)<0。",
  sym:"f(x)>g(x)的解集=图上f高于g的x区间;f(x)>0↔图像在x轴上方的区间。乘负数变号对应图像翻转后高低关系互换。",
  bug:"解不等式只会代数、不会看图;分不清高于对应哪段x;读区间时把x范围与y值混淆;面对二次不等式不知看抛物线在轴上/轴下。",
  diag:"要解x²-4>0,在y=x²-4的图上你应该找哪一部分?为什么?请说出解集并在x轴上指出。",
  probe:"方程问'两条线在哪相遇(一个点)',不等式问'哪一段谁在上面(一整段)'。为什么方程的答案是几个数、不等式的答案却是一个范围?",
  pr:{b:"由y=x-2的图读出x-2>0的解集。",v:"由两直线图读出x+1>-x+5的解。",r:"给抛物线在x轴下方的区间是-2<x<2,反推对应不等式。",c:"用抛物线图解x²-x-2<0,并与代数解法对照。"},
  mas:"能把不等式解集解释为谁在上面/在轴上下的区间、能图象法解一次与简单二次不等式、能与代数法互相印证,反向过关。" },
{ id:"D1", t:"点、线、面", band:"D", up:[], keys:["端点","无限","两点","线段"],
  meta:"点、线、面是几何世界的最小积木,像字母拼出所有单词。点是位置没有大小;线是点排成一队只有长短;面是线扫过去铺成一张,有长有宽没有厚。",
  exp:"笔尖戳一个点(理想中没有大小);许多点紧挨成一条线;笔横扫桌面,笔尖痕迹是线、整支笔扫过的区域是面。桌角是点、桌边是线段、桌面是面。",
  img:"点、直线(两端箭头)、线段(两端有端点)、射线(一端端点一端箭头)的对照图;平面用平行四边形表示。",
  sym:"点用大写字母A、B;直线AB(向两端无限延伸);线段AB(两端点、有长度);射线AB(一端点一方向)。两点确定一条直线;两点之间线段最短。",
  bug:"分不清直线、射线、线段(尤其哪端无限);以为几何的点线有大小粗细;不理解两点确定一条直线为何重要;读不懂图中字母标注。",
  diag:"直线、射线、线段三者有什么不同?请各画一个,并用有没有端点、能不能无限延伸来说明区别。",
  probe:"现实里画的线总有粗细,几何却说'线没有粗细'。这种'理想化'有什么用?如果线有粗细,会带来什么麻烦?",
  pr:{b:"画出线段AB、射线CD、直线EF并标字母。",v:"在一条直线上标出3个点,数能写出几条线段。",r:"给一幅图,说出哪些是线段、哪些是射线。",c:"解释为什么两点能确定唯一一条直线,而一个点不能。"},
  mas:"能区分点、线段、射线、直线,能正确标注与读图,理解理想化约定与两点定线,反向过关。" },
{ id:"D2", t:"角", band:"D", up:["D1"], keys:["张开","边长无关","量角器","余补"],
  meta:"角是两条射线从同一点张开的开口大小——像剪刀张开、像门推开。它只关乎张开程度,与边的长短无关。",
  exp:"用两根筷子固定一端张开不同程度,感受角变大变小。门慢慢推开,夹角从小变大。重点:把一根筷子拉长,角并没有变——角是转过的量,不是边的长。",
  img:"共顶点的两条射线;量角器叠在角上读度数;直角、锐角、钝角、平角、周角的对照图。",
  sym:"角∠AOB(O是顶点);直角90°、平角180°、周角360°;锐角<90°、钝角介于90°与180°;互余(和90°)、互补(和180°)。",
  bug:"以为边越长角越大;不会用量角器;分不清互余互补;读∠AOB时找错顶点。",
  diag:"时钟在3点整,时针和分针张开多大的角?如果我把分针画长一点,这个角会变吗?为什么?",
  probe:"一把大剪刀和一把小指甲剪,可以张开同样大的角吗?'角的大小'到底由什么决定、又和什么无关?",
  pr:{b:"用量角器量出几个角的度数。",v:"画出45°、120°的角。",r:"给一个角的两条边,判断是锐角、直角还是钝角。",c:"已知一个角是35°,求它的余角和补角。"},
  mas:"理解角是张开量与边长无关、会用量角器、能判断角的类型并求余补角,反向过关。" },
{ id:"D3", t:"相交线与平行线", band:"D", up:["D2"], keys:["对顶角","内错角","平行","判定"],
  meta:"两条直线在平面上只有两种命运:相交或平行(永不相遇,像铁轨)。第三条线横穿两条平行线,就会产生一组长得很像且确有规律的角。",
  exp:"铁轨、作业本横线都是平行线样本。用一支笔斜着横穿两条平行线,标出8个角,用纸片描下其中一个角去比对另一个,亲手发现有些角总是一样大。",
  img:"对顶角(相等)、邻补角(互补);两条平行线被第三条线所截的三线八角图,标出同位角、内错角、同旁内角。",
  sym:"平行AB∥CD;垂直AB⊥CD;对顶角相等;邻补角互补。平行线性质:同位角相等、内错角相等、同旁内角互补。反过来也能判定两线平行。",
  bug:"分不清同位角、内错角、同旁内角;把性质(已知平行推角)与判定(已知角推平行)用反;不理解对顶角为何必相等;垂直只当成看起来直。",
  diag:"两条平行线被一条斜线截断。你怎么向同学证明内错角一定相等,而不是只说看起来一样大?",
  probe:"'已知平行,所以内错角相等'和'已知内错角相等,所以平行'——这两句话方向相反。它们能混用吗?分别在什么时候用?",
  pr:{b:"在三线八角图中指出所有同位角。",v:"已知一个角70°,求其余7个角。",r:"给出内错角相等,判断两条线是否平行。",c:"解释对顶角相等为什么必然成立(用邻补角都等于180°减同一个角推出)。"},
  mas:"能识别各类角、能区分性质与判定、能给出对顶角相等的初步理由,反向过关。" },
{ id:"D4", t:"三角形", band:"D", up:["D3"], keys:["稳定","180","两边之和","内角和"],
  meta:"三角形是最稳固的图形——三根棍一旦接好形状就被锁死。塔吊、桥梁、屋顶都用三角形。它的三个内角永远凑成一个平角(180°)。",
  exp:"三根硬纸条钉成三角形、四根钉成四边形:一推,四边形歪斜,三角形纹丝不动。再剪一个三角形,把三个角撕下来拼在一起,恰好拼成一条直线(180°)。",
  img:"三角形分类图;三个内角撕下拼成平角的过程图;三边关系示意。",
  sym:"内角和∠A+∠B+∠C=180°;三边关系:任意两边之和大于第三边;等腰三角形等边对等角。",
  bug:"死记内角和180°却不知为何;不理解两边之和大于第三边;混淆按边分类与按角分类;等腰三角形性质用不起来。",
  diag:"为什么三根长度为2、3、10的棍子拼不出三角形?请动手试一试,并用两点之间线段最短来解释。",
  probe:"为什么所有形状千差万别的三角形,内角和都恰好是180°、一个不多一个不少?你能不靠量角器、用'撕角拼直线'说服自己吗?",
  pr:{b:"已知两个内角50°、60°,求第三个角。",v:"判断3,4,5与2,2,5能否构成三角形。",r:"给一个40°角和它是等腰三角形顶角,求两个底角。",c:"用平行线的内错角,证明三角形内角和为180°(过顶点作对边平行线)。"},
  mas:"能用内角和与三边关系解题、能分类、能给出内角和的几何理由,反向过关。" },
{ id:"D5", t:"图形变换", band:"D", up:["D4"], keys:["平移","旋转","翻折","不变形"],
  meta:"三种不改变形状大小的搬动:平移、旋转、翻折(对称)。共同点:搬动前后完全一样大、一样形状——这正是下一站全等的本质。",
  exp:"用剪好的纸三角形:在桌上滑动(平移)、按住一角转动(旋转)、沿折痕翻面(对称)。每做一次描在纸上,确认还是同一个三角形,只是换了地方。",
  img:"同一图形平移(箭头)、旋转(圆弧箭头)、翻折(对称轴)的三联对照图;轴对称(蝴蝶)与中心对称(风车)的例子。",
  sym:"平移:方向+距离;旋转:旋转中心+旋转角;轴对称:对称轴;中心对称:对称中心。三种变换都保持对应线段相等、对应角相等——这就是D6全等的定义。",
  bug:"三种变换混淆(尤其旋转与对称);找不到对称轴或旋转中心;不理解变换不改变大小形状;不能把变换与全等联系起来。",
  diag:"字母b经过怎样的变换会变成d?变成p呢?请说明是平移、旋转还是翻折。",
  probe:"这三种搬动,有没有哪一种能把'左手'变成'右手'(镜像)?为什么单靠平移和旋转做不到、非得翻折?",
  pr:{b:"画出一个三角形向右平移3格后的图形。",v:"画出一个图形关于某条竖线的轴对称图形。",r:"给变换前后两个图形,判断用了哪种变换。",c:"说明为什么三种变换都不改变图形的大小和形状。"},
  mas:"能识别与作出三种变换、能找对称轴/旋转中心、能说出三者都保持大小形状不变,反向过关。" },
{ id:"D6", t:"全等三角形", band:"D", up:["D5","D4"], keys:["重合","SSS","对应","判定"],
  meta:"两个图形全等=能通过搬动让它们完全叠在一起、严丝合缝。精彩处:不必量出所有边角,只要几个关键条件就能断定必然全等。",
  exp:"剪两个一模一样的三角形纸片叠在一起验证完全重合。再玩侦探游戏:只告诉三条边对应相等(SSS),用三根定长的棍子去拼,发现三边定下形状唯一——拼不出第二种。",
  img:"两个完全重合的三角形(对应记号);SSS、SAS、ASA、AAS四种判定的图示;反例:只有AAA时大小可不同。",
  sym:"全等符号△ABC≅△DEF(对应顶点按顺序写);对应边相等、对应角相等。判定:SSS、SAS、ASA、AAS。写≅时字母位置代表对应关系。",
  bug:"全等记号字母顺序写乱;判定条件张冠李戴(尤其SSA不成立);以为三个角相等就全等(那是相似);只会背判定不会找对应条件。",
  diag:"为什么知道三条边对应相等就能断定两个三角形全等,但三个角对应相等却不能?请各举例或动手验证。",
  probe:"明明三角形有3条边3个角共6个量,为什么只要对上3个(比如SSS)就够了?多出来的另外3个,是不是被前3个'自动锁死'了?",
  pr:{b:"指出两个全等三角形的对应边和对应角。",v:"判断给定条件属于哪种判定。",r:"给△ABC≅△DEF,写出所有对应相等的边和角。",c:"用全等证明等腰三角形两个底角相等。"},
  mas:"能正确书写全等关系、能选用恰当判定、理解为何AAA不能判定全等,反向过关。" },
{ id:"D7", t:"相似三角形", band:"D", up:["D6","B3"], keys:["放大","比例","平方","相似比"],
  meta:"相似是全等的放大缩小版:形状完全相同,大小可以不同。所有对应角相等,对应边成同一个比例。全等是相似且倍数为1的特例。",
  exp:"用手电筒把小三角形影子打在墙上放大:影子和原图形状一样、大小变了。看地图图上1厘米对应实地1公里,处处同比例。",
  img:"大小不同但形状相同的两个三角形;放大镜式的位似图;相似比k的示意。",
  sym:"相似符号△ABC∽△DEF;对应角相等、对应边成比例=k(相似比)。判定:两角对应相等(AA)即相似。重要结论:面积比=相似比的平方k²。",
  bug:"把相似与全等混为一谈;对应边比例写错;忘记面积比是边比的平方;不会用相似解决测高、测距等实际问题。",
  diag:"两个相似三角形,大三角形每条边是小三角形的3倍。它的面积是小三角形的几倍?为什么不是3倍?",
  probe:"边长放大3倍,面积却放大9倍——这个'平方'是从哪冒出来的?如果是体积呢,会放大几倍?(想想B3的面积图)",
  pr:{b:"已知两三角形相似、相似比2:3,求未知边。",v:"用AA判定两个三角形相似。",r:"给面积比9:1,反推相似比。",c:"用相似三角形(影子法)测算旗杆高度。"},
  mas:"能区分相似与全等、能用AA判定、能用相似比与面积比解题(含实际测量),反向过关。" },
{ id:"D8", t:"勾股定理", band:"D", up:["D4","B3","C1"], keys:["平方和","斜边","正方形","距离"],
  meta:"勾股定理是直角三角形里三条边长之间一条铁打的等式:两条直角边的平方和等于斜边的平方。它把长度和面积绑在一起,也是连接几何与坐标系的桥。",
  exp:"方格纸画直角边3格、4格的直角三角形,三条边各向外画正方形数格子:两小正方形9格和16格,大正方形恰好25格,9+16=25!",
  img:"直角三角形三边上的三个正方形(面积a²,b²,c²)图;3-4-5的方格验证图;拼图证明的分解图。",
  sym:"直角边a,b、斜边c:a²+b²=c²。逆定理:若a²+b²=c²则三角形必为直角。坐标系中两点距离正是用勾股定理算出。",
  bug:"分不清斜边是哪条;把公式套到非直角三角形;开方时忘记取正;不会用逆定理判断直角。",
  diag:"一个直角三角形两条直角边是6和8,斜边多长?请用三个正方形面积的图来解释你的算法,而不只是套公式。",
  probe:"a²+b²=c²里的'平方',如果不当成数字、而当成'正方形的面积',这个等式在说一件什么样的几何事实?为什么只对直角三角形成立?",
  pr:{b:"已知两直角边3,4,求斜边。",v:"已知斜边13、一直角边5,求另一直角边。",r:"给三边5,12,13,判断是否直角三角形。",c:"在坐标系中求(1,2)与(4,6)两点的距离。"},
  mas:"能正确使用定理与逆定理、能从面积角度解释、能在坐标系中求距离,反向过关。" },
{ id:"D9", t:"四边形", band:"D", up:["D4"], keys:["家谱","平行四边形","对角线","内角和"],
  meta:"四边形是一个有家谱的大家族:一般四边形→平行四边形→矩形、菱形→正方形,每往下一层就多一条限制、多一份对称。理解家谱就能一通百通。",
  exp:"可活动的四根纸条钉成四边形:一推就变形。把对边调平行得平行四边形;角掰成直角得矩形;四边调等长得菱形;既直角又等边就是正方形。",
  img:"四边形家谱树状图;各图形对边、对角、对角线性质的标注图。",
  sym:"平行四边形:对边平行且相等、对角线互相平分。矩形:平行四边形+一直角(对角线相等)。菱形:平行四边形+四边相等(对角线垂直)。正方形:既是矩形又是菱形。多边形内角和(n-2)×180°。",
  bug:"把各种四边形孤立死记、看不出包含关系;分不清矩形与菱形的对角线性质;多边形内角和公式死背不会推;判定与性质混用。",
  diag:"正方形为什么既是矩形又是菱形?请用家谱说明它从平行四边形一路加了哪些条件。",
  probe:"为什么(n-2)×180°能算任意多边形的内角和?如果你把一个五边形从一个顶点切成三角形,会切出几个?这和那个'-2'有关吗?",
  pr:{b:"已知平行四边形一个角70°,求其余三个角。",v:"判断对角线互相平分且相等的四边形是什么。",r:"给对角线互相垂直平分,反推可能是哪种四边形。",c:"用(n-2)×180°求五、六边形内角和,并说明公式怎么从切成三角形来的。"},
  mas:"能说清四边形家谱的包含关系、能用各图形性质与判定、能推导多边形内角和,反向过关。" },
{ id:"D10", t:"圆", band:"D", up:["D2"], keys:["距离相等","半径","π","圆周角"],
  meta:"圆是到一个定点距离都相等的所有点——一根绳一端固定、另一端拴笔转一圈画出的轨迹。它藏着半径、直径、弦、弧、圆心角与圆周角等一族关系。",
  exp:"图钉、绳子、铅笔画圆:明白半径不变是圆的本质。井盖为什么是圆的——任何方向都掉不下去。在圆上量:同弧所对圆心角是圆周角的两倍。",
  img:"圆心、半径、直径、弦、弧的标注图;圆心角与圆周角(同弧)的2倍关系图;切线垂直于半径的示意图。",
  sym:"半径r、直径d=2r;周长C=2πr、面积S=πr²(π约3.14);同弧所对圆周角是圆心角的一半;直径所对圆周角是直角。",
  bug:"混淆周长公式与面积公式;分不清弦、弧、直径;不理解π是周长与直径的固定比;圆周角与圆心角关系记反。",
  diag:"π到底是什么?请用任何圆的周长除以它的直径来解释,为什么不管圆大圆小这个比值都一样。",
  probe:"圆有大有小,为什么'周长÷直径'这个比值对所有圆都一样、都等于π?这背后藏着'所有圆都是同一个形状放大缩小'的事实吗?(想想D7)",
  pr:{b:"半径5,求周长和面积。",v:"已知直径求半径再求面积。",r:"已知周长2πr=12.56,反推半径。",c:"用直径所对圆周角是直角,解释木工如何用直角尺找出一个圆的圆心。"},
  mas:"能用周长面积公式、理解π的意义、能用圆周角与切线性质解题,反向过关。" },
{ id:"D11", t:"周长、面积与体积", band:"D", up:["D9","D7","B3"], keys:["维度","方块","平方","立方"],
  meta:"测量分三个维度:周长量绕一圈的长(一维);面积量铺满要多少方块(二维);体积量装满要多少小立方块(三维)。维度每升一级,单位就多乘一次长度——这解释了放大k倍,面积变k²、体积变k³。",
  exp:"面积:用1厘米小方块铺满长方形,数几行几列——长×宽是数方块的捷径。体积:用1立方厘米积木堆满盒子,数几层每层几个。周长:绳子绕一圈拉直量。",
  img:"长方形切成单位方格;长方体切成单位立方块;圆、三角形、组合图形的面积分解图。",
  sym:"长方形面积=长×宽;三角形=½×底×高;圆=πr²。长方体体积=长×宽×高;圆柱=πr²h。单位换算:1m²=10000cm²。相似图形:面积比=k²,体积比=k³。",
  bug:"周长与面积混淆(最常见);单位换算错(不理解平方要乘两次);三角形面积忘记½;不会把不规则图形拆成规则块求面积。",
  diag:"把一个正方形的边长变成原来的3倍,它的周长、面积各变成原来的几倍?请用数方块解释为什么面积是9倍而不是3倍。",
  probe:"周长是3倍、面积是9倍、体积是27倍——这串1、2、3次方是巧合吗?'数方块'时,长和宽都被放大3倍,所以面积里发生了什么?",
  pr:{b:"求长5宽3的长方形周长与面积。",v:"求底6高4的三角形面积。",r:"已知长方形面积24、长6,求宽。",c:"把一个L形图形拆成两个长方形求总面积;并解释1m²为何等于10000cm²。"},
  mas:"能区分三个维度的测量、会基本面积体积公式与单位换算、理解放大时k,k²,k³的规律,反向过关。" },
{ id:"D12", t:"几何推理与证明", band:"D", up:["D3","D4","D6"], keys:["理由","必然","推理","测量不是证明"],
  meta:"整条主干D的封顶之作。证明就是像律师打官司:从大家都承认的事实出发,一步步、每步都有理由,推出结论必然成立——不是因为看起来对或我量过,而是逻辑上不可能错。",
  exp:"玩理由接龙:老师说一个结论,孩子为每步说出因为…所以…,不许说看起来。像侦探破案要有证据链。回顾前面学过的微型证明,意识到他们其实早已在证明了。",
  img:"一道证明题的已知-求证-证明三段式版式;每步结论旁标注理由的箭头链;从条件到结论的逻辑流程图。",
  sym:"证明结构:已知、求证、证明(每步带理由)。理由来源:定义、公理、已证定理。符号∵(因为)、∴(所以)。每一步都必须有据可依,不能跳跃,不能用显然代替理由。",
  bug:"把测量验证当成证明;步骤之间跳跃、缺理由;用要证的结论当条件(循环论证);写不出规范格式;分不清性质与判定该用哪个当理由。",
  diag:"有人说我量了好几个三角形内角和都是180°所以一定是180°。这算证明吗?为什么不算?真正的证明应该怎么做?",
  probe:"量一万个三角形都是180°,为什么仍不算'证明'?'量出来的'和'推出来的',这两种'知道'差在哪里?数学为什么非要后一种?",
  pr:{b:"把对顶角相等写成规范的两步证明。",v:"已知两直线平行,证明某组内错角相等。",r:"给一段证明,在每步旁补上缺失的理由。",c:"综合证明平行四边形对角线互相平分(连对角线构造全等三角形,用ASA)。"},
  mas:"能区分验证与证明、能写出已知-求证-证明三段式、每步都给出正确理由、能完成2-3步的综合证明,反向过关。" },
{ id:"E1", t:"普查与抽样", band:"E", up:[], keys:["总体","样本","随机","偏差"],
  meta:"想知道一锅汤咸不咸,两个办法:把整锅喝光(普查),或搅匀后尝一勺(抽样)。第一步就是决定喝光还是尝一勺,以及那一勺怎么舀才公平。",
  exp:"问:要知道全校最喜欢的运动该怎么办?全校问累但准,只问自己班快但可能偏。再问:只问篮球队的人结果会怎样?——体会抽样不公平会带来偏差。",
  img:"总体用一大群小人图标,从中圈出一小撮代表样本;公平抽样(随机散布)与不公平抽样(只圈一角)的对照图。",
  sym:"总体(全部对象)、个体、样本、样本容量。普查(逐个调查)与抽样调查(用样本推断总体)。随机抽样:每个个体被抽中机会均等。",
  bug:"分不清总体、个体、样本;以为样本越特殊越好;不懂随机为何重要;遇到现实问题不会判断该普查还是抽样。",
  diag:"电视台想知道一个节目全国有多少人爱看。为什么不挨家挨户问,而是只调查几千个家庭?这几千个家庭如果全在同一个城市选,会有什么问题?",
  probe:"'尝一勺就知道整锅汤的味道'——这件事成立有个隐藏前提,是什么?(提示:那一勺得怎么舀)如果汤没搅匀就尝表面,会怎样?",
  pr:{b:"指出调查全班身高中的总体、个体。",v:"判断测一批炮弹的杀伤力该用普查还是抽样,为什么。",r:"给一个有偏差的调查结论,找出抽样哪里不公平。",c:"为全校学生平均每天睡几小时设计一个公平的抽样方案。"},
  mas:"能分清总体/个体/样本、能判断普查还是抽样、理解随机抽样为何能避免偏差,反向过关。" },
{ id:"E2", t:"整理与频数", band:"E", up:["E1","A2"], keys:["分类","频数","频率","占比"],
  meta:"收回来的一堆原始数据像散落一地的扑克牌,杂乱无章。整理就是把它们分门别类、各归各堆,再数一数每堆有几张——这一数,规律就浮出来了。",
  exp:"全班报鞋码写满黑板一片混乱。然后划正字:每出现一个鞋码就划一笔,数出每个鞋码几个人。原本看不懂的数字立刻变成清晰表格。",
  img:"杂乱数据→划记表→频数分布表的三步演变图;数据较多时按分组区间归类的分组表。",
  sym:"频数(某值出现的次数)、频率(频数÷总数,即占比)。所有频率加起来等于1。数据多时分组:组距、组数。",
  bug:"频数与频率混淆;频率之和不等于1时不知哪里错;分组时区间重叠或遗漏;只会填表不懂表在说什么。",
  diag:"某次考试40人,80分以上有10人。频数和频率分别是多少?这两个数,哪个更适合用来和另一个50人的班级比较?为什么?",
  probe:"40人的班和50人的班,直接比'80分以上的人数'公平吗?为什么换成'比例(频率)'才比得了?频率帮我们消除了什么干扰?",
  pr:{b:"给一组数据,用划记法做频数表。",v:"计算每组的频率,验证总和为1。",r:"已知某组频率0.25、总数40,求该组频数。",c:"把50个成绩合理分成5组,说明组距怎么定、区间端点归属如何约定。"},
  mas:"能整理原始数据成频数分布表、能算频数与频率、理解频率便于比较,反向过关。" },
{ id:"E3", t:"统计图的选择", band:"E", up:["E2","D10"], keys:["条形","折线","扇形","趋势"],
  meta:"三种统计图是数据的三种表情:条形图比谁多谁少、折线图看随时间怎么变、扇形图显各部分占整体多大比例。选错图,就像用错表情说话。",
  exp:"鞋码数据画条形图谁多谁少立刻看出;一周气温画折线图升降趋势一眼可见;科目占比画扇形图像分蛋糕。让孩子把同一组数据分别画三种图,讨论哪种最合适。",
  img:"同一批数据的条形图、折线图、扇形图三联对照;扇形图中占比×360°算圆心角;折线图的趋势箭头。",
  sym:"条形图:用条的高低表示数量。折线图:用点连线表示变化(适合看趋势)。扇形图:圆心角表示占比,某部分圆心角=该部分频率×360°。",
  bug:"三种图用途混淆;扇形图圆心角不会算;读图时只看高低不看坐标刻度(被截断的纵轴误导);不会从图反推数据。",
  diag:"要表示班级一学期里月考成绩怎么变化,该用哪种图?要表示班费花在哪些项目、各占多少,又该用哪种?为什么不能换着用?",

// —— 本地评估引擎(模拟 AI 批改):基于"母隐喻要点"覆盖度 + 作答深度 ——
function evaluateAnswer(answer, node) {
  const text = (answer || "").trim();
  const len = text.length;
  const keys = node.keys || [];
  const hit = keys.filter(k => text.includes(k));
  const miss = keys.filter(k => !text.includes(k));
  const ratio = keys.length ? hit.length / keys.length : 0;
  // 浅层套话检测
  const shallow = /^(不知道|不会|没有|不清楚|忘了|随便|123|aaa|。。。)+$/.test(text) || len < 10;
  let tier, status;
  if (len === 0) { tier = "empty"; status = null; }
  else if (shallow) { tier = "float"; status = "f"; }
  else if (ratio >= 0.6 && len >= 35) { tier = "grounded"; status = "g"; }
  else if (ratio >= 0.3 || len >= 28) { tier = "half"; status = "h"; }
  else { tier = "float"; status = "f"; }
  return { tier, status, hit, miss, ratio, len };
}

function buildFeedback(ev, node, byId) {
  const { tier, hit, miss } = ev;
  if (tier === "empty") {
    return { title:"先动笔", color:"slate", lead:"还没看到你的想法。", body:"哪怕只用最朴素的大白话、或者描述你会怎么画一幅图,都先写下来。这一步'把想法逼出来'本身,比答案对错更重要。" };
  }
  if (tier === "grounded") {
    return { title:"已接地 · 放行", color:"emerald",
      lead:`你抓住了核心:${hit.join("、")}。`,
      body:`你的解释里有具体可触摸的"形",而不是在空转符号——这正是真正理解的标志。可以放心推进下游了。${node.up.length?"":"这是一处地基,你把它讲扎实了,后面会一路受益。"} 想再进一步,可挑战第⑦格的最后一题。` };
  }
  if (tier === "half") {
    const lack = miss.slice(0, 2).join("、");
    return { title:"半悬空 · 原地补一刀", color:"amber",
      lead:`方向对了——你提到了 ${hit.length?hit.join("、"):"一些相关的点"}。`,
      body:`但还差关键的一环:"${lack||"核心隐喻"}" 没有出现在你的解释里。回到第②格的动手方式,把这一环亲手补进去,再重讲一遍。不必退回上游,你的地基是稳的,只是这一句还没说透。` };
  }
  // float
  const ups = node.up.map(u => `${u} ${byId[u].t}`);
  return { title:"全悬空 · 建议退回补地基", color:"rose",
    lead:`这一点的"形"还没真正被你触到——核心词 ${node.keys.join("、")} 几乎都没出现。`,
    body: node.up.length
      ? `这往往不是你笨,而是上游的地基塌了一块,导致这里悬空。强烈建议先回到:${ups.join(" / ")},把它重新接地,再回来。`
      : `这是一处根节点,无处可退。请直接用第②格的具象方式,从头把这个概念"摸"一遍,再来作答。` };
}
