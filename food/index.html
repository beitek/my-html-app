<!DOCTYPE html><html lang="zh-CN"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么 - 美食转盘</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: #333;
    }
    h1 { font-size: 2.2em; margin-bottom: 10px; color: #d2691e; text-shadow: 2px 2px 4px rgba(255,255,255,0.5); }
    .subtitle { margin-bottom: 20px; color: #8b4513; font-size: 1em; }
    .container { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; width: 100%; max-width: 1100px; }
    .wheel-section { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .wheel-container { position: relative; width: 90vw; max-width: 420px; aspect-ratio: 1; }
    .pointer {
        position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 22px solid transparent; border-right: 22px solid transparent;
        border-top: 40px solid #e74c3c;
        z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .pointer::after {
        content: ''; position: absolute; top: -45px; left: -10px;
        width: 20px; height: 20px; background: #c0392b; border-radius: 50%;
    }
    canvas {
        width: 100%; height: 100%; border-radius: 50%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 0 8px #fff, inset 0 0 0 12px #d2691e;
        background: #fff;
    }
    .center-btn {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 80px; height: 80px; border-radius: 50%;
        background: linear-gradient(145deg, #ff6b6b, #ee5a52);
        border: 4px solid #fff; color: #fff; font-size: 1.1em; font-weight: bold;
        cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        transition: transform 0.2s; z-index: 5;
    }
    .center-btn:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.1); }
    .center-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.95); }
    .center-btn:disabled { cursor: not-allowed; opacity: 0.7; }
    .result {
        font-size: 1.5em; font-weight: bold; color: #d2691e; min-height: 40px;
        text-align: center; padding: 10px 20px;
        background: rgba(255,255,255,0.7); border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 200px;
    }
    .controls {
        background: rgba(255,255,255,0.85); padding: 25px; border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 90vw; max-width: 380px;
    }
    .controls h2 { color: #d2691e; margin-bottom: 15px; font-size: 1.3em; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] {
        flex: 1; padding: 10px 14px; border: 2px solid #ffd1a3;
        border-radius: 10px; font-size: 1em; outline: none; transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #ff9a52; }
    button {
        padding: 10px 16px; border: none; border-radius: 10px;
        background: #ff9a52; color: white; font-size: 1em; cursor: pointer;
        font-weight: bold; transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #ff8533; }
    button:active { transform: scale(0.95); }
    .food-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
    .food-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; margin-bottom: 6px;
        background: #fff5e6; border-radius: 10px; border-left: 4px solid #ff9a52;
    }
    .food-name { font-size: 1em; color: #5d4037; }
    .delete-btn { background: #ff6b6b; padding: 4px 10px; font-size: 0.85em; border-radius: 6px; }
    .delete-btn:hover { background: #ee5a52; }
    .preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .preset-btn { flex: 1; min-width: 100px; background: #95c4a8; font-size: 0.9em; padding: 8px 12px; }
    .preset-btn:hover { background: #7fb593; }
    .clear-btn { background: #c0392b; }
    .clear-btn:hover { background: #a93226; }
    .empty-tip { text-align: center; color: #999; padding: 15px; font-style: italic; }

    /* 弹窗 */
    .modal-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.5);
        justify-content: center; align-items: center; z-index: 100;
        animation: fadeIn 0.3s;
    }
    .modal-overlay.show { display: flex; }
    .modal {
        background: linear-gradient(135deg, #fff 0%, #fff5e6 100%);
        padding: 25px 20px; border-radius: 24px; text-align: center;
        max-width: 92%; width: 400px;
        animation: popIn 0.5s; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h2 { color: #d2691e; font-size: 1.4em; margin-bottom: 6px; }
    .modal .winner {
        font-size: 1.8em; font-weight: bold; color: #e74c3c;
        margin: 6px 0;
    }
    .modal button { margin-top: 10px; padding: 10px 30px; }
    .modal-text { color: #8b4513; margin-top: 6px; font-size: 1em; min-height: 1.4em; }

    /* 食物展示场景 */
    .food-stage {
        position: relative; width: 100%; height: 280px;
        margin: 12px 0; overflow: hidden;
        background: radial-gradient(ellipse at center top, #fff8e7 0%, #ffe8c4 60%, #f5d59a 100%);
        border-radius: 20px;
        box-shadow: inset 0 -10px 25px rgba(160, 100, 50, 0.2),
                    inset 0 5px 15px rgba(255, 255, 255, 0.5);
    }

    /* 桌面 */
    .table-surface {
        position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
        background: linear-gradient(180deg, #c98a5e 0%, #8b5a3c 100%);
        border-top: 4px solid #b07d54;
    }
    .table-surface::before {
        content: ''; position: absolute; top: -3px; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    }

    /* 桌布/餐垫 */
    .placemat {
        position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
        width: 85%; height: 28px;
        background: repeating-linear-gradient(45deg, #d4546a, #d4546a 8px, #c04458 8px, #c04458 16px);
        border-radius: 50%;
        opacity: 0.8;
        box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    /* 主食物显示 */
    .main-food {
        position: absolute; bottom: 50px; left: 50%;
        transform: translateX(-50%);
        font-size: 8em;
        z-index: 5;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
        animation: foodFloat 2s ease-in-out infinite;
    }

    /* 装饰小食物（围绕主食物） */
    .deco-food {
        position: absolute;
        font-size: 1.8em;
        z-index: 4;
        filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
    }
    .deco-food.d1 { bottom: 60px; left: 8%; animation: decoBounce 2s ease-in-out infinite 0s; }
    .deco-food.d2 { bottom: 60px; right: 8%; animation: decoBounce 2s ease-in-out infinite 0.5s; }
    .deco-food.d3 { bottom: 40px; left: 18%; animation: decoBounce 2.5s ease-in-out infinite 0.3s; }
    .deco-food.d4 { bottom: 40px; right: 18%; animation: decoBounce 2.5s ease-in-out infinite 1s; }

    /* 蒸汽 */
    .steam {
        position: absolute;
        width: 16px; height: 30px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        opacity: 0;
        filter: blur(4px);
        z-index: 3;
    }
    .steam-1 { left: 38%; bottom: 200px; animation: steamRise 2.5s ease-in-out infinite 0s; }
    .steam-2 { left: 50%; bottom: 210px; animation: steamRise 2.5s ease-in-out infinite 0.6s; }
    .steam-3 { left: 62%; bottom: 200px; animation: steamRise 2.5s ease-in-out infinite 1.2s; }
    .steam-4 { left: 45%; bottom: 195px; animation: steamRise 2.5s ease-in-out infinite 1.8s; }

    /* 闪光/星星 */
    .sparkle {
        position: absolute;
        font-size: 1.4em;
        opacity: 0;
        z-index: 6;
        animation: sparkleAnim 2s ease-in-out infinite;
    }
    .sp1 { top: 20%; left: 25%; animation-delay: 0s; }
    .sp2 { top: 30%; right: 20%; animation-delay: 0.7s; }
    .sp3 { top: 15%; right: 35%; animation-delay: 1.3s; }
    .sp4 { top: 50%; left: 15%; animation-delay: 1.8s; }
    .sp5 { top: 55%; right: 12%; animation-delay: 0.4s; }

    /* 爱心 */
    .heart-float {
        position: absolute;
        font-size: 1.6em;
        opacity: 0;
        z-index: 6;
    }
    .h1 { left: 20%; bottom: 100px; animation: heartUp 3s ease-in-out infinite 0s; }
    .h2 { right: 20%; bottom: 110px; animation: heartUp 3s ease-in-out infinite 1s; }
    .h3 { left: 30%; bottom: 90px; animation: heartUp 3s ease-in-out infinite 2s; }

    /* 各种动画模式 */

    /* 默认：浮动 */
    .stage-default .main-food {
        animation: foodFloat 2s ease-in-out infinite;
    }

    /* 旋转 - 披萨/盖饭等圆形食物 */
    .stage-rotate .main-food {
        animation: foodRotate 6s linear infinite, foodFloat 2s ease-in-out infinite;
    }

    /* 弹跳 - 汉堡/炸鸡 */
    .stage-bounce .main-food {
        animation: foodBigBounce 1.2s ease-in-out infinite;
    }

    /* 摇摆 - 面条/拉面 */
    .stage-sway .main-food {
        animation: foodSway 2s ease-in-out infinite;
    }

    /* 融化滴落 - 冰淇淋 */
    .stage-melt .main-food {
        animation: foodMelt 2.5s ease-in-out infinite;
    }
    .melt-drop {
        position: absolute;
        font-size: 0.6em;
        opacity: 0;
        z-index: 4;
    }
    .stage-melt .melt-drop.md1 {
        bottom: 60px; left: 45%;
        animation: dropFall 2.5s ease-in infinite 0.5s;
    }
    .stage-melt .melt-drop.md2 {
        bottom: 60px; left: 53%;
        animation: dropFall 2.5s ease-in infinite 1.5s;
    }

    /* 冒泡 - 饮料 */
    .stage-bubble .main-food {
        animation: foodFloat 2s ease-in-out infinite;
    }
    .bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        z-index: 6;
        opacity: 0;
    }
    .bubble.b1 { width: 12px; height: 12px; bottom: 130px; left: 47%; animation: bubbleRise 2s ease-out infinite 0s; }
    .bubble.b2 { width: 8px; height: 8px; bottom: 140px; left: 52%; animation: bubbleRise 2s ease-out infinite 0.5s; }
    .bubble.b3 { width: 10px; height: 10px; bottom: 135px; left: 49%; animation: bubbleRise 2s ease-out infinite 1s; }
    .bubble.b4 { width: 6px; height: 6px; bottom: 145px; left: 51%; animation: bubbleRise 2s ease-out infinite 1.5s; }

    /* 心跳 - 蛋糕/甜点 */
    .stage-heartbeat .main-food {
        animation: foodHeartbeat 1.2s ease-in-out infinite;
    }

    /* 抖动 - 火锅/咖喱（沸腾） */
    .stage-boil .main-food {
        animation: foodBoil 0.4s ease-in-out infinite, foodFloat 2s ease-in-out infinite;
    }
    .stage-boil .bubble {
        background: rgba(255, 200, 100, 0.7);
        border-color: rgba(255, 220, 150, 0.9);
    }

    /* 翻转 - 寿司/便当 */
    .stage-flip .main-food {
        animation: foodFlip 3s ease-in-out infinite;
    }

    /* 滚动 - 串串/糖葫芦 */
    .stage-roll .main-food {
        animation: foodRoll 2s ease-in-out infinite;
    }

    /* === 关键帧动画 === */

    @keyframes foodFloat {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(-15px); }
    }
    @keyframes foodRotate {
        from { transform: translateX(-50%) rotate(0deg); }
        to { transform: translateX(-50%) rotate(360deg); }
    }
    @keyframes foodBigBounce {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1, 1); }
        20% { transform: translateX(-50%) translateY(-30px) scale(0.95, 1.05); }
        40% { transform: translateX(-50%) translateY(0) scale(1.1, 0.9); }
        60% { transform: translateX(-50%) translateY(-10px) scale(0.98, 1.02); }
    }
    @keyframes foodSway {
        0%, 100% { transform: translateX(-50%) rotate(-8deg) translateY(0); }
        50% { transform: translateX(-50%) rotate(8deg) translateY(-10px); }
    }
    @keyframes foodMelt {
        0%, 100% { transform: translateX(-50%) translateY(0) scaleY(1); }
        50% { transform: translateX(-50%) translateY(5px) scaleY(0.95); }
    }
    @keyframes foodHeartbeat {
        0%, 100% { transform: translateX(-50%) scale(1); }
        15% { transform: translateX(-50%) scale(1.15); }
        30% { transform: translateX(-50%) scale(1); }
        45% { transform: translateX(-50%) scale(1.1); }
        60% { transform: translateX(-50%) scale(1); }
    }
    @keyframes foodBoil {
        0%, 100% { transform: translateX(-50%) translateY(-15px) translateX(-50%); }
        25% { transform: translateX(-51%) translateY(-13px); }
        50% { transform: translateX(-49%) translateY(-15px); }
        75% { transform: translateX(-50.5%) translateY(-14px); }
    }
    @keyframes foodFlip {
        0%, 100% { transform: translateX(-50%) rotateY(0deg) translateY(0); }
        50% { transform: translateX(-50%) rotateY(180deg) translateY(-20px); }
    }
    @keyframes foodRoll {
        0% { transform: translateX(-80%) rotate(-30deg); }
        50% { transform: translateX(-50%) rotate(0deg) translateY(-15px); }
        100% { transform: translateX(-20%) rotate(30deg); }
    }
    @keyframes decoBounce {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-12px) rotate(5deg); }
    }
    @keyframes steamRise {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-90px) scale(2) translateX(15px); opacity: 0; }
    }
    @keyframes sparkleAnim {
        0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
    }
    @keyframes heartUp {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-150px) scale(1.4); opacity: 0; }
    }
    @keyframes dropFall {
        0%, 30% { transform: translateY(0); opacity: 0; }
        40% { opacity: 1; transform: translateY(0); }
        100% { transform: translateY(50px); opacity: 0; }
    }
    @keyframes bubbleRise {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 600px) {
        h1 { font-size: 1.6em; }
        .center-btn { width: 65px; height: 65px; font-size: 0.9em; }
        .main-food { font-size: 6em; }
    }
</style>
</head>
<body>
    <h1>🍜 今天吃什么 🍱</h1>
    <p class="subtitle">让转盘帮你做决定吧～</p>

    <div class="container">
        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="500" height="500"></canvas>
                <button class="center-btn" id="spinBtn">开始</button>
            </div>
            <div class="result" id="result">点击"开始"旋转转盘</div>
        </div>

        <div class="controls">
            <h2>🍳 美食列表</h2>
            <div class="input-group">
                <input type="text" id="foodInput" placeholder="输入美食名称..." maxlength="10">
                <button id="addBtn">添加</button>
            </div>
            <div class="food-list" id="foodList"></div>
            <div class="preset-btns">
                <button class="preset-btn" id="presetBtn">载入示例</button>
                <button class="preset-btn clear-btn" id="clearBtn">全部清空</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>🎉 决定了！</h2>
            <div class="winner" id="winnerName"></div>

            <div class="food-stage" id="foodStage">
                <div class="sparkle sp1">✨</div>
                <div class="sparkle sp2">⭐</div>
                <div class="sparkle sp3">✨</div>
                <div class="sparkle sp4">⭐</div>
                <div class="sparkle sp5">✨</div>

                <div class="heart-float h1">❤️</div>
                <div class="heart-float h2">💕</div>
                <div class="heart-float h3">💖</div>

                <div class="steam steam-1"></div>
                <div class="steam steam-2"></div>
                <div class="steam steam-3"></div>
                <div class="steam steam-4"></div>

                <div class="bubble b1"></div>
                <div class="bubble b2"></div>
                <div class="bubble b3"></div>
                <div class="bubble b4"></div>

                <div class="melt-drop md1" id="meltDrop1"></div>
                <div class="melt-drop md2" id="meltDrop2"></div>

                <div class="placemat"></div>

                <div class="deco-food d1" id="deco1"></div>
                <div class="deco-food d2" id="deco2"></div>
                <div class="deco-food d3" id="deco3"></div>
                <div class="deco-food d4" id="deco4"></div>

                <div class="main-food" id="mainFood">🍔</div>

                <div class="table-surface"></div>
            </div>

            <div class="modal-text" id="modalText">看起来真好吃！😋</div>
            <button id="closeModal">好的</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const result = document.getElementById('result');
    const foodInput = document.getElementById('foodInput');
    const addBtn = document.getElementById('addBtn');
    const foodList = document.getElementById('foodList');
    const presetBtn = document.getElementById('presetBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modal = document.getElementById('modal');
    const winnerName = document.getElementById('winnerName');
    const closeModal = document.getElementById('closeModal');
    const mainFood = document.getElementById('mainFood');
    const modalText = document.getElementById('modalText');
    const foodStage = document.getElementById('foodStage');

    const colors = [
        '#FF6B6B', '#4ECDC4', '#FFD93D', '#6BCB77',
        '#FF8C42', '#A8E6CF', '#FFAAA5', '#C7B3FF',
        '#FFB6B9', '#8AC6D1', '#FFE66D', '#95E1D3'
    ];

    // 食物配置：emoji + 动画类型 + 装饰小图 + 蒸汽 + 描述
    const foodConfig = {
        // 摇摆类（面条）
        '面条': { emoji: '🍜', mode: 'sway', deco: ['🥢','🥢','🌶️','🥬'], steam: true, drop: '🍜' },
        '拉面': { emoji: '🍜', mode: 'sway', deco: ['🥢','🍥','🥚','🌿'], steam: true },
        '泡面': { emoji: '🍜', mode: 'sway', deco: ['🥢','🥚','🌶️','🥬'], steam: true },
        '螺蛳粉': { emoji: '🍜', mode: 'sway', deco: ['🌶️','🥜','🥬','🌶️'], steam: true },
        '酸辣粉': { emoji: '🍜', mode: 'sway', deco: ['🌶️','🥜','🥢','🥬'], steam: true },
        '凉面': { emoji: '🍜', mode: 'sway', deco: ['🥒','🥕','🥢','🌿'], steam: false },
        '乌冬面': { emoji: '🍜', mode: 'sway', deco: ['🥢','🍥','🥬','🌿'], steam: true },
        '热干面': { emoji: '🍜', mode: 'sway', deco: ['🥢','🥜','🌿','🥬'], steam: true },
        '炸酱面': { emoji: '🍜', mode: 'sway', deco: ['🥢','🥒','🍅','🥬'], steam: true },
        '米线': { emoji: '🍜', mode: 'sway', deco: ['🌶️','🥬','🥢','🌿'], steam: true },

        // 旋转类（圆形）

    function getFoodInfo(food) {
        if (foodConfig[food]) return foodConfig[food];
        for (const key in foodConfig) {
            if (food.includes(key) || key.includes(food)) {
                return foodConfig[key];
            }
        }
        return { emoji: '🍽️', mode: 'default', deco: ['🍴','🥄','🌿','✨'], steam: true };
    }

    let foods = ['火锅', '拉面', '披萨', '冰淇淋', '寿司', '炸鸡', '奶茶', '蛋糕'];
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
        const size = canvas.width;
        const center = size / 2;
        const radius = center - 10;
        ctx.clearRect(0, 0, size, size);

        if (foods.length === 0) {
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f5f5f5'; ctx.fill();
            ctx.fillStyle = '#999'; ctx.font = '24px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('请添加美食', center, center - 20);
            ctx.fillText('🍽️', center, center + 20);
            return;
        }

        const sliceAngle = (Math.PI * 2) / foods.length;
        foods.forEach((food, i) => {
            const startAngle = i * sliceAngle - Math.PI / 2;
            const endAngle = startAngle + sliceAngle;
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 22px "PingFang SC", "Microsoft YaHei", sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 4;
            const textRadius = radius - 25;
            ctx.fillText(food, textRadius, 0);
            ctx.restore();
        });
        ctx.beginPath();
        ctx.arc(center, center, 50, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
    }

    function renderFoodList() {
        foodList.innerHTML = '';
        if (foods.length === 0) {
            foodList.innerHTML = '<div class="empty-tip">列表是空的，添加一些美食吧～</div>';
            return;
        }
        foods.forEach((food, i) => {
            const info = getFoodInfo(food);
            const div = document.createElement('div');
            div.className = 'food-item';
            div.innerHTML = `<span class="food-name">${i + 1}. ${info.emoji} ${food}</span>
                <button class="delete-btn" data-index="${i}">删除</button>`;
            foodList.appendChild(div);
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                foods.splice(parseInt(e.target.dataset.index), 1);
                drawWheel(); renderFoodList();
            });
        });
    }

    function addFood() {
        const value = foodInput.value.trim();
        if (!value) return;
        if (foods.length >= 12) { alert('最多只能添加12个哦～'); return; }
        if (foods.includes(value)) { alert('已经有这个美食啦！'); return; }
        foods.push(value); foodInput.value = '';
        drawWheel(); renderFoodList();
    }

    function setupFoodStage(food) {
        const info = getFoodInfo(food);
        const mode = info.mode;

        // 重置场景类
        foodStage.className = 'food-stage stage-' + mode;

        // 设置主食物
        mainFood.textContent = info.emoji;

        // 设置装饰小食物
        const decos = info.deco || ['🌿','✨','⭐','🌿'];
        document.getElementById('deco1').textContent = decos[0] || '';
        document.getElementById('deco2').textContent = decos[1] || '';
        document.getElementById('deco3').textContent = decos[2] || '';
        document.getElementById('deco4').textContent = decos[3] || '';

        // 蒸汽显隐
        document.querySelectorAll('.steam').forEach(s => {
            s.style.display = info.steam ? 'block' : 'none';
        });

        // 融化滴落
        const drop = info.drop || '💧';
        document.getElementById('meltDrop1').textContent = drop;
        document.getElementById('meltDrop2').textContent = drop;

        // 台词
        const texts = yummyTextsByMode[mode] || yummyTextsByMode.default;
        modalText.textContent = texts[Math.floor(Math.random() * texts.length)];
    }

    function spin() {
        if (isSpinning) return;
        if (foods.length < 2) {
            result.textContent = '至少需要2个选项哦～';
            return;
        }
        isSpinning = true;
        spinBtn.disabled = true;
        result.textContent = '旋转中...';

        const sliceAngle = 360 / foods.length;
        const winnerIndex = Math.floor(Math.random() * foods.length);
        const targetAngle = -(winnerIndex * sliceAngle + sliceAngle / 2) + (Math.random() * sliceAngle * 0.6 - sliceAngle * 0.3);
        const fullSpins = 5 + Math.floor(Math.random() * 3);
        const finalRotation = currentRotation + fullSpins * 360 + (targetAngle - (currentRotation % 360));

        canvas.style.transition = 'transform 4.5s cubic-bezier(0.17, 0.67, 0.16, 0.99)';
        canvas.style.transform = `rotate(${finalRotation}deg)`;
        currentRotation = finalRotation;

        setTimeout(() => {
            isSpinning = false;
            spinBtn.disabled = false;
            const winner = foods[winnerIndex];
            const info = getFoodInfo(winner);
            result.textContent = `🎯 ${info.emoji} ${winner}`;
            winnerName.textContent = `${info.emoji} ${winner}`;
            setupFoodStage(winner);
            modal.classList.add('show');
        }, 4600);
    }

    addBtn.addEventListener('click', addFood);
    foodInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addFood(); });
    spinBtn.addEventListener('click', spin);
    presetBtn.addEventListener('click', () => {
        foods = ['火锅', '拉面', '披萨', '冰淇淋', '寿司', '炸鸡', '奶茶', '蛋糕'];
        drawWheel(); renderFoodList();
    });
    clearBtn.addEventListener('click', () => {
        foods = []; drawWheel(); renderFoodList();
    });
    closeModal.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
    });

    drawWheel();
    renderFoodList();
