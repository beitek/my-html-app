<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读积木诊断馆</title>
  <style>
    :root {
      --ink: #23313d;
      --muted: #64717f;
      --paper: #f8f4eb;
      --panel: #fffdf8;
      --line: #d7cdbc;
      --teal: #1f8a8a;
      --green: #5b8c45;
      --red: #c95b4b;
      --gold: #d89b36;
      --blue: #3f73b8;
      --violet: #7965a8;
      --shadow: 0 16px 38px rgba(35, 49, 61, .14);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(31,138,138,.08) 0 1px, transparent 1px 56px),
        linear-gradient(0deg, rgba(216,155,54,.10) 0 1px, transparent 1px 56px),
        var(--paper);
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .app {
      width: min(1160px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 15px;
      max-width: 760px;
    }

    .hud {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .86);
      border-radius: 8px;
      padding: 9px 12px;
      min-width: 92px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(35, 49, 61, .06);
    }

    .badge b {
      display: block;
      font-size: 18px;
      margin-top: 2px;
    }

    .board {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .progress {
      height: 10px;
      background: #eadfcb;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--gold), var(--red));
      transition: width .3s ease;
    }

    .scene {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      min-height: 650px;
    }

    .side {
      border-right: 1px solid var(--line);
      background: #f3ead8;
      padding: 22px;
      position: relative;
    }

    .stage {
      padding: 24px;
    }

    .book-art {
      width: 100%;
      max-width: 260px;
      margin: 4px auto 18px;
      display: block;
    }

    .scroll {
      border: 1px solid #cabca5;
      background: #fffaf0;
      border-radius: 8px;
      padding: 14px;
      line-height: 1.75;
      font-size: 15px;
    }

    .scroll h2 {
      font-size: 16px;
      margin: 0 0 8px;
    }

    .source-status {
      min-height: 150px;
      display: grid;
      align-content: center;
      gap: 8px;
      text-align: center;
    }

    .source-status strong {
      font-size: 18px;
    }

    .level-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 72px;
      min-height: 30px;
      padding: 5px 9px;
      color: white;
      background: var(--blue);
      border-radius: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .difficulty-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .difficulty {
      border: 1px solid #cfc4b3;
      background: #fffdf8;
      border-radius: 8px;
      padding: 12px 8px;
      cursor: pointer;
      text-align: center;
    }

    .difficulty.selected {
      color: white;
      background: var(--teal);
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(31,138,138,.18);
    }

    .reading-sheet {
      border: 1px solid var(--line);
      border-left: 7px solid var(--teal);
      background: #fffaf0;
      border-radius: 8px;
      padding: 20px;
      font-size: 17px;
      line-height: 2;
    }

    .reading-sheet h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(35, 49, 61, .68);
    }

    .modal.open { display: grid; }

    .modal-panel {
      width: min(760px, 100%);
      max-height: min(78vh, 760px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .modal-head {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
    }

    .modal-body {
      padding: 20px;
      font-size: 17px;
      line-height: 2;
    }

    .unlock-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .stage-title {
      display: flex;
      align-items: start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .stage-num {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--teal);
      border-radius: 8px;
      font-weight: 700;
    }

    .stage-title h2 {
      margin: 0 0 4px;
      font-size: 25px;
      line-height: 1.15;
    }

    .stage-title p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .cards {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-bottom: 20px;
    }

    .bins {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }

    .card, .chip, .option, .claim, .match-node {
      border: 1px solid #cfc4b3;
      background: #fffdf8;
      border-radius: 8px;
      padding: 12px;
      min-height: 54px;
      line-height: 1.45;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    .card {
      border-left: 7px solid var(--gold);
    }

    .card:hover, .chip:hover, .option:hover, .claim:hover, .match-node:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 18px rgba(35,49,61,.10);
    }

    .selected {
      border-color: var(--blue);
      background: #edf4ff;
      box-shadow: 0 0 0 3px rgba(63,115,184,.18);
    }

    .placed {
      opacity: .42;
    }

    .bin {
      min-height: 190px;
      border: 2px dashed #bba98e;
      border-radius: 8px;
      background: #fbf6eb;
      padding: 12px;
    }

    .bin h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .bin .mini-card {
      background: white;
      border: 1px solid #d7cdbc;
      border-left: 5px solid var(--teal);
      border-radius: 7px;
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
    }

    .chips {
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    }

    .chip {
      min-height: 48px;
      text-align: center;
      display: grid;
      place-items: center;
      border-left: 6px solid var(--green);
    }

    .compose {
      grid-template-columns: repeat(3, 1fr);
    }

    .compose-col {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbf6eb;
      padding: 12px;
    }

    .compose-col h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .option {
      margin-bottom: 10px;
      border-left: 6px solid var(--violet);
    }

    .sentence-preview {
      margin: 18px 0;
      border: 1px solid #cfc4b3;
      background: #fffaf0;
      border-radius: 8px;
      padding: 14px;
      min-height: 58px;
      font-weight: 700;
      line-height: 1.5;
    }

    .match {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }

    .match-col {
      display: grid;
      gap: 10px;
    }

    .match-node {
      border-left: 6px solid var(--blue);
    }

    .match-node.done {
      background: #eef8f1;
      border-color: #9ab98f;
      color: #51605a;
    }

    .pairs {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .pair-line {
      border: 1px solid #d7cdbc;
      background: #fffaf0;
      border-radius: 8px;
      padding: 10px;
      line-height: 1.45;
    }

    .claims {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      margin-bottom: 18px;
    }

    .claim {
      border-left: 6px solid var(--red);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
      align-items: center;
    }

    .btn {
      border: 0;
      background: var(--ink);
      color: white;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      min-height: 44px;
    }

    .btn.secondary {
      background: #f7efe1;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn.store {
      background: var(--green);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #eef6f6;
      border: 1px solid #b9d8d8;
      line-height: 1.6;
      display: none;
    }

    .feedback.show { display: block; }

    .confidence {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .stone {
      border: 1px solid #cfc4b3;
      border-radius: 8px;
      background: white;
      min-height: 110px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px;
      cursor: pointer;
    }

    .stone strong {
      display: block;
      font-size: 24px;
      color: var(--teal);
    }

    .result {
      display: grid;
      grid-template-columns: minmax(240px, 330px) 1fr;
      gap: 20px;
    }

    .score-card, .ability-list, .advice {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      padding: 16px;
    }

    .big-score {
      font-size: 62px;
      font-weight: 800;
      line-height: 1;
      color: var(--teal);
      margin: 12px 0;
    }

    .ability {
      display: grid;
      grid-template-columns: 122px 1fr 48px;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      font-size: 14px;
    }

    .bar {
      height: 12px;
      background: #eadfcb;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--red), var(--gold), var(--teal));
    }

    .tips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .tip {
      border: 1px solid #d7cdbc;
      border-left: 6px solid var(--gold);
      background: #fffaf0;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.55;
    }

    .hidden { display: none; }

    @media (max-width: 820px) {
      .topbar, .scene, .result, .compose, .match {
        grid-template-columns: 1fr;
      }

      .side {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .hud {
        justify-content: start;
      }

      .stage {
        padding: 18px;
      }

      .confidence {
        grid-template-columns: 1fr;
      }

      .ability {
        grid-template-columns: 96px 1fr 42px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>阅读积木诊断馆</h1>
        <div class="subtitle">把长文拆成 Chunk，把信息变成自己的积木。通过拖拽、筛选、拼接、连接和巡逻，快速观察一个人的阅读能力轮廓。</div>
      </div>
      <div class="hud">
        <div class="badge">关卡<b id="stageBadge">0/5</b></div>
        <div class="badge">用时<b id="timer">00:00</b></div>
        <div class="badge">概念库<b id="vaultCount">0</b></div>
      </div>
    </div>

    <section class="board">
      <div class="progress"><span id="progressBar"></span></div>
      <div class="scene">
        <aside class="side">
          <svg class="book-art" viewBox="0 0 360 210" role="img" aria-label="打开的书和积木">
            <rect x="36" y="66" width="128" height="104" rx="10" fill="#fffaf0" stroke="#bcae97" stroke-width="4"/>
            <rect x="196" y="66" width="128" height="104" rx="10" fill="#fffaf0" stroke="#bcae97" stroke-width="4"/>
            <path d="M164 72 C176 86 184 86 196 72 L196 174 C184 164 176 164 164 174 Z" fill="#eadfcb"/>
            <line x1="64" y1="94" x2="136" y2="94" stroke="#3f73b8" stroke-width="8" stroke-linecap="round"/>
            <line x1="64" y1="120" x2="122" y2="120" stroke="#5b8c45" stroke-width="8" stroke-linecap="round"/>
            <line x1="224" y1="94" x2="292" y2="94" stroke="#d89b36" stroke-width="8" stroke-linecap="round"/>
            <line x1="224" y1="120" x2="276" y2="120" stroke="#c95b4b" stroke-width="8" stroke-linecap="round"/>
            <rect x="54" y="28" width="46" height="28" rx="5" fill="#1f8a8a"/>
            <rect x="104" y="28" width="46" height="28" rx="5" fill="#d89b36"/>
            <rect x="154" y="28" width="46" height="28" rx="5" fill="#c95b4b"/>
            <rect x="204" y="28" width="46" height="28" rx="5" fill="#3f73b8"/>
            <rect x="254" y="28" width="46" height="28" rx="5" fill="#7965a8"/>
          </svg>
          <div class="scroll source-status">
            <span class="level-tag" id="levelTag">等待选题</span>
            <strong id="articleTitle">尚未开始</strong>
            <span class="small" id="sourceStatus">选择难度后，将随机抽取一篇文章。</span>
          </div>
          <p class="small">提示：文章进入关卡后会自动收起。需要时打开原文卷轴，回看和调整也是阅读策略的一部分。</p>
          <div class="actions">
            <button class="btn secondary" id="reviewBtn" type="button" disabled>打开原文卷轴</button>
          </div>
        </aside>
        <section class="stage" id="stageRoot"></section>
      </div>
    </section>
  </main>

  <div class="modal" id="sourceModal" role="dialog" aria-modal="true" aria-labelledby="sourceModalTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="sourceModalTitle">原文卷轴</h2>
        <button class="icon-btn" id="closeSourceBtn" type="button" aria-label="关闭原文">×</button>
      </div>
      <div class="modal-body" id="sourceModalBody"></div>
    </div>
  </div>

  <script>
    const LEVELS = {
      1: { name: "基础", color: "#5b8c45" },
      2: { name: "进阶", color: "#1f8a8a" },
      3: { name: "挑战", color: "#3f73b8" },
      4: { name: "深度", color: "#7965a8" },
      5: { name: "高阶", color: "#c95b4b" }
    };

    function A(level, title, causes, evidence, conclusions, keywords, details, summary, links, need, over) {
      return { level, title, causes, evidence, conclusions, keywords, details, summary, links, need, over, source: [...causes, ...evidence, ...conclusions].join("") };
    }

    const articles = [
      A(1,"校园菜园",
        ["四年级的菜园里，靠墙的生菜长得比中间慢。","同学们发现，墙边上午几乎照不到太阳。"],
        ["他们连续五天记录光照时间和叶片大小。","把花盆移到亮处后，新叶明显变宽。"],
        ["大家判断，光照不足是生长缓慢的重要原因。","他们决定先观察环境，再调整花盆位置。"],
        ["生菜","光照","记录","叶片","移动","调整"],["四年级","靠墙","五天","花盆","上午","新叶"],
        ["生菜生长改善","依靠记录光照并调整位置","改变方法前要先观察条件"],
        [["光照时间","环境条件"],["叶片大小","生长证据"],["移动花盆","针对性调整"],["连续记录","比较变化"]],
        "所有长得慢的植物都是缺少阳光","只要把植物搬到亮处就一定长得最好"),
      A(1,"安静的图书角",
        ["午休时，教室图书角总有人找不到刚还回来的书。","原来同学们只把书放回书架，却没有按类别归位。"],
        ["值日生给书架贴上故事、科学和历史标签。","一周后，寻找一本书的平均时间明显缩短。"],
        ["分类标签帮助大家更快找到图书。","班级决定每周检查一次书架并补充标签。"],
        ["图书角","分类","标签","寻找时间","检查","归位"],["午休","值日生","一周","故事书","书架","班级"],
        ["图书查找变快","依靠分类标签和定期整理","信息有结构才容易调用"],
        [["类别标签","建立索引"],["寻找时间","检验效率"],["每周检查","持续回顾"],["图书归位","保持秩序"]],
        "标签是否适合所有年龄的读者还需要观察","贴了标签以后任何书都不会丢失"),
      A(1,"纸飞机比赛",
        ["小杰的纸飞机总是飞不远。","他发现机头折得太厚，飞机一出手就向下掉。"],
        ["他只改变机头厚度，每次都从同一条线起飞。","较薄的机头连续三次飞得更远。"],
        ["控制其他条件后，机头厚度可能影响飞行距离。","小杰准备继续测试不同的机翼宽度。"],
        ["纸飞机","机头","厚度","同一起点","飞行距离","测试"],["小杰","三次","机翼","比赛","折纸","地面"],
        ["纸飞机飞得更远","依靠一次只改变一个条件","比较实验要控制其他变量"],
        [["同一起点","控制条件"],["三次飞行","重复验证"],["机头厚度","测试变量"],["飞行距离","观察结果"]],
        "机翼宽度是否也有影响需要继续测试","所有纸飞机都应该使用最薄的机头"),
      A(1,"小猫喝水",
        ["家里的小猫最近喝水变少。","水碗放在食盆旁边，常被食物碎屑弄脏。"],
        ["家人把两个相同水碗放在不同位置。","三天里，小猫更多地使用安静角落里的水碗。"],
        ["水碗的位置和清洁程度可能影响小猫饮水。","家人决定每天换水，并保留安静处的水碗。"],
        ["小猫","饮水","水碗位置","清洁","比较","换水"],["三天","食盆","角落","碎屑","家人","两个水碗"],
        ["小猫饮水增加","依靠比较位置并保持清洁","行为变化要结合环境来理解"],
        [["两个水碗","形成比较"],["饮水次数","行为证据"],["安静角落","环境条件"],["每天换水","持续维护"]],
        "小猫更喜欢安静角落的原因还需要更多观察","所有猫都不愿意在食盆附近喝水"),

    function shuffled(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;

        <div class="difficulty-picker">
          <button class="difficulty selected" data-level="0" type="button"><strong>自适应</strong><br><span class="small">随机 1-5 级</span></button>
          ${Object.entries(LEVELS).map(([level,meta])=>`<button class="difficulty" data-level="${level}" type="button"><strong>${level}级 ${meta.name}</strong><br><span class="small">题库 10 篇</span></button>`).join("")}
        </div>
        <div class="scroll">
          <h2>游戏流程</h2>
          <p>先完整阅读一篇文章。进入关卡后原文会收起，需要时可通过左侧按钮打开独立卷轴回看。</p>
        </div>
        <div class="actions"><button class="btn" type="button" id="drawBtn">随机抽取文章</button></div>
      `;
      root.querySelectorAll(".difficulty").forEach(button => {
        button.addEventListener("click", () => {
          state.selectedLevel = Number(button.dataset.level);
          root.querySelectorAll(".difficulty").forEach(item => item.classList.remove("selected"));
          button.classList.add("selected");
        });
      });
      document.getElementById("drawBtn").addEventListener("click", drawArticle);
    }

    function drawArticle() {
      const pool = state.selectedLevel ? articles.filter(item => item.level === state.selectedLevel) : articles;
      let lastId = "";
      try { lastId = localStorage.getItem("reading-game-last-article") || ""; } catch (error) {}
      const choices = pool.filter(item => item.id !== lastId);
      state.article = (choices.length ? choices : pool)[Math.floor(Math.random() * (choices.length || pool.length))];
      state.stages = buildStages(state.article);
      try { localStorage.setItem("reading-game-last-article", state.article.id); } catch (error) {}
      state.phase = "reading";
      state.startTime = Date.now();
      clearInterval(state.timerId);
      state.timerId = setInterval(updateTimer, 1000);
      reviewBtn.disabled = false;
      updateArticleMeta("文章正在阅读，进入关卡后将自动收起。");
      renderReading();
    }

    function renderReading() {
      const a = state.article;
      root.innerHTML = `
        <div class="stage-title">
          <div class="stage-num">${a.level}</div>
          <div><h2>${a.title}</h2><p>${LEVELS[a.level].name}难度 · 请先完整阅读，不必死记每个字。</p></div>
        </div>
        <article class="reading-sheet"><h3>${a.title}</h3><p>${a.source}</p></article>
        <div class="actions">
          <button class="btn" id="challengeBtn" type="button">我读完了，收起原文</button>
          <button class="btn secondary" id="changeBtn" type="button">换一篇</button>
        </div>
      `;
      document.getElementById("challengeBtn").addEventListener("click", () => {
        state.phase = "challenge";
        goStage(0);
      });
      document.getElementById("changeBtn").addEventListener("click", drawArticle);
    }

    function updateArticleMeta(status) {
      const a = state.article;
      if (!a) return;
      levelTag.textContent = `${a.level}级 ${LEVELS[a.level].name}`;
      levelTag.style.background = LEVELS[a.level].color;
      articleTitle.textContent = a.title;
      sourceStatus.textContent = status;
      sourceModalTitle.textContent = `${a.title} · 原文卷轴`;
      sourceModalBody.innerHTML = `<p>${a.source}</p>`;
    }

    function openSource() {
      if (!state.article) return;
      sourceModal.classList.add("open");
      if (state.phase === "challenge" && state.stageIndex >= 0) {
        state.reviewedStages.add(state.stageIndex);
      }
    }

    function closeSource() {
      sourceModal.classList.remove("open");
    }

    reviewBtn.addEventListener("click", openSource);
    closeSourceBtn.addEventListener("click", closeSource);
    sourceModal.addEventListener("click", event => { if (event.target === sourceModal) closeSource(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closeSource(); });

    function updateTimer() {
      if (!state.startTime) return;
      const sec = Math.floor((Date.now() - state.startTime) / 1000);
      timer.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
    }

    function resetInteraction() {
      state.selectedId = null; state.placements = {}; state.selectedChips = new Set();
      state.compose = {}; state.matches = {}; state.matchLeft = null; state.checked = false;
    }

    function goStage(index) {
      resetInteraction();
      state.stageIndex = index;
      stageBadge.textContent = `${Math.min(index + 1, state.stages.length)}/${state.stages.length}`;
      progressBar.style.width = `${Math.round((index / state.stages.length) * 100)}%`;
      updateArticleMeta(`原文已收起 · 当前第 ${Math.min(index + 1, 5)} 关`);
      const stage = state.stages[index];
      if (!stage) return renderConfidence();
      if (stage.type === "classify") renderClassify(stage);
      if (stage.type === "select") renderSelect(stage);
      if (stage.type === "compose") renderCompose(stage);
      if (stage.type === "match") renderMatch(stage);
    }

    function header(stage) {
      return `<div class="stage-title"><div class="stage-num">${state.stageIndex+1}</div><div><h2>${stage.title}</h2><p>${stage.intro}</p></div></div>`;
    }

    function actionHtml() {
      return `<div class="actions"><button class="btn" id="checkBtn" type="button">检查这一关</button><button class="btn store hidden" id="storeBtn" type="button">收入概念宝库</button><button class="btn secondary hidden" id="nextBtn" type="button">下一关</button></div><div class="feedback" id="feedback"></div>`;
    }

    function renderClassify(stage) {
      root.innerHTML = `${header(stage)}
        <div class="grid cards">${stage.cards.map(card=>`<div class="card" draggable="true" data-card="${card.id}">${card.text}</div>`).join("")}</div>
        <div class="grid bins">${stage.bins.map(bin=>`<div class="bin" data-bin="${bin.id}"><h3>${bin.title}</h3><div class="bin-list"></div></div>`).join("")}</div>${actionHtml()}`;
      root.querySelectorAll(".card").forEach(card => {
        card.addEventListener("dragstart", event => event.dataTransfer.setData("text/plain", card.dataset.card));
        card.addEventListener("click", () => selectCard(card));
      });
      root.querySelectorAll(".bin").forEach(bin => {
        bin.addEventListener("dragover", event => event.preventDefault());
        bin.addEventListener("drop", event => placeCard(event.dataTransfer.getData("text/plain"),bin.dataset.bin,stage));
        bin.addEventListener("click", () => { if(state.selectedId) placeCard(state.selectedId,bin.dataset.bin,stage); });
      });
      wireActions(stage,()=>checkClassify(stage));
    }

    function selectCard(card) {
      root.querySelectorAll(".card").forEach(item=>item.classList.remove("selected"));
      state.selectedId=card.dataset.card; card.classList.add("selected");
    }

    function placeCard(cardId,binId,stage) {
      if(!cardId||state.checked)return;
      state.placements[cardId]=binId; state.selectedId=null;
      const card=root.querySelector(`[data-card="${cardId}"]`);
      if(card){card.classList.remove("selected");card.classList.add("placed");}
      root.querySelectorAll(".bin-list").forEach(list=>list.innerHTML="");
      stage.cards.forEach(item=>{
        const target=state.placements[item.id];
        if(target) root.querySelector(`[data-bin="${target}"] .bin-list`).insertAdjacentHTML("beforeend",`<div class="mini-card">${item.text}</div>`);
      });
    }

    function renderSelect(stage) {
      root.innerHTML=`${header(stage)}<div class="grid chips">${stage.chips.map(chip=>`<div class="chip" data-chip="${chip.id}">${chip.text}</div>`).join("")}</div>${actionHtml()}`;
      root.querySelectorAll(".chip").forEach(chip=>chip.addEventListener("click",()=>{
        if(state.checked)return;
        const id=chip.dataset.chip;
        if(state.selectedChips.has(id)){state.selectedChips.delete(id);chip.classList.remove("selected");}
        else if(state.selectedChips.size<stage.limit){state.selectedChips.add(id);chip.classList.add("selected");}
        else showFeedback(`最多选择 ${stage.limit} 个概念。`);
      }));
      wireActions(stage,()=>checkSelect(stage));
    }

    function renderCompose(stage) {
      root.innerHTML=`${header(stage)}<div class="grid compose">${stage.columns.map(col=>`<div class="compose-col"><h3>${col.title}</h3>${col.options.map(option=>`<div class="option" data-col="${col.id}" data-option="${option.id}">${option.text}</div>`).join("")}</div>`).join("")}</div><div class="sentence-preview" id="sentencePreview">请选择三块积木，拼出一句中心意思。</div>${actionHtml()}`;
      root.querySelectorAll(".option").forEach(option=>option.addEventListener("click",()=>{
        if(state.checked)return;
        state.compose[option.dataset.col]=option.dataset.option;
        root.querySelectorAll(`.option[data-col="${option.dataset.col}"]`).forEach(item=>item.classList.remove("selected"));
        option.classList.add("selected"); updateSentence(stage);
      }));
      wireActions(stage,()=>checkCompose(stage));
    }

    function updateSentence(stage) {
      const pieces=stage.columns.map(col=>{
        const option=col.options.find(item=>item.id===state.compose[col.id]);
        return option?option.text:"____";
      });
      document.getElementById("sentencePreview").textContent=`${pieces[0]}，${pieces[1]}，所以${pieces[2]}。`;
    }

    function renderMatch(stage) {
      root.innerHTML=`${header(stage)}<div class="grid match"><div class="match-col">${stage.left.map(item=>`<div class="match-node" data-left="${item.id}">${item.text}</div>`).join("")}</div><div class="match-col">${stage.right.map(item=>`<div class="match-node" data-right="${item.id}">${item.text}</div>`).join("")}</div></div><div class="pairs" id="pairs"></div>${actionHtml()}`;
      root.querySelectorAll("[data-left]").forEach(node=>node.addEventListener("click",()=>{
        if(state.checked||node.classList.contains("done"))return;
        state.matchLeft=node.dataset.left;
        root.querySelectorAll("[data-left]").forEach(item=>item.classList.remove("selected"));
        node.classList.add("selected");
      }));
      root.querySelectorAll("[data-right]").forEach(node=>node.addEventListener("click",()=>{
        if(state.checked||!state.matchLeft)return;
        state.matches[state.matchLeft]=node.dataset.right;
        const left=root.querySelector(`[data-left="${state.matchLeft}"]`);
        left.classList.add("done");left.classList.remove("selected");state.matchLeft=null;renderPairs(stage);
      }));
      wireActions(stage,()=>checkMatch(stage));
    }

    function renderPairs(stage) {
      document.getElementById("pairs").innerHTML=Object.entries(state.matches).map(([leftId,rightId])=>{
        const left=stage.left.find(item=>item.id===leftId).text;
        const right=stage.right.find(item=>item.id===rightId).text;
        return `<div class="pair-line">${left} → ${right}</div>`;
      }).join("");
    }

    function wireActions(stage,checker) {
      document.getElementById("checkBtn").addEventListener("click",checker);
      document.getElementById("storeBtn").addEventListener("click",()=>{
        state.vault+=1;vaultCount.textContent=state.vault;addAbility("habit",2,2);
        document.getElementById("storeBtn").disabled=true;
      });
      document.getElementById("nextBtn").addEventListener("click",()=>goStage(state.stageIndex+1));
    }

    function finishStage(stage,ratio,detail) {
      state.checked=true;addStageWeights(stage.weights,ratio);state.stageScores.push(ratio);
      const feedback=document.getElementById("feedback");
      feedback.classList.add("show");
      feedback.innerHTML=`<strong>本关命中率：${Math.round(ratio*100)}%</strong><br>${detail}<br>${stage.feedback}`;
      document.getElementById("checkBtn").disabled=true;
      document.getElementById("storeBtn").classList.remove("hidden");
      document.getElementById("nextBtn").classList.remove("hidden");
      progressBar.style.width=`${Math.round(((state.stageIndex+1)/state.stages.length)*100)}%`;
    }

    function checkClassify(stage) {
      if(Object.keys(state.placements).length<stage.cards.length)return showFeedback(`还差 ${stage.cards.length-Object.keys(state.placements).length} 张卡没有归位。`);
      const correct=stage.cards.filter(card=>state.placements[card.id]===card.answer).length;
      finishStage(stage,correct/stage.cards.length,`你正确放置了 ${correct}/${stage.cards.length} 张信息卡。`);
    }

    function checkSelect(stage) {
      if(state.selectedChips.size<stage.limit)return showFeedback(`请点亮 ${stage.limit} 个概念积木。`);
      const correct=[...state.selectedChips].filter(id=>stage.chips.find(chip=>chip.id===id).correct).length;
      const wrong=stage.limit-correct;
      finishStage(stage,Math.max(0,(correct-wrong*.6)/stage.limit),`你选中 ${correct} 个核心概念，混入 ${wrong} 个表面细节。`);
    }

    function checkCompose(stage) {
      if(Object.keys(state.compose).length<stage.columns.length)return showFeedback("三列都要选择一块。");
      const correct=stage.columns.filter(col=>col.options.find(item=>item.id===state.compose[col.id])?.correct).length;
      finishStage(stage,correct/stage.columns.length,`中心句有 ${correct}/${stage.columns.length} 个关键部件准确。`);
    }

    function checkMatch(stage) {
      if(Object.keys(state.matches).length<stage.left.length)return showFeedback("还没有把所有原子信息连起来。");
      const correct=stage.left.filter(item=>state.matches[item.id]===item.pair).length;
      finishStage(stage,correct/stage.left.length,`你建立了 ${correct}/${stage.left.length} 条有效链接。`);
    }

    function renderConfidence() {
      state.phase="calibration";
      updateArticleMeta("五关已完成 · 正在进行信心校准");
      stageBadge.textContent="5/5";progressBar.style.width="100%";
      root.innerHTML=`
        <div class="stage-title"><div class="stage-num">校</div><div><h2>信心罗盘</h2><p>先判断自己这轮大约能得多少分。完成选择后，诊断入口才会解锁。</p></div></div>
        <div class="confidence">${[20,40,60,80,100].map(value=>`<div class="stone" data-confidence="${value}"><div><strong>${value}</strong>分左右</div></div>`).join("")}</div>
        <div class="unlock-note" id="unlockNote">请选择一块信心石。诊断按钮尚未解锁。</div>
        <div class="actions" id="resultAction"></div>`;
      root.querySelectorAll(".stone").forEach(stone=>stone.addEventListener("click",()=>{
        state.confidence=Number(stone.dataset.confidence);
        root.querySelectorAll(".stone").forEach(item=>item.classList.remove("selected"));
        stone.classList.add("selected");
        document.getElementById("unlockNote").textContent="信心校准已记录，现在可以查看诊断结果。";
        document.getElementById("resultAction").innerHTML='<button class="btn" id="resultBtn" type="button">完成校准，查看诊断</button>';
        document.getElementById("resultBtn").addEventListener("click",renderResult);
      }));
    }

    function addStageWeights(weights,ratio){Object.entries(weights).forEach(([key,max])=>addAbility(key,max*ratio,max));}
    function addAbility(key,score,max){state.scores[key].score+=score;state.scores[key].max+=max;}
    function showFeedback(text){const box=document.getElementById("feedback");box.classList.add("show");box.textContent=text;}

    function updateFinalAbilities() {
      const avg=state.stageScores.reduce((sum,item)=>sum+item,0)/Math.max(1,state.stageScores.length);
      const elapsed=Math.floor((Date.now()-state.startTime)/1000);
      const expected={1:300,2:360,3:420,4:480,5:540}[state.article.level];
      const pace=elapsed<=expected?1:Math.max(.4,1-(elapsed-expected)/expected);
      addAbility("stamina",(avg*.65+pace*.35)*12,12);
      const gap=Math.abs((state.confidence||60)-Math.round(avg*100));
      addAbility("strategy",Math.max(0,1-gap/80)*12,12);
      addAbility("strategy",Math.min(1,state.reviewedStages.size/2)*4,4);
      addAbility("habit",Math.min(1,state.vault/3)*6,6);
    }

    function renderResult() {
      clearInterval(state.timerId);state.phase="result";updateFinalAbilities();
      const abilities=Object.entries(state.scores).map(([key,data])=>({key,pct:data.max?Math.round(data.score/data.max*100):0}));
      const total=Math.round(abilities.reduce((sum,item)=>sum+item.pct,0)/abilities.length);
      const top=[...abilities].sort((a,b)=>b.pct-a.pct).slice(0,2);
      const weak=[...abilities].sort((a,b)=>a.pct-b.pct).slice(0,3);
      root.innerHTML=`
        <div class="result">
          <div class="score-card"><span class="level-tag" style="background:${LEVELS[state.article.level].color}">${state.article.level}级 ${LEVELS[state.article.level].name}</span><h2>阅读能力轮廓</h2><div class="big-score">${total}</div><p class="small">基于《${state.article.title}》的一次快速观察，不等同于正式测评。</p><p><strong>优势：</strong>${top.map(item=>abilityNames[item.key]).join("、")}</p><p><strong>优先训练：</strong>${weak.map(item=>abilityNames[item.key]).join("、")}</p></div>
          <div class="ability-list"><h2>10 项阅读能力</h2>${abilities.map(item=>`<div class="ability"><span>${abilityNames[item.key]}</span><div class="bar"><span style="width:${item.pct}%"></span></div><strong>${item.pct}</strong></div>`).join("")}</div>
        </div>
        <div class="advice" style="margin-top:18px"><h2>下一步训练建议</h2><div class="tips">${weak.map(item=>`<div class="tip"><strong>${abilityNames[item.key]}</strong><br>${makeTip(item.key)}</div>`).join("")}</div></div>
        <div class="actions"><button class="btn" id="restartBtn" type="button">再抽一篇</button></div>`;
      document.getElementById("restartBtn").addEventListener("click",resetGame);
    }

    function makeTip(key) {
      return {
        decode:"用短文做快速扫读，圈出人物、动作、条件和结果，先稳定识别再提高速度。",
        vocab:"每段只保留三到五个概念词，并解释它们在当前语境中的具体含义。",
        syntax:"给句段贴上背景、原因、证据、转折、结论等结构标签。",
        extraction:"每段只问一句：最值得留下并能帮助复述的积木是什么？",
        inference:"把两条分散信息连成“因为……所以……”，再检查是否超出证据。",
        background:"为新概念寻找一个生活实例和一个已知概念，建立双向链接。",
        critical:"看到“一定、所有、只要”时停一下，检查样本、条件和证据边界。",
        strategy:"读不懂时回看原文，重新分块，再比较自己的信心与实际表现。",
        stamina:"采用短时多轮：五分钟阅读、一分钟复述、一分钟休息，逐步增加难度。",
        habit:"每次阅读只存一条原子笔记，并给它一个标签、一个链接和一次回顾。"
      }[key];
    }

    function resetGame() {
      clearInterval(state.timerId);
      Object.assign(state,{article:null,stages:[],stageIndex:-1,phase:"setup",startTime:0,timerId:null,selectedId:null,placements:{},selectedChips:new Set(),compose:{},matches:{},matchLeft:null,checked:false,reviewedStages:new Set(),vault:0,stageScores:[],confidence:null,scores:Object.fromEntries(Object.keys(abilityNames).map(key=>[key,{score:0,max:0}]))});
      timer.textContent="00:00";vaultCount.textContent="0";stageBadge.textContent="0/5";progressBar.style.width="0%";
      reviewBtn.disabled=true;levelTag.textContent="等待选题";levelTag.style.background="var(--blue)";articleTitle.textContent="尚未开始";sourceStatus.textContent="选择难度后，将随机抽取一篇文章。";
      renderSetup();
    }

    renderSetup();
  </script>
</body>
</html>
