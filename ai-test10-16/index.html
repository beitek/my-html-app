<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {

  .pre-line { display:flex; align-items:center; justify-content:center; gap:10px; font-size:12px; letter-spacing:3px; color:#9b97bd; margin-bottom:12px; }
  .pre-line::before,.pre-line::after { content:""; width:30px; height:1px; background:linear-gradient(90deg,transparent,#7f5af0); }
  .pre-line::after { background:linear-gradient(90deg,#7f5af0,transparent); }
  .main-title {
    font-size:34px; font-weight:900; line-height:1.25; letter-spacing:1px;
    background:linear-gradient(120deg,#f093fb 0%,#7f5af0 40%,#2cb1bc 100%);

    text-shadow:0 0 40px rgba(127,90,240,0.3);

  }

  .title-deco { font-size:24px; }

  .orb1 { width:120px; height:120px; background:#7f5af0; top:-20px; left:-10px; }
  .orb2 { width:100px; height:100px; background:#2cb1bc; top:0; right:-10px; }

  .hook { font-size:21px; line-height:1.5; margin:22px 0 14px; font-weight:800; text-align:center; }
  .hook .hl { background:linear-gradient(90deg,#f093fb,#f5576c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:15px; color:#bcb8d8; margin-bottom:8px; text-align:center; }
  .meta { display:flex; gap:16px; margin:22px 0; font-size:13px; color:#9b97bd; flex-wrap:wrap; justify-content:center; }
  .meta span { display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#2cb1bc; }
  .notice { font-size:13px; color:#9b97bd; background:rgba(255,255,255,0.04); border-left:3px solid #7f5af0; padding:10px 14px; border-radius:0 10px 10px 0; margin:6px 0 4px; }

  .btn {
    width:100%; border:none; cursor:pointer; font-family:inherit;
    background:linear-gradient(90deg,#7f5af0,#f5576c); color:#fff;
    font-size:17px; font-weight:700; padding:16px; border-radius:16px;

  .btn:active { transform:scale(0.97); }
  .btn.ghost { background:rgba(255,255,255,0.08); box-shadow:none; font-size:15px; padding:13px; }
  .btn.save { background:linear-gradient(90deg,#2cb1bc,#7f5af0); }

  .progress-wrap { margin-bottom:18px; }
  .progress-top { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#9b97bd; margin-bottom:8px; }
  .lvl-tag { font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .bar { height:8px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; }
  .fill { height:100%; background:linear-gradient(90deg,#7f5af0,#2cb1bc); border-radius:10px; transition:width .4s ease; }

  .scenario-tag { font-size:12px; color:#2cb1bc; font-weight:700; letter-spacing:1px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .stars { letter-spacing:2px; color:#f9d423; font-size:13px; }

  .options { display:flex; flex-direction:column; gap:11px; }
  .opt {
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1);
    border-radius:14px; padding:14px 15px; cursor:pointer; font-size:15px;
    transition:all .18s; display:flex; align-items:flex-start; gap:11px;
  }
  .opt:active { transform:scale(0.98); }
  .opt:hover { border-color:rgba(127,90,240,0.6); background:rgba(127,90,240,0.12); }
  .opt.sel { border-color:#7f5af0; background:rgba(127,90,240,0.22); }
  .opt-key {
    flex-shrink:0; width:26px; height:26px; border-radius:8px;
    background:rgba(255,255,255,0.1); display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:14px;
  }
  .opt.sel .opt-key { background:#7f5af0; }

  .result-emoji { font-size:60px; text-align:center; margin-bottom:6px; }
  .result-type { text-align:center; font-size:13px; color:#9b97bd; letter-spacing:2px; }
  .result-title { text-align:center; font-size:26px; font-weight:800; margin:6px 0 16px; }
  .score-ring { display:flex; justify-content:center; margin:18px 0; }
  .score-num { font-size:46px; font-weight:800; line-height:1; }
  .score-num small { font-size:18px; color:#9b97bd; }
  .level-bar { margin:18px 0; }
  .level-track { height:14px; border-radius:10px; background:linear-gradient(90deg,#f5576c 0%,#f9d423 50%,#2cb1bc 100%); position:relative; }
  .level-marker { position:absolute; top:-6px; width:4px; height:26px; background:#fff; border-radius:3px; box-shadow:0 0 8px rgba(255,255,255,0.8); transition:left .6s ease; }
  .level-labels { display:flex; justify-content:space-between; font-size:11px; color:#9b97bd; margin-top:8px; }

  .card {
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:18px; margin:14px 0;
  }
  .card h3 { font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .card p { font-size:14px; color:#cfcce4; margin-bottom:6px; }
  .tip-item { font-size:14px; color:#cfcce4; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.08); display:flex; gap:10px; }
  .tip-item:last-child { border:none; }
  .tip-item .ico { flex-shrink:0; }
  .section-divider { text-align:center; margin:26px 0 6px; font-size:12px; letter-spacing:4px; color:#9b97bd; }

  .radar-wrap { display:flex; flex-direction:column; align-items:center; }
  .radar-svg { width:100%; max-width:340px; height:auto; display:block; }
  .radar-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; margin-top:6px; }
  .radar-legend span { font-size:12px; color:#cfcce4; display:flex; align-items:center; gap:5px; }
  .lg-dot { width:8px; height:8px; border-radius:50%; }
  .radar-poly { animation:radarIn 1s ease forwards; transform-origin:center; }
  @keyframes radarIn { from{opacity:0;transform:scale(0.2);} to{opacity:1;transform:scale(1);} }

  .quote { font-size:13px; color:#9b97bd; text-align:center; margin-top:20px; font-style:italic; line-height:1.7; }
  .hidden { display:none; }

  /* 推荐资源二维码 —— 二维码居右，整行高度≈按钮高度 */
  .qr-list { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .qr-item {
    display:flex; flex-direction:row-reverse; align-items:center; gap:10px;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:12px; padding:6px 12px;
  }
  .qr-item img {
    width:40px; height:40px; flex-shrink:0; border-radius:6px;
    background:#fff; padding:3px; object-fit:contain; display:block;
  }
  .qr-item .qr-text { flex:1; min-width:0; text-align:left; }
  .qr-item .qr-text b { font-size:13px; color:#fff; font-weight:700; display:block; line-height:1.3; }
  .qr-item .qr-text small { font-size:10px; color:#9b97bd; }

  /* 图片保存模态 */
  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:18px;
    animation:fade .3s ease;
  }
  .modal-box {
    width:100%; max-width:420px; max-height:90vh; overflow:auto;
    background:#1a1730; border:1px solid rgba(255,255,255,0.12);
    border-radius:18px; padding:18px; text-align:center;
  }
  .modal-box h3 { font-size:17px; margin-bottom:6px; }
  .modal-box .hint { font-size:13px; color:#9b97bd; margin-bottom:12px; line-height:1.6; }
  .modal-box img { width:100%; border-radius:12px; border:1px solid rgba(255,255,255,0.1); display:block; }
  .spinner {
    width:38px; height:38px; border:4px solid rgba(255,255,255,0.15);
    border-top-color:#7f5af0; border-radius:50%; margin:20px auto;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 封面 -->
  <div class="screen" id="cover">
    <div class="cover-head">
      <span class="glow-orb orb1"></span>
      <span class="glow-orb orb2"></span>
      <div class="crown">🎓</div>
      <div class="pre-line">AI 时代 · 学习力测评</div>
      <h1 class="main-title">
        中小学生 <span class="title-deco">AI</span><br>
        <span class="title-line2">学习力自我评测</span>
      </h1>
      <div class="title-underline"></div>
    </div>

    <p class="hook">用 AI 的时候，你是<span class="hl">在思考</span>，还是<span class="hl">让它替你思考</span>？</p>
    <p class="sub">真正的高手，用 AI 越用脑子越灵；</p>
    <p class="sub">而有些人，正在不知不觉地把"思考"外包出去。</p>
    <div class="meta">
      <span><i class="dot"></i>适合 10–18 岁</span>
      <span><i class="dot"></i>每次随机 20 题</span>
      <span><i class="dot"></i>约 6 分钟</span>
    </div>
    <button class="btn" onclick="start('student')">学生开始挑战 →</button>
    <button class="btn ghost" onclick="start('parent')">我是家长 · 做家长评估 →</button>
  </div>

  <!-- 答题 -->
  <div class="screen hidden" id="quiz">
    <div class="progress-wrap">
      <div class="progress-top">
        <span id="qcount">第 1 / 20 题</span>
        <span class="lvl-tag" id="lvltag">Lv.1 热身</span>
      </div>
      <div class="bar"><div class="fill" id="fill" style="width:5%"></div></div>
    </div>
    <div class="scenario-tag"><span id="stag">情景</span><span class="stars" id="stars">★☆☆☆☆</span></div>
    <div class="question" id="qtext"></div>
    <div class="options" id="opts"></div>
    <button class="btn ghost hidden" id="backBtn" onclick="goBack()">← 上一题</button>
  </div>

  <!-- 结果 -->
  <div class="screen hidden" id="result"></div>

</div>

<!-- 图片保存模态（内联 display:none，开机绝不弹出） -->
<div class="modal-mask" id="imgModal" style="display:none">
  <div class="modal-box">
    <h3>📸 报告图片已生成</h3>
    <p class="hint" id="modalHint">电脑端点下方「下载图片」即可保存；<br>手机端请<b style="color:#f9d423">长按下方图片</b>保存到相册。</p>
    <div id="modalBody"><div class="spinner"></div></div>
    <a class="btn save" id="dlLink" download="AI学习力评测报告.png" style="display:none">⬇ 下载图片</a>
    <button class="btn ghost" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
/* ===================== 配置 ===================== */
const LVL=["","Lv.1 热身","Lv.2 进阶","Lv.3 烧脑","Lv.4 高手","Lv.5 终极"];
const LVLC=["","#2cb1bc","#2cb1bc","#7f5af0","#f5576c","#f5576c"];

const DEFAULT_SUBS = ["数学","语文","英语","物理","化学","生物","历史","地理","科学","道德与法治"];
const CREATIVE_SUBS = ["作文","英语作文","美术作品","手抄报","科学小报","历史小报","板报设计","演讲稿","主题绘画","班会创意"];

const TEMPLATES = [
{lvl:1,d:"T",tag:"查资料",q:s=>`你要做一份关于「${s}」某主题的小报告，AI 给了一段看起来很完整的解释。接下来你最该做的是？`,o:[
  {t:"读着挺顺，直接挑重点复制进我的报告里",s:0},
  {t:"让它换个说法再生成一遍，读起来更像我自己写的口吻",s:1},
  {t:"先把我讲不清的地方弄懂，能说明白再用",s:3},
  {t:"再让它多补充一些，内容越丰富报告越厚实",s:1}]},
{lvl:1,d:"Q",tag:"怎么问",q:s=>`想真正学会「${s}」里一个总也记不住的知识点，下面哪种问法最有用？`,o:[
  {t:"「这个知识点到底是什么意思呀？」",s:1},
  {t:"「直接告诉我考试时一般会怎么考它」",s:1},
  {t:"「我以为它是这样，错在哪？」",s:3},
  {t:"「用最简短的一句话帮我讲一遍」",s:2}]},
{lvl:1,d:"B",tag:"它给的对吗",q:s=>`AI 帮你解答了一道「${s}」的题，答得很肯定。你的第一反应应该是？`,o:[
  {t:"它这么肯定肯定没错，记下来就好",s:0},
  {t:"随手把关键那一步验证一下对不对",s:3},
  {t:"让它把答案讲得再详细些，越详细越可信",s:1},
  {t:"先抄下来，等老师讲评时再慢慢核对",s:1}]},
{lvl:1,d:"X",tag:"做作品",q:s=>`「${s}」要交一个小作品，你想用 AI 帮忙。哪种做法最能练到你自己的创造力？`,o:[
  {t:"让它直接做一个最好的，照着抄",s:0},
  {t:"先自己做个粗版，再让它提改进点",s:3},
  {t:"让它一口气做很多个，我从里面挑元素拼起来",s:1},
  {t:"问它怎么做最容易拿高分，照着做",s:1}]},
{lvl:1,d:"M",tag:"要不要用",q:s=>`关于学「${s}」时用不用 AI，下面哪种判断最聪明？`,o:[
  {t:"反正能用，那就用呗，能省事就省事",s:0},
  {t:"先想清楚是想交差还是想真学会",s:3},
  {t:"看别人，别人都用我就用，不用就不用",s:1},
  {t:"题难就用，题简单就自己做",s:1}]},
{lvl:1,d:"T",tag:"抄答案",q:s=>`「${s}」作业里有一道题你不会，AI 一下给出了完整答案。最好的做法是？`,o:[
  {t:"照抄上去，先把作业交了再说",s:0},
  {t:"抄下来，顺便把它的步骤背熟",s:1},
  {t:"盖住答案自己先做，卡住再对照",s:3},
  {t:"让它再出一道同类题，我抄第二遍练熟",s:1}]},
{lvl:2,d:"B",tag:"它很自信",q:s=>`你查一个关于「${s}」的具体数据，AI 答得非常肯定还补了一堆细节，但和你印象里的不太一样。你会？`,o:[
  {t:"它知道得比我多，应该是我记错了",s:0},
  {t:"它说得这么细致，细节这么多就肯定靠谱，信它",s:1},
  {t:"印象不同，去权威资料核对一下",s:3},
  {t:"让它自己再确认一遍，它说没错就行",s:1}]},
{lvl:2,d:"Q",tag:"追问",q:s=>`AI 给了你一套学「${s}」的方法，听起来很有道理。一个会动脑的人接下来最该问的是？`,o:[
  {t:"「好，那我现在就照着开始做」",s:0},
  {t:"「它对所有人都管用吗？凭什么说最好？」",s:3},
  {t:"「这是不是网上最流行的那套方法呀？」",s:2},
  {t:"「能不能再多给我几套不同的，我自己挑一个用？」",s:1}]},
{lvl:2,d:"T",tag:"两个答案",q:s=>`同一道「${s}」的题，你问了两个 AI，给出两个不一样的答案，过程都写得头头是道。最靠谱的做法是？`,o:[
  {t:"选那个过程更长、步骤更复杂的，复杂往往说明它更严谨",s:0},
  {t:"两个答案取个折中值，这样比较保险",s:0},
  {t:"自己重做一遍，用我的过程判断",s:3},
  {t:"再开第三个 AI 投票，哪个重复信哪个",s:1}]},
{lvl:2,d:"X",tag:"灵感",q:s=>`做「${s}」相关的创作时卡住了，AI 甩给你一个特别惊艳的点子，比你想的好太多。最能锻炼你的做法是？`,o:[
  {t:"这么好的点子不用可惜，直接拿来用",s:0},
  {t:"被它启发，但合上 AI 自己另想一个",s:3},
  {t:"把它的点子改几个地方，当我原创的",s:1},
  {t:"既然我想不到这水平，干脆全交给它做",s:0}]},
{lvl:2,d:"M",tag:"自检",q:s=>`学完「${s}」一个新内容后，想知道自己是真懂还是假懂，最好的办法是？`,o:[
  {t:"看 AI 夸不夸我答得好",s:0},
  {t:"看我用 AI 之后分数有没有提高",s:1},
  {t:"关掉 AI，试着讲给别人听一遍",s:3},
  {t:"再让 AI 出几道题，对着答案核对",s:1}]},
{lvl:2,d:"B",tag:"它在夸我",q:s=>`你写了一段关于「${s}」的看法，让 AI「帮我看看」，它回复「写得很好，几乎没问题」。你该？`,o:[
  {t:"太好了，那就这么直接交上去",s:0},
  {t:"AI 都夸我了，说明我水平确实不错",s:1},
  {t:"它爱顺着夸人，让它专挑我的毛病",s:3},
  {t:"再换个 AI 问问，看是不是也夸我",s:1}]},
{lvl:3,d:"B",tag:"正反两方",q:s=>`就一个关于「${s}」的争议话题，你让 AI 写了正反两方，都引经据典、看起来都有理。接下来最该做的是？`,o:[
  {t:"两边讲得都有道理，说明这事没标准答案，随便选一边",s:1},
  {t:"哪方举的例子和数据更多就站哪边",s:1},
  {t:"查双方引用的数据真不真，再决定",s:3},

/* ===================== 工具 ===================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildPool(){
  const pool=[];
  TEMPLATES.forEach((tpl,ti)=>{
    const subs = tpl.d==="X" ? CREATIVE_SUBS : DEFAULT_SUBS;
    subs.forEach(s=>{
      pool.push({ tid: ti, lvl: tpl.lvl, d: tpl.d, tag: tpl.tag, q: tpl.q(s),
        o: tpl.o.map(op=>({ t: op.t, s: op.s })) });
    });
  });
  return pool;
}
const POOL = buildPool();

function cloneQ(q){
  const opts = q.o.map(o=>({t:o.t, s:o.s}));
  shuffle(opts);
  return { lvl:q.lvl, d:q.d, tag:q.tag, q:q.q, opts };
}

function sampleTest(){
  const levelDist = {1:3,2:4,3:5,4:4,5:4};
  const picked=[], usedTid=new Set();
  const dimCount={T:0,B:0,X:0,Q:0,M:0};
  for(let lv=1; lv<=5; lv++){
    let need=levelDist[lv];
    const cands=shuffle(POOL.filter(q=>q.lvl===lv));
    while(need>0 && cands.length){
      cands.sort((a,b)=> dimCount[a.d]-dimCount[b.d]);
      let idx=cands.findIndex(q=>!usedTid.has(q.tid));
      if(idx<0) idx=0;
      const q=cands.splice(idx,1)[0];
      usedTid.add(q.tid); dimCount[q.d]++;
      picked.push(cloneQ(q));
      need--;
    }
  }
  return picked;
}

/* ===================== 流程 ===================== */
let state={ mode:"student", list:[], cur:0, answers:[] };
let reportData=null;

function start(mode){
  state.mode=mode;
  state.list = mode==="student" ? sampleTest() : PARENT.map(cloneQ);
  state.cur=0;
  state.answers=new Array(state.list.length).fill(null);
  show("quiz"); render();
}
function show(id){
  ["cover","quiz","result"].forEach(s=>document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function starStr(n){ return "★".repeat(n)+"☆".repeat(5-n); }

function render(){
  const q=state.list[state.cur], N=state.list.length;
  document.getElementById("qtext").textContent=q.q;
  document.getElementById("qcount").textContent=`第 ${state.cur+1} / ${N} 题`;
  document.getElementById("fill").style.width=((state.cur+1)/N*100)+"%";
  document.getElementById("backBtn").classList.toggle("hidden", state.cur===0);

  const lt=document.getElementById("lvltag"), st=document.getElementById("stag"), sr=document.getElementById("stars");
  if(state.mode==="student"){
    lt.textContent=LVL[q.lvl]; lt.style.background=LVLC[q.lvl]+"33"; lt.style.color=LVLC[q.lvl];
    st.textContent="情景 · "+q.tag; sr.textContent=starStr(q.lvl);
  }else{
    lt.textContent="家长评估"; lt.style.background="#7f5af033"; lt.style.color="#a18bff";
    st.textContent="家长 · "+q.tag; sr.textContent="";
  }

  const box=document.getElementById("opts"); box.innerHTML="";
  const keys=["A","B","C","D"];
  q.opts.forEach((op,i)=>{
    const el=document.createElement("div");
    el.className="opt"+(state.answers[state.cur]===i?" sel":"");
    el.innerHTML=`<span class="opt-key">${keys[i]}</span><span>${op.t}</span>`;
    el.onclick=()=>{ state.answers[state.cur]=i; setTimeout(next,220); };
    box.appendChild(el);
  });
}
function next(){ if(state.cur<state.list.length-1){ state.cur++; render(); } else finish(); }
function goBack(){ if(state.cur>0){ state.cur--; render(); } }

function buildRadar(vals, labels, colors){
  const cx=150, cy=150, R=100, n=vals.length;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/n;
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let grid="";
  for(let g=1; g<=4; g++){
    const r=R*g/4;
    grid+=`<polygon points="${vals.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>`;
  }
  let axes="";
  for(let i=0;i<n;i++){ const [x,y]=pt(i,R); axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>`; }
  const dpts=vals.map((v,i)=>pt(i,R*v/100).map(c=>c.toFixed(1)).join(",")).join(" ");
  let dots="", labs="";
  for(let i=0;i<n;i++){
    const [x,y]=pt(i,R*vals[i]/100);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${colors[i]}" stroke="#1a1730" stroke-width="1.5"/>`;
    const [lx,ly]=pt(i,R+22);
    let anchor="middle"; if(lx>cx+5) anchor="start"; else if(lx<cx-5) anchor="end";
    labs+=`<text x="${lx.toFixed(1)}" y="${(ly).toFixed(1)}" font-size="12" fill="#cfcce4" text-anchor="${anchor}">${labels[i]}</text>`;
    labs+=`<text x="${lx.toFixed(1)}" y="${(ly+15).toFixed(1)}" font-size="11" font-weight="700" fill="${colors[i]}" text-anchor="${anchor}">${vals[i]}</text>`;
  }
  return `<svg class="radar-svg" viewBox="-40 -25 380 350" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="radarFill" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2cb1bc" stop-opacity="0.35"/></radialGradient></defs>
    ${grid}${axes}
    <g class="radar-poly"><polygon points="${dpts}" fill="url(#radarFill)" stroke="#a18bff" stroke-width="2" stroke-linejoin="round"/>${dots}</g>
    ${labs}</svg>`;
}

/* ===================== Canvas 绘制报告 ===================== */
function drawReportCanvas(){
  const d=reportData;
  if(!d) throw new Error("暂无报告数据");
  const W=760, PAD=44, CW=W-PAD*2, IPAD=22, IX=PAD+IPAD, IW=CW-IPAD*2;
  const FF='-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
  const meas=document.createElement('canvas').getContext('2d');

  function sf(ctx,size,w){ ctx.font=(w||'400')+' '+size+'px '+FF; }
  function wrap(ctx,text,maxW){
    const arr=[...String(text)], ls=[]; let ln='';
    for(const c of arr){
      if(c==='\n'){ ls.push(ln); ln=''; continue; }
      const t=ln+c;
      if(ctx.measureText(t).width>maxW && ln){ ls.push(ln); ln=c; } else ln=t;
    }
    if(ln) ls.push(ln);
    return ls;
  }
  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  const blocks=[];
  const spacer=h=>blocks.push({h:h,draw:()=>{}});
  function center(text,size,w,color,mb){
    blocks.push({h:size*1.25+(mb||0),draw:(ctx,y)=>{
      sf(ctx,size,w); ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.fillText(text,W/2,y);
    }});
  }
  function fullParas(text,color,size){
    size=size||12; const lh=1.5; sf(meas,size,'400');
    const ls=wrap(meas,text,CW);
    blocks.push({h:ls.length*size*lh+8,draw:(ctx,y)=>{
      sf(ctx,size,'400'); ctx.fillStyle=color; ctx.textAlign='left'; ctx.textBaseline='top';
      let yy=y; for(const l of ls){ ctx.fillText(l,PAD,yy); yy+=size*lh; }
    }});
  }
  function iHeading(text,color){
    return {h:17*1.3+12,draw:(ctx,y)=>{
      sf(ctx,17,'700'); ctx.fillStyle=color||'#ffffff'; ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(text,IX,y);
    }};
  }
  function iParas(text,color,size,lh){
    size=size||14; lh=lh||1.5; sf(meas,size,'400');
    const ls=wrap(meas,text,IW);
    return {h:ls.length*size*lh,draw:(ctx,y)=>{
      sf(ctx,size,'400'); ctx.fillStyle=color||'#cfcce4'; ctx.textAlign='left'; ctx.textBaseline='top';
      let yy=y; for(const l of ls){ ctx.fillText(l,IX,yy); yy+=size*lh; }
    }};
  }
  function iTip(icon,text){
    const size=14, lh=1.45, ind=26; sf(meas,size,'400');
    const ls=wrap(meas,text,IW-ind);
    return {h:ls.length*size*lh+10,draw:(ctx,y)=>{
      sf(ctx,size,'400'); ctx.textBaseline='top'; ctx.textAlign='left';
      ctx.fillStyle='#ffffff'; ctx.fillText(icon,IX,y);
      ctx.fillStyle='#cfcce4'; let yy=y;
      for(const l of ls){ ctx.fillText(l,IX+ind,yy); yy+=size*lh; }
    }};
  }
  function iRadar(){
    const H=300, vals=d.radar.vals, labels=d.radar.labels, colors=d.radar.colors, n=vals.length;
    return {h:H,draw:(ctx,y)=>{
      const cxr=W/2, cyr=y+135, R=105;
      const ang=i=>-Math.PI/2+i*2*Math.PI/n;
      const pt=(i,r)=>[cxr+r*Math.cos(ang(i)),cyr+r*Math.sin(ang(i))];
      ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
      for(let g=1;g<=4;g++){ const r=R*g/4; ctx.beginPath();
        for(let i=0;i<n;i++){ const [x,yy]=pt(i,r); i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }
        ctx.closePath(); ctx.stroke(); }
      for(let i=0;i<n;i++){ const [x,yy]=pt(i,R); ctx.beginPath(); ctx.moveTo(cxr,cyr); ctx.lineTo(x,yy); ctx.stroke(); }
      ctx.beginPath();
      for(let i=0;i<n;i++){ const [x,yy]=pt(i,R*vals[i]/100); i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }
      ctx.closePath();
      const grad=ctx.createRadialGradient(cxr,cyr,0,cxr,cyr,R);
      grad.addColorStop(0,'rgba(127,90,240,0.55)'); grad.addColorStop(1,'rgba(44,177,188,0.32)');
      ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#a18bff'; ctx.lineWidth=2; ctx.stroke();
      for(let i=0;i<n;i++){ const [x,yy]=pt(i,R*vals[i]/100);
        ctx.beginPath(); ctx.arc(x,yy,4,0,Math.PI*2); ctx.fillStyle=colors[i]; ctx.fill();
        ctx.strokeStyle='#1a1730'; ctx.lineWidth=1.5; ctx.stroke(); }
      for(let i=0;i<n;i++){ const [lx,ly]=pt(i,R+22);
        const al=lx>cxr+5?'left':lx<cxr-5?'right':'center';
        sf(ctx,13,'400'); ctx.fillStyle='#cfcce4'; ctx.textAlign=al; ctx.textBaseline='top'; ctx.fillText(labels[i],lx,ly);
        sf(ctx,12,'700'); ctx.fillStyle=colors[i]; ctx.fillText(String(vals[i]),lx,ly+16); }
    }};
  }
  function card(border,bg,inner){
    let ih=0; inner.forEach(b=>ih+=b.h);
    const h=ih+IPAD*2;
    blocks.push({h:h+14,draw:(ctx,y)=>{
      rr(ctx,PAD,y,CW,h,16); ctx.fillStyle=bg; ctx.fill();
      ctx.lineWidth=1; ctx.strokeStyle=border; ctx.stroke();
      let yy=y+IPAD; inner.forEach(b=>{ b.draw(ctx,yy); yy+=b.h; });
    }});
  }

  spacer(PAD);
  center(d.emoji,54,'400','#ffffff',8);
  center(d.code,12,'700','#9b97bd',8);
  center(d.title,26,'800',d.color,18);

  blocks.push({h:84,draw:(ctx,y)=>{
    const num=String(d.pct);
    sf(ctx,46,'800'); const nw=ctx.measureText(num).width;
    sf(ctx,18,'400'); const sw=ctx.measureText('/100').width;
    const sx=W/2-(nw+sw)/2;
    sf(ctx,46,'800'); ctx.fillStyle=d.color; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(num,sx,y);
    sf(ctx,18,'400'); ctx.fillStyle='#9b97bd'; ctx.fillText('/100',sx+nw,y+24);
    sf(ctx,12,'400'); ctx.fillStyle='#9b97bd'; ctx.textAlign='center'; ctx.fillText(d.indexLabel,W/2,y+58);
  }});

  blocks.push({h:60,draw:(ctx,y)=>{
    const bx=PAD, bw=CW;
    rr(ctx,bx,y,bw,14,7);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,'#f5576c'); g.addColorStop(.5,'#f9d423'); g.addColorStop(1,'#2cb1bc');
    ctx.fillStyle=g; ctx.fill();
    const mx=bx+bw*d.pct/100;
    ctx.fillStyle='#ffffff'; rr(ctx,mx-2,y-6,4,26,2); ctx.fill();
    sf(ctx,11,'400'); ctx.fillStyle='#9b97bd'; ctx.textBaseline='top';
    const L=d.levelLabels, n=L.length;
    for(let i=0;i<n;i++){
      const tx=bx+bw*i/(n-1);
      ctx.textAlign=i===0?'left':i===n-1?'right':'center';
      ctx.fillText(L[i],tx,y+22);
    }
  }});

  const cb='rgba(255,255,255,0.12)', cbg='rgba(255,255,255,0.05)';
  card(cb,cbg,[iHeading(d.pictureTitle),iParas(d.picture)]);
  if(d.radar) card(cb,cbg,[iHeading('📡 五维思考力雷达'),iRadar()]);
  card(cb,cbg,[iHeading(d.prescriptionTitle)].concat(d.tips.map(t=>iTip('✅',t))));

  if(d.parent){
    const p=d.parent;
    center('— 家长报告 —',12,'700','#9b97bd',8);
    card(p.color+'66',cbg,[iHeading(p.emoji+' 孩子目前属于「'+p.title+'」',p.color),iParas(p.summary)]);
    card(cb,cbg,[iHeading('📊 五维度逐项解读')].concat(p.dims.map(x=>iTip(x.ok?'🟢':'🔧',x.text))));
    card('rgba(127,90,240,0.35)','rgba(127,90,240,0.12)',[iHeading('🧭 家长行动建议'),iParas(p.advice)]);
    if(p.notice) fullParas(p.notice,'#9b97bd',12);
  }

  spacer(10);
  d.quote.split('\n').forEach(l=>center(l,14,'400','#9b97bd',4));
  spacer(8);
  center('AI 学习力自我评测 · 测评报告',11,'400','#6b6890',0);
  spacer(PAD);

  /* —— 尺寸上限保护，防手机端画布过高变空白 —— */
  let H=0; blocks.forEach(b=>H+=b.h); H=Math.ceil(H);
  let scale=2;
  if(H*scale>4000) scale=4000/H;
  if(scale<1) scale=1;
  const cv=document.createElement('canvas');
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  const ctx=cv.getContext('2d');
  ctx.scale(scale,scale);
  const bgg=ctx.createLinearGradient(0,0,0,H);
  bgg.addColorStop(0,'#1b1733'); bgg.addColorStop(1,'#221d3a');
  ctx.fillStyle=bgg; ctx.fillRect(0,0,W,H);
  let y=0; blocks.forEach(b=>{ b.draw(ctx,y); y+=b.h; });
  return cv;
}

/* ===================== 保存为图片 ===================== */
function closeModal(){
  document.getElementById("imgModal").style.display="none";
}

function saveReport(){
  const modal=document.getElementById("imgModal");
  const body=document.getElementById("modalBody");
  const dl=document.getElementById("dlLink");
  if(!reportData){ alert("请先完成测评再保存报告"); return; }

  body.innerHTML='<div class="spinner"></div>';
  dl.style.display="none";
  modal.style.display="flex";

  setTimeout(function(){
    try{
      const canvas=drawReportCanvas();
      let dataURL;
      try{ dataURL=canvas.toDataURL("image/png"); }
      catch(err){ dataURL=canvas.toDataURL("image/jpeg",0.92); }
      if(!dataURL || dataURL.length<200) throw new Error("画布导出为空");
      const img=new Image();
      img.alt="评测报告";
      img.src=dataURL;
      body.innerHTML=""; body.appendChild(img);
      dl.href=dataURL; dl.style.display="block";
    }catch(e){
      body.innerHTML='<p style="color:#f5576c;font-size:14px;padding:18px 0;line-height:1.7">生成图片失败：'+(e&&e.message?e.message:e)+'<br>请改用手机系统自带的「截屏」功能保存本页。</p>';
    }
  },50);
}
</script>
